#
# Installed as /etc/tmpfiles.d/banlieue-cloud-hypervisor.conf by
# `banlieue host cloud-hypervisor install` (ADR-0067). /run is a tmpfs, so the run
# root is recreated at every boot, before the provider starts.
# 0711: a guest can reach its own run directory, not list the others'.
d @RUN_PARENT@ 0755 root root -
d @RUN_ROOT@ 0711 @BANLIEUE_USER@ @BANLIEUE_USER@ -
