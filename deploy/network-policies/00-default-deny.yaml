#
# Default deny, ingress and egress, for every banlieue pod in the namespace
# this is applied to (ADR-0094). Apply it together with the allow policies in
# this directory: on its own it cuts every banlieue pod off from the API
# server and DNS.
#
# It selects app.kubernetes.io/name=banlieue only, so other workloads in the
# namespace (for example kairos-operator's OSArtifact build pods in
# banlieue-imagebuild) are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banlieue-default-deny
  labels:
    app.kubernetes.io/name: banlieue
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: banlieue
  policyTypes:
    - Ingress
    - Egress
