# Allow list for banlieue-controller (ADR-0094): API server and DNS out,
# metrics and health in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banlieue-controller
  labels:
    app.kubernetes.io/name: banlieue
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: banlieue
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrapes, only from namespaces labelled
    # banlieue.io/monitoring=true:
    #   kubectl label namespace <monitoring-ns> banlieue.io/monitoring=true
    - from:
        - namespaceSelector:
            matchLabels:
              banlieue.io/monitoring: "true"
      ports:
        - protocol: TCP
          port: metrics
    # Liveness and readiness probes. The kubelet does not connect from a pod,
    # so this port is open to any source.
    - ports:
        - protocol: TCP
          port: health
  egress:
    # DNS: cluster DNS pods only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server. Its address is per cluster, so this rule has no
    # "to" and allows any address on the two usual API ports. Narrow it by
    # adding your cluster's API server address, for example:
    #   - to:
    #       - ipBlock:
    #           cidr: 192.0.2.10/32
    #     ports: ...
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
