#
# Allow list for the Azure provider (ADR-0094, ADR-0164), spawned by the
# operator: API server, DNS and HTTPS to Azure out, metrics and health in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: banlieue-provider-azure
  labels:
    app.kubernetes.io/name: banlieue
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: banlieue
      app.kubernetes.io/component: provider-azure
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Prometheus scrapes, only from namespaces labelled
    # banlieue.io/monitoring=true:
    #   kubectl label namespace <monitoring-ns> banlieue.io/monitoring=true
    - from:
        - namespaceSelector:
            matchLabels:
              banlieue.io/monitoring: "true"
      ports:
        - protocol: TCP
          port: metrics
    # Liveness and readiness probes. The kubelet does not connect from a pod,
    # so this port is open to any source.
    - ports:
        - protocol: TCP
          port: health
  egress:
    # DNS: cluster DNS pods only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes API server. Its address is per cluster, so this rule has no
    # "to" and allows any address on the two usual API ports. Narrow it by
    # adding your cluster's API server address, for example:
    #   - to:
    #       - ipBlock:
    #           cidr: 192.0.2.10/32
    #     ports: ...
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Azure Resource Manager (the Provider's spec.connection.endpoint) and
    # Entra ID (the token exchange, spec.connection.azure.authorityHost). Both
    # are global anycast front ends whose addresses Microsoft changes without
    # notice and publishes only as service tags, which a NetworkPolicy cannot
    # name, so this rule cannot be IP-pinned and allows any address on 443.
    # Pin it with an egress proxy or a CNI that matches FQDNs, if you have one.
    - ports:
        - protocol: TCP
          port: 443
    # OpenBao, when the Provider declares spec.connection.azure.openbao
    # (ADR-0176): the provider also logs in to the address named there.
    # TCP 443 above covers it when OpenBao listens on 443. For any other port
    # add a rule scoped to OpenBao's address; this file does not open one:
    #   - to:
    #       - ipBlock:
    #           cidr: 192.0.2.20/32
    #     ports:
    #       - protocol: TCP
    #         port: 8200
