apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: cloudhypervisormachinetemplates.infrastructure.banlieue.io
spec:
  group: infrastructure.banlieue.io
  names:
    kind: CloudHypervisorMachineTemplate
    plural: cloudhypervisormachinetemplates
    shortNames:
    - chmt
    singular: cloudhypervisormachinetemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CloudHypervisorMachineTemplate — a stamped-out CloudHypervisorMachine spec.

          CAPI requires an InfraMachineTemplate so a MachineSet or MachineDeployment
          can mint identical machines. A spec template, not a disk template: nothing
          clones a guest, which is what keeps per-VM vTPMs unique (ADR-0040).
        properties:
          spec:
            description: |-
              CloudHypervisorMachineTemplate — a stamped-out CloudHypervisorMachine spec.

              CAPI requires an InfraMachineTemplate so a MachineSet or MachineDeployment
              can mint identical machines. A spec template, not a disk template: nothing
              clones a guest, which is what keeps per-VM vTPMs unique (ADR-0040).
            properties:
              template:
                description: The spec stamped into every machine created from this template.
                properties:
                  spec:
                    description: The CloudHypervisorMachine spec for machines created from this template.
                    properties:
                      bootSource:
                        description: Where the OS disk comes from.
                        properties:
                          image:
                            description: |-
                              The image in the host's image cache: an installed raw disk for
                              [`Image`](ChBootSourceKind::Image), the installer ISO for
                              [`InstallMedia`](ChBootSourceKind::InstallMedia).
                            type: string
                          kind:
                            description: Which provisioning shape this machine uses.
                            enum:
                            - image
                            - installMedia
                            type: string
                        required:
                        - image
                        - kind
                        type: object
                      cpus:
                        description: Virtual CPUs.
                        properties:
                          boot:
                            description: vCPUs the guest boots with.
                            maximum: 256.0
                            minimum: 1.0
                            type: integer
                          max:
                            description: |-
                              Hotplug headroom: the most vCPUs the guest may be resized to. Fixed
                              when the VM is created. `None` means no headroom.
                            maximum: 256.0
                            minimum: 1.0
                            nullable: true
                            type: integer
                        required:
                        - boot
                        type: object
                      desiredPowerState:
                        default: PoweredOn
                        description: Desired power state, resolved from the parent `VirtualMachine`.
                        enum:
                        - PoweredOn
                        - PoweredOff
                        - Suspended
                        type: string
                      failureDomain:
                        description: |-
                          CAPI contract (optional): failure domain placement. One host is one
                          failure domain on this backend, as on libvirt.
                        nullable: true
                        type: string
                      firstBootSealing:
                        description: |-
                          First-boot sealing the guest must report before `GuestReady`
                          (ADR-0088, ADR-0112), copied by `banlieue-controller` from the parent
                          `VirtualMachine`'s `VMImage.spec.firstBootSealing` when the class is
                          `tpmEnabled`. The guest reports over its vsock (`sealed=` beside
                          `phase=installed`). `None` for every other machine, which keeps
                          today's `GuestReady` meaning unchanged.
                        nullable: true
                        properties:
                          partitions:
                            default:
                            - COS_PERSISTENT
                            description: |-
                              Kairos partition labels to seal on first boot. Defaults to
                              `[COS_PERSISTENT]`. `COS_OEM`, `COS_STATE`, `COS_RECOVERY` and
                              `COS_GRUB` are refused at admission, mirroring Kairos's own refusal.
                            items:
                              type: string
                            minItems: 1
                            type: array
                          timeoutSeconds:
                            default: 600
                            description: |-
                              Seconds from the machine's power-on (its infrastructure `Ready`
                              transition) within which the guest must report every listed partition
                              sealed; after that `GuestReady` is `False` with reason
                              `FirstBootSealingTimeout`. A clone that cannot seal halts in its
                              initramfs and never reports anything, so this is how it is noticed.
                            maximum: 86400.0
                            minimum: 60.0
                            type: integer
                        type: object
                      identity:
                        description: |-
                          The guest identity this machine carries when it is not its own: set by
                          `banlieue-controller` on a move's destination machine to the source's
                          identity (ADR-0127 Decision 6). The provider derives the MAC, tap names,
                          machine directory and EK certificate subject from it instead of from
                          this machine's name and UID, so a moved guest keeps all of them. Absent
                          on every machine that was never the destination of a move. Immutable.
                        nullable: true
                        properties:
                          name:
                            description: The original machine's name.
                            type: string
                          uid:
                            description: The original machine's UID.
                            type: string
                        required:
                        - name
                        - uid
                        type: object
                        x-kubernetes-validations:
                        - message: identity is immutable
                          rule: self == oldSelf
                      memory:
                        description: Guest memory.
                        properties:
                          hugepages:
                            default: false
                            description: |-
                              Back guest memory with hugepages. The host reports hugepages as their
                              own capacity, since they are reserved rather than allocated on demand.
                            type: boolean
                          sizeMiB:
                            description: Guest memory in MiB.
                            maximum: 4194304.0
                            minimum: 128.0
                            type: integer
                        required:
                        - sizeMiB
                        type: object
                      moveIn:
                        description: |-
                          This machine is a move's destination (ADR-0127 Decision 4). Set by
                          `banlieue-controller` at creation; the host provider prepares to receive.
                        nullable: true
                        properties:
                          commit:
                            description: |-
                              Resume the received guest. Written only after the source reported
                              `Sent` and its VMM exited (Decision 5); never written with the source's
                              `abort`. One way.
                            type: boolean
                          moveId:
                            description: The `VirtualMachineMove` this machine receives. Immutable.
                            type: string
                            x-kubernetes-validations:
                            - message: moveIn.moveId is immutable
                              rule: self == oldSelf
                          peer:
                            description: The source host, once it has published its certificate.
                            nullable: true
                            properties:
                              certificate:
                                description: The peer's per-move certificate, PEM.
                                type: string
                              endpoint:
                                description: |-
                                  `host:port` the destination listens on. Set only on the source's
                                  `moveOut.peer`: the source connects, the destination listens.
                                nullable: true
                                type: string
                            required:
                            - certificate
                            type: object
                        required:
                        - moveId
                        type: object
                      moveOut:
                        description: |-
                          This machine is a move's source (ADR-0127 Decision 4). Set by
                          `banlieue-controller`; the host provider copies the guest out.
                        nullable: true
                        properties:
                          abort:
                            description: |-
                              Give up before commit: resume the guest here (Decision 12). One way;
                              never written once the destination's `commit` is.
                            type: boolean
                          cutover:
                            description: Pause the guest and send the disk delta and the VMM state. One way.
                            type: boolean
                          moveId:
                            description: The `VirtualMachineMove` this machine sends. Immutable.
                            type: string
                            x-kubernetes-validations:
                            - message: moveOut.moveId is immutable
                              rule: self == oldSelf
                          peer:
                            description: |-
                              The destination host, once it has published its certificate and
                              endpoint.
                            nullable: true
                            properties:
                              certificate:
                                description: The peer's per-move certificate, PEM.
                                type: string
                              endpoint:
                                description: |-
                                  `host:port` the destination listens on. Set only on the source's
                                  `moveOut.peer`: the source connects, the destination listens.
                                nullable: true
                                type: string
                            required:
                            - certificate
                            type: object
                        required:
                        - moveId
                        type: object
                      nics:
                        description: Network interfaces.
                        items:
                          description: One network interface.
                          properties:
                            ipam:
                              description: IP address management for this interface.
                              properties:
                                pool:
                                  description: Pool-based IPAM parameters.
                                  nullable: true
                                  properties:
                                    poolRef:
                                      description: |-
                                        Typed reference (apiGroup + kind + name + optional namespace).

                                        Used wherever the referenced kind is pluggable — e.g. IPAM pools, where we
                                        want to accept either `ipam.cluster.x-k8s.io/IPAddressClaim` (CAPI's
                                        default) or future banlieue-native pool types.
                                      properties:
                                        apiGroup:
                                          type: string
                                        kind:
                                          type: string
                                        name:
                                          type: string
                                        namespace:
                                          nullable: true
                                          type: string
                                      required:
                                      - apiGroup
                                      - kind
                                      - name
                                      type: object
                                  required:
                                  - poolRef
                                  type: object
                                static:
                                  description: Static IPAM parameters (address, prefix, gateway, nameservers, domain).
                                  nullable: true
                                  properties:
                                    address:
                                      type: string
                                    domain:
                                      description: |-
                                        DNS domain, used both as a DNS search domain and (by a
                                        `VirtualMachine.spec.networkOverrides` consumer, ADR-0024) to build
                                        an FQDN as `<vm-name>.<domain>`.
                                      nullable: true
                                      type: string
                                    gateway:
                                      nullable: true
                                      type: string
                                    nameservers:
                                      items:
                                        type: string
                                      type: array
                                    prefix:
                                      maximum: 255.0
                                      minimum: 0.0
                                      type: integer
                                  required:
                                  - address
                                  - prefix
                                  type: object
                              type: object
                            macAddress:
                              description: |-
                                Optional MAC address. The provider derives a stable one from the
                                machine UID otherwise, so the address survives a restart.
                              nullable: true
                              type: string
                            name:
                              description: Stable NIC name; echoed in status.
                              type: string
                            networkClass:
                              description: |-
                                Network class: a name the host resolves to one of its bridges. Never
                                a bridge name from the cluster.
                              type: string
                          required:
                          - ipam
                          - name
                          - networkClass
                          type: object
                        maxItems: 16
                        type: array
                      osDiskSizeGiB:
                        description: |-
                          OS disk size in GiB. Required, and grown to before first boot; never
                          shrunk. Must be at least the image's size.
                        maximum: 65536.0
                        minimum: 1.0
                        type: integer
                      providerID:
                        description: |-
                          CAPI contract: Provider ID for the resulting Node, if this VM becomes
                          a Kubernetes node. Format:
                          `cloudhypervisor://<provider-name>/<machine-uid>`. Set by the provider
                          once the guest exists.
                        nullable: true
                        type: string
                      providerRef:
                        description: The `Provider` for the one host that runs this machine (ADR-0060).
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      storageClass:
                        description: |-
                          Storage class the machine's disks live in. A name the host declares
                          in its local config and publishes on its failure domain; never a
                          path.
                        type: string
                      tpmEnabled:
                        default: false
                        description: |-
                          Attach a vTPM (swtpm), resolved from the VM's `VMClass.spec.tpmEnabled`.
                          Requires [`ChBootSourceKind::InstallMedia`] (ADR-0040, ADR-0048,
                          ADR-0065), or an image that seals itself on first boot
                          ([`Self::first_boot_sealing`], ADR-0088, ADR-0112).
                        type: boolean
                      userData:
                        description: |-
                          Guest bootstrap payload, already resolved and placeholder-substituted
                          by `banlieue-controller` (ADR-0025, ADR-0038). Rendered into a
                          NoCloud `CIDATA` seed disk; the provider reads no Secret or ConfigMap.
                        nullable: true
                        type: string
                    required:
                    - bootSource
                    - cpus
                    - memory
                    - nics
                    - osDiskSizeGiB
                    - providerRef
                    - storageClass
                    type: object
                    x-kubernetes-validations:
                    - message: identity is set when the machine is created, or never
                      rule: has(self.identity) == has(oldSelf.identity)
                required:
                - spec
                type: object
            required:
            - template
            type: object
        required:
        - spec
        title: CloudHypervisorMachineTemplate
        type: object
    served: true
    storage: true
