apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: firecrackermachinetemplates.infrastructure.banlieue.io
spec:
  group: infrastructure.banlieue.io
  names:
    kind: FirecrackerMachineTemplate
    plural: firecrackermachinetemplates
    shortNames:
    - fcmt
    singular: firecrackermachinetemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FirecrackerMachineTemplate: a stamped-out FirecrackerMachine spec.

          CAPI requires an InfraMachineTemplate so a MachineSet or MachineDeployment
          can mint identical machines. A spec template, not a disk template: it
          carries no per-VM identity (ADR-0108).
        properties:
          spec:
            description: |-
              FirecrackerMachineTemplate: a stamped-out FirecrackerMachine spec.

              CAPI requires an InfraMachineTemplate so a MachineSet or MachineDeployment
              can mint identical machines. A spec template, not a disk template: it
              carries no per-VM identity (ADR-0108).
            properties:
              template:
                description: The spec stamped into every machine created from this template.
                properties:
                  spec:
                    description: The FirecrackerMachine spec for machines created from this template.
                    properties:
                      desiredPowerState:
                        default: PoweredOn
                        description: Desired power state, resolved from the parent `VirtualMachine`.
                        enum:
                        - PoweredOn
                        - PoweredOff
                        - Suspended
                        type: string
                      failureDomain:
                        description: |-
                          CAPI contract (optional): failure domain placement. One host is one
                          failure domain on this backend.
                        nullable: true
                        type: string
                      image:
                        description: |-
                          The image to boot: `<repository>@sha256:<manifest digest>`, the
                          resolved `ref` of the `VMImage`'s `OciArtifact` source (ADR-0142
                          Decision 2). The host pulls only a digest in the repository it pins;
                          the cluster says which image, never where images may come from.
                        type: string
                      memoryMiB:
                        description: |-
                          Guest memory in MiB. Fixed at boot, and must cover the image's RAM
                          overlay as well as its working set (ADR-0142 Decision 4): the provider
                          refuses a value below the image's declared minimum.
                        maximum: 1048576.0
                        minimum: 128.0
                        type: integer
                      nics:
                        description: |-
                          Network interfaces. One tap each, on the host's private bridge for the
                          network class (ADR-0137 Decision 5).
                        items:
                          description: One network interface.
                          properties:
                            ipam:
                              description: |-
                                IP address management for this interface. The address and gateway are
                                passed to the guest on its kernel command line (ADR-0137 Decision 5).
                              properties:
                                pool:
                                  description: Pool-based IPAM parameters.
                                  nullable: true
                                  properties:
                                    poolRef:
                                      description: |-
                                        Typed reference (apiGroup + kind + name + optional namespace).

                                        Used wherever the referenced kind is pluggable — e.g. IPAM pools, where we
                                        want to accept either `ipam.cluster.x-k8s.io/IPAddressClaim` (CAPI's
                                        default) or future banlieue-native pool types.
                                      properties:
                                        apiGroup:
                                          type: string
                                        kind:
                                          type: string
                                        name:
                                          type: string
                                        namespace:
                                          nullable: true
                                          type: string
                                      required:
                                      - apiGroup
                                      - kind
                                      - name
                                      type: object
                                  required:
                                  - poolRef
                                  type: object
                                static:
                                  description: Static IPAM parameters (address, prefix, gateway, nameservers, domain).
                                  nullable: true
                                  properties:
                                    address:
                                      type: string
                                    domain:
                                      description: |-
                                        DNS domain, used both as a DNS search domain and (by a
                                        `VirtualMachine.spec.networkOverrides` consumer, ADR-0024) to build
                                        an FQDN as `<vm-name>.<domain>`.
                                      nullable: true
                                      type: string
                                    gateway:
                                      nullable: true
                                      type: string
                                    nameservers:
                                      items:
                                        type: string
                                      type: array
                                    prefix:
                                      maximum: 255.0
                                      minimum: 0.0
                                      type: integer
                                  required:
                                  - address
                                  - prefix
                                  type: object
                              type: object
                            macAddress:
                              description: |-
                                Optional MAC address. The provider derives a stable one from the
                                machine UID otherwise.
                              nullable: true
                              type: string
                            name:
                              description: Stable NIC name; echoed in status.
                              type: string
                            networkClass:
                              description: |-
                                Network class: a name the host resolves to one of its bridges. Never a
                                bridge name from the cluster.
                              type: string
                          required:
                          - ipam
                          - name
                          - networkClass
                          type: object
                        maxItems: 8
                        type: array
                      providerID:
                        description: |-
                          CAPI contract: Provider ID for the resulting Node, if this VM becomes
                          a Kubernetes node. Format: `firecracker://<provider-name>/<machine-uid>`.
                          Set by the provider once the guest exists.
                        nullable: true
                        type: string
                      providerRef:
                        description: |-
                          The `Provider` for the one host that runs this machine. Shared-capable
                          from the first commit (ADR-0133): the namespace may name a `Provider`
                          outside the machine's own, which only `banlieue-controller` may set.
                        properties:
                          name:
                            description: Name of the `Provider`.
                            type: string
                          namespace:
                            description: |-
                              Namespace of the `Provider`. Defaults to the referrer's namespace.

                              Only `banlieue-controller` may set this: a machine naming a provider in
                              another namespace is a placement that skipped scheduling, so an
                              admission policy reserves the field to the controller's identity.
                            nullable: true
                            type: string
                        required:
                        - name
                        type: object
                      userData:
                        description: |-
                          Guest bootstrap payload, already resolved and placeholder-substituted
                          by `banlieue-controller` (ADR-0025, ADR-0038). Rendered into a NoCloud
                          seed drive, attached read-only second; the provider reads no Secret or
                          ConfigMap (ADR-0137 Decision 4, ADR-0054).
                        nullable: true
                        type: string
                      vcpus:
                        description: |-
                          Virtual CPUs. Fixed at boot: there is no hotplug (ADR-0137 Decision 7),
                          so a `VMClass` change is a `Recreate`.
                        maximum: 32.0
                        minimum: 1.0
                        type: integer
                    required:
                    - image
                    - memoryMiB
                    - nics
                    - providerRef
                    - vcpus
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        required:
        - spec
        title: FirecrackerMachineTemplate
        type: object
    served: true
    storage: true
