apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualmachines.banlieue.io
spec:
  group: banlieue.io
  names:
    categories: []
    kind: VirtualMachine
    plural: virtualmachines
    shortNames:
    - vm
    singular: virtualmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.classRef.name
      name: Class
      type: string
    - jsonPath: .spec.imageRef.name
      name: Image
      type: string
    - jsonPath: .status.scheduled.providerName
      name: Provider
      type: string
    - jsonPath: .status.scheduled.failureDomain
      name: FailureDomain
      priority: 1
      type: string
    - jsonPath: .status.observedPowerState
      name: Power
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VirtualMachine — the user-facing request for a running VM.

          This is the one resource end users create. It expresses *intent*: which
          VMClass (shape) and VMImage (OS) to use, optional placement constraints,
          the desired power state, and optional guest user-data. banlieue's
          controller schedules it onto a Provider + failure domain, creates the
          matching provider infrastructure CR (e.g. `VSphereMachine`), and mirrors
          that CR's status back here.

          # Why create one

          - **Declare a VM the Kubernetes way.** Describe the VM you want; the
            controller reconciles reality toward it, including power state.
          - **Stay backend-agnostic.** You reference a class and an image by name,
            not a datastore or a port group. Where it lands is the scheduler's job.
          - **Compose with policy.** Label / anti-affinity selectors and a migration
            policy steer placement and drift handling without coupling to a specific
            Provider.

          Independent of Cluster API: a VirtualMachine is **not** a `clusterv1.
          Machine`. It can coexist with CAPI but does not depend on it.

          Namespaced: candidate Providers are drawn from the VM's own namespace.
        properties:
          spec:
            description: |-
              VirtualMachine — the user-facing request for a running VM.

              This is the one resource end users create. It expresses *intent*: which
              VMClass (shape) and VMImage (OS) to use, optional placement constraints,
              the desired power state, and optional guest user-data. banlieue's
              controller schedules it onto a Provider + failure domain, creates the
              matching provider infrastructure CR (e.g. `VSphereMachine`), and mirrors
              that CR's status back here.

              # Why create one

              - **Declare a VM the Kubernetes way.** Describe the VM you want; the
                controller reconciles reality toward it, including power state.
              - **Stay backend-agnostic.** You reference a class and an image by name,
                not a datastore or a port group. Where it lands is the scheduler's job.
              - **Compose with policy.** Label / anti-affinity selectors and a migration
                policy steer placement and drift handling without coupling to a specific
                Provider.

              Independent of Cluster API: a VirtualMachine is **not** a `clusterv1.
              Machine`. It can coexist with CAPI but does not depend on it.

              Namespaced: candidate Providers are drawn from the VM's own namespace.
            properties:
              classRef:
                description: Reference to a (cluster-scoped) VMClass.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              desiredPowerState:
                default: PoweredOn
                description: Desired power state. Defaults to `PoweredOn`.
                enum:
                - PoweredOn
                - PoweredOff
                - Suspended
                type: string
              folder:
                description: |-
                  Destination folder for the provisioned VM (e.g. `apps/prod` on
                  vSphere). When unset, the provider defaults to organizing the VM
                  the same way it organizes its source template — on vSphere, the
                  same per-zone folder the template lives in (ADR-0020 Decision #5).

                  Unlike `networkOverrides` / `hardwareOverride`, this has no
                  `VMClass`-level counterpart to be a delta *against* — placement is
                  purely an infrastructure concern, not part of a VM's abstract
                  shape. It is also the one field here that is unavoidably
                  backend-flavored (a "folder" is a vSphere concept); other backends
                  may interpret it differently or ignore it.
                nullable: true
                type: string
              hardwareOverride:
                description: |-
                  Per-VM override for the `VMClass`'s hardware shape — CPUs, memory,
                  and disk sizes.

                  **This is a delta, not the primary definition.** The `VMClass` is the
                  authoritative source for a VM's hardware shape: its `spec.hardware`
                  is fixed and shared by every VM that references the class. This
                  field applies *on top of* the class — only the fields you set here
                  replace the class value; everything else is inherited verbatim.

                  Use this sparingly. Its primary purpose is to accommodate the rare
                  VM that genuinely needs a different CPU, memory, or disk budget than
                  its class defines — for example, a database primary bumped to 16 CPUs
                  while all other replicas use the 4-CPU class shape, or one VM that
                  needs a larger data disk. If you find yourself setting the same
                  override on every VM of a given class, create a new `VMClass` instead.
                nullable: true
                properties:
                  cpus:
                    description: |-
                      Override the `VMClass`'s `spec.hardware.cpus`.
                      If absent, the class value is used unchanged.
                    format: uint32
                    maximum: 256.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  diskOverrides:
                    description: |-
                      Per-disk size overrides, keyed by `DiskSpec.name`.
                      Only `sizeGiB` can be overridden per VM; the disk's `storageClass`
                      and `provisioning` are class-level concerns.

                      **This is a delta, not the primary definition.** A disk with no
                      entry here inherits the `VMClass`'s size verbatim.
                    items:
                      description: |-
                        A per-VM size override for one `VMClass`-declared disk.

                        **This is a delta, not the primary definition.** The `VMClass` defines
                        the disk set; this struct lets a single VM request a larger size for
                        one of those disks (e.g. a bigger data volume) without altering the
                        shared class.
                      properties:
                        name:
                          description: Matches a `VMClass.spec.hardware.disks[].name`.
                          type: string
                        sizeGiB:
                          description: |-
                            Override the disk's `sizeGiB`. Must be ≥ the class value (the
                            provider will reject a shrink). If absent, the class size is used.
                          format: uint32
                          maximum: 65536.0
                          minimum: 1.0
                          type: integer
                      required:
                      - name
                      - sizeGiB
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  memoryMiB:
                    description: |-
                      Override the `VMClass`'s `spec.hardware.memoryMiB`.
                      If absent, the class value is used unchanged.
                    format: uint32
                    maximum: 4194304.0
                    minimum: 128.0
                    nullable: true
                    type: integer
                type: object
              imageRef:
                description: Reference to a (cluster-scoped) VMImage.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              migrationPolicy:
                default: automatic
                description: What to do when current placement no longer satisfies the spec.
                enum:
                - automatic
                - manual
                - never
                type: string
              networkOverrides:
                description: |-
                  Per-VM overrides for specific VMClass-declared network interfaces
                  (ADR-0024). Keyed by `NetworkInterfaceSpec.name`; an interface with
                  no entry here uses its VMClass's own `ipam` verbatim (commonly
                  `dhcp`). Lets many VMs share one VMClass while each still gets its
                  own static address — a VMClass-level `ipam.static` cannot express
                  that, since a class is shared by design.

                  **This is a delta, not the primary definition.** The VMClass is the
                  authoritative source for the VM's network shape. Entries here are
                  layered on top: only the named interface's `ipam` is replaced;
                  every other interface is inherited from the class unchanged.
                items:
                  description: |-
                    A per-VM static-address override for one `VMClass`-declared network
                    interface (ADR-0024).

                    **This is a delta, not the primary definition.** The `VMClass` is the
                    authoritative source for the VM's network shape. An entry here replaces
                    only the named interface's `ipam`; every other interface, and all other
                    attributes of the named interface, are inherited from the class unchanged.

                    Named `NetworkInterfaceOverride` (rather than reusing
                    `NetworkInterfaceSpec`) for the same reason as `HardwareOverride`: the
                    name signals layered intent — "a per-VM delta on top of a shared class"
                    — rather than a standalone definition.
                  properties:
                    name:
                      description: Matches a `VMClass.spec.network.interfaces[].name`.
                      type: string
                    static:
                      description: |-
                        The static address to use for this interface, overriding whatever
                        the `VMClass`'s own `ipam` declares.
                      properties:
                        address:
                          type: string
                        domain:
                          description: |-
                            DNS domain, used both as a DNS search domain and (by a
                            `VirtualMachine.spec.networkOverrides` consumer, ADR-0024) to build
                            an FQDN as `<vm-name>.<domain>`.
                          nullable: true
                          type: string
                        gateway:
                          nullable: true
                          type: string
                        nameservers:
                          items:
                            type: string
                          type: array
                        prefix:
                          format: uint8
                          maximum: 255.0
                          minimum: 0.0
                          type: integer
                      required:
                      - address
                      - prefix
                      type: object
                  required:
                  - name
                  - static
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              paused:
                description: Suspend reconciliation in-band.
                type: boolean
              placement:
                default: {}
                description: |-
                  Placement intent. If unset, the scheduler considers every Provider
                  in the VM's namespace and every failure domain.
                properties:
                  antiAffinity:
                    description: |-
                      Anti-affinity rules against other VirtualMachines in the same
                      namespace. Evaluated at scheduling time.
                    items:
                      description: |-
                        A rule that spreads this VM away from other VirtualMachines across a
                        failure-domain topology key, evaluated at scheduling time.
                      properties:
                        labelSelector:
                          description: Other VMs (by their own metadata.labels) to spread away from.
                          properties:
                            matchExpressions:
                              items:
                                properties:
                                  key:
                                    type: string
                                  operator:
                                    enum:
                                    - In
                                    - NotIn
                                    - Exists
                                    - DoesNotExist
                                    type: string
                                  values:
                                    items:
                                      type: string
                                    type: array
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                            matchLabels:
                              additionalProperties:
                                type: string
                              type: object
                          type: object
                        mode:
                          default: required
                          description: Strictness. `required` filters candidates; `preferred` is best-effort.
                          enum:
                          - required
                          - preferred
                          type: string
                        topologyKey:
                          description: |-
                            A label key from the failure domain's labels. Spreading is required
                            across distinct values of this key.
                            Common keys: `cluster`, `rack`, `host`, `dc`.
                          type: string
                      required:
                      - labelSelector
                      - topologyKey
                      type: object
                    type: array
                  failureDomainSelector:
                    description: |-
                      Match failure domains by their `status.failureDomains[].labels`.
                      Across all candidate Providers, only failure domains whose labels
                      match are considered.
                    nullable: true
                    properties:
                      matchExpressions:
                        items:
                          properties:
                            key:
                              type: string
                            operator:
                              enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                              type: string
                            values:
                              items:
                                type: string
                              type: array
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                  providerSelector:
                    description: |-
                      Match Providers by their `metadata.labels`. A Provider is a candidate
                      only if its labels match this selector.
                    nullable: true
                    properties:
                      matchExpressions:
                        items:
                          properties:
                            key:
                              type: string
                            operator:
                              enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                              type: string
                            values:
                              items:
                                type: string
                              type: array
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                type: object
              userData:
                description: |-
                  Optional user-data delivered to the guest via the image's
                  `guestAgent` (cloud-init / ignition / sysprep).
                nullable: true
                properties:
                  key:
                    default: user-data
                    description: |-
                      Key within the Secret containing the user-data blob.
                      Default: `user-data`.
                    type: string
                  secretRef:
                    description: Secret in the VirtualMachine's namespace.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                required:
                - secretRef
                type: object
            required:
            - classRef
            - imageRef
            type: object
          status:
            description: |-
              Observed state of a VirtualMachine: the scheduling decision, the infra CR
              it owns, mirrored provisioning / address / power state, and conditions.
            nullable: true
            properties:
              addresses:
                description: Mirrored from the infra CR's `status.addresses`.
                items:
                  description: A typed machine address. Mirrors CAPI's `clusterv1.MachineAddress`.
                  properties:
                    address:
                      description: The address itself.
                      type: string
                    type:
                      description: 'Address type. Accepted: Hostname, ExternalIP, InternalIP, ExternalDNS, InternalDNS.'
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: |-
                  Standard Kubernetes conditions. Required types:
                    `Ready`               — overall readiness
                    `Scheduled`           — placement decision exists and is current
                    `PlacementValid`      — current placement satisfies the spec
                    `InfrastructureReady` — mirrors the infra CR's Ready condition
                  Optional:
                    `Migrating`           — true while a migration is in progress
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              infrastructureRef:
                description: |-
                  Reference to the provider-specific infrastructure CR
                  (e.g. `infrastructure.banlieue.io/v1alpha1/VSphereMachine`).
                  Set after scheduling, owned by this VirtualMachine.
                nullable: true
                properties:
                  apiGroup:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    nullable: true
                    type: string
                required:
                - apiGroup
                - kind
                - name
                type: object
              initialization:
                default: {}
                description: Mirrored from the infra CR's `status.initialization`.
                properties:
                  provisioned:
                    description: |-
                      True when the infrastructure provider reports that the resource's
                      infrastructure is fully provisioned.
                    nullable: true
                    type: boolean
                type: object
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              observedPowerState:
                description: Observed power state from the provider.
                enum:
                - PoweredOn
                - PoweredOff
                - Suspended
                - null
                nullable: true
                type: string
              scheduled:
                description: Current scheduling decision. Absent until first successful schedule.
                nullable: true
                properties:
                  failureDomain:
                    description: Failure domain name (one of the Provider's `status.failureDomains[].name`).
                    type: string
                  providerClass:
                    description: Provider's ProviderClass (denormalized for convenience in printer columns).
                    type: string
                  providerName:
                    description: Provider name (in the VM's namespace).
                    type: string
                  resolvedNetworks:
                    description: Resolved network class → concrete backend identifier mappings.
                    items:
                      description: |-
                        One abstract class → concrete backend identifier mapping resolved at
                        schedule time.
                      properties:
                        backendId:
                          description: Backend identifier the provider resolved to (e.g. "ds-fast-01", "vmnet-prod").
                          type: string
                        className:
                          description: Class name as referenced in the VMClass (e.g. "gold", "prod").
                          type: string
                      required:
                      - backendId
                      - className
                      type: object
                    type: array
                  resolvedStorage:
                    description: Resolved storage class → concrete backend identifier mappings.
                    items:
                      description: |-
                        One abstract class → concrete backend identifier mapping resolved at
                        schedule time.
                      properties:
                        backendId:
                          description: Backend identifier the provider resolved to (e.g. "ds-fast-01", "vmnet-prod").
                          type: string
                        className:
                          description: Class name as referenced in the VMClass (e.g. "gold", "prod").
                          type: string
                      required:
                      - backendId
                      - className
                      type: object
                    type: array
                  scheduledAt:
                    description: Time the placement decision was made.
                    format: date-time
                    nullable: true
                    type: string
                required:
                - failureDomain
                - providerClass
                - providerName
                type: object
            type: object
        required:
        - spec
        title: VirtualMachine
        type: object
    served: true
    storage: true
    subresources:
      status: {}
