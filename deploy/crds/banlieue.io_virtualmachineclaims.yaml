apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualmachineclaims.banlieue.io
spec:
  group: banlieue.io
  names:
    kind: VirtualMachineClaim
    plural: virtualmachineclaims
    shortNames:
    - vmclaim
    singular: virtualmachineclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef.name
      name: Pool
      type: string
    - jsonPath: .status.virtualMachineRef.name
      name: VM
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VirtualMachineClaim: one subject's exclusive, time-boxed hold on one
          pool member.

          # What a claim guarantees

          - **Bound once, ever.** The member it binds is never handed to another
            subject, never returned to the warm set, and never reused. Release is
            always destruction.
          - **Deleting the claim destroys the VM**, and the claim object does not
            disappear until it has.
          - **`ttlSeconds` is a hard deadline**, not a grace period. At expiry the
            member is deleted whether or not the consumer is finished.

          # What a claim is not

          It is not a credential channel. `spec.subject` records *who* the member
          is for so the binding is auditable in the API server's own audit log; it
          is opaque to banlieue, and a token must never be placed in it. Delivering
          the subject's token to the guest is the consumer's job, over its own
          attested channel, using `status.nonce` to tie that session to this claim.
        properties:
          spec:
            description: |-
              VirtualMachineClaim: one subject's exclusive, time-boxed hold on one
              pool member.

              # What a claim guarantees

              - **Bound once, ever.** The member it binds is never handed to another
                subject, never returned to the warm set, and never reused. Release is
                always destruction.
              - **Deleting the claim destroys the VM**, and the claim object does not
                disappear until it has.
              - **`ttlSeconds` is a hard deadline**, not a grace period. At expiry the
                member is deleted whether or not the consumer is finished.

              # What a claim is not

              It is not a credential channel. `spec.subject` records *who* the member
              is for so the binding is auditable in the API server's own audit log; it
              is opaque to banlieue, and a token must never be placed in it. Delivering
              the subject's token to the guest is the consumer's job, over its own
              attested channel, using `status.nonce` to tie that session to this claim.
            properties:
              poolRef:
                description: The pool to take a member from. Same namespace as the claim.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              subject:
                description: |-
                  Who this member is for. Opaque to banlieue: recorded, mirrored onto
                  the member as annotations, and never interpreted.
                properties:
                  id:
                    description: |-
                      Stable subject identifier within that issuer (the `sub` / `oid`
                      claim), not a display name or e-mail.
                    type: string
                  issuer:
                    description: |-
                      Token issuer the subject was authenticated by, e.g. an OIDC issuer
                      URL.
                    type: string
                required:
                - id
                - issuer
                type: object
              ttlSeconds:
                description: |-
                  Hard lifetime in seconds, counted from binding rather than from
                  creation — a claim that waited ten minutes for capacity still gets
                  its full TTL. Required, with no default: a claim without a deadline
                  is a leaked VM, and the right value is a property of the workload.
                format: uint64
                minimum: 0.0
                type: integer
            required:
            - poolRef
            - subject
            - ttlSeconds
            type: object
          status:
            nullable: true
            properties:
              addresses:
                description: Mirrored from the bound member so a consumer needs one GET.
                items:
                  description: A typed machine address. Mirrors CAPI's `clusterv1.MachineAddress`.
                  properties:
                    address:
                      description: The address itself.
                      type: string
                    type:
                      description: 'Address type. Accepted: Hostname, ExternalIP, InternalIP, ExternalDNS, InternalDNS.'
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              boundAt:
                description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                format: date-time
                nullable: true
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              expiresAt:
                description: '`bound_at + spec.ttlSeconds`. The member is deleted at this instant.'
                format: date-time
                nullable: true
                type: string
              nonce:
                description: |-
                  Random, single-use, *not secret*. The consumer's attestation exchange
                  must echo it so a quote cannot be replayed across claims.
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                default: Pending
                description: |-
                  Where a claim is in its one-way lifecycle.

                  `Pending → Bound → Releasing` is the whole of the happy path. Nothing
                  moves backwards: a claim that has bound a member never unbinds it, and a
                  claim that has started releasing never returns to `Bound`.
                enum:
                - Pending
                - Bound
                - Releasing
                - Failed
                type: string
              tpmEndorsementCertificates:
                description: |-
                  PEM vTPM endorsement key certificate(s) of the bound member, mirrored
                  from the infra CR (ADR-0045). Lets a verifier check that an
                  attestation quote comes from the VM banlieue itself created for this
                  claim. Stays empty until ADR-0045 publishes them.
                items:
                  type: string
                type: array
              virtualMachineRef:
                description: The bound member. Set once, at bind time, and never rewritten.
                nullable: true
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            type: object
        required:
        - spec
        title: VirtualMachineClaim
        type: object
    served: true
    storage: true
    subresources:
      status: {}
