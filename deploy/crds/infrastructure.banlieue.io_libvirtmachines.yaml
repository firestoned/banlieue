apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: libvirtmachines.infrastructure.banlieue.io
spec:
  group: infrastructure.banlieue.io
  names:
    kind: LibvirtMachine
    plural: libvirtmachines
    shortNames:
    - lvm
    singular: libvirtmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.name
      name: Provider
      type: string
    - jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - jsonPath: .status.observedPowerState
      name: Power
      type: string
    - jsonPath: .spec.domainName
      name: Domain
      priority: 1
      type: string
    - jsonPath: .spec.providerID
      name: ProviderID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LibvirtMachine — the concrete, scheduled VM request for a libvirt/KVM host.

          You normally do not create this by hand: banlieue's controller does, owned
          by the `VirtualMachine` it was scheduled from, and the libvirt provider
          reconciles it into a real domain.
        properties:
          spec:
            description: |-
              LibvirtMachine — the concrete, scheduled VM request for a libvirt/KVM host.

              You normally do not create this by hand: banlieue's controller does, owned
              by the `VirtualMachine` it was scheduled from, and the libvirt provider
              reconciles it into a real domain.
            properties:
              bootSource:
                description: How this machine's OS disk comes into being.
                properties:
                  kind:
                    description: Which of the two provisioning shapes this machine uses.
                    enum:
                    - backingVolume
                    - installMedia
                    type: string
                  volume:
                    description: |-
                      Volume name within [`LibvirtMachineSpec::pool`]: the backing image
                      for [`BackingVolume`](LibvirtBootSourceKind::BackingVolume), or the
                      installer ISO for
                      [`InstallMedia`](LibvirtBootSourceKind::InstallMedia).
                    type: string
                required:
                - kind
                - volume
                type: object
              desiredPowerState:
                default: PoweredOn
                description: |-
                  Desired power state, resolved from the parent `VirtualMachine`'s
                  `spec.desiredPowerState` (ADR-0024).
                enum:
                - PoweredOn
                - PoweredOff
                - Suspended
                type: string
              disks:
                description: Disks. The first is the OS disk; the rest are blank data disks.
                items:
                  description: One virtual disk on the resulting domain.
                  properties:
                    bus:
                      default: virtio
                      description: Controller bus.
                      enum:
                      - virtio
                      - scsi
                      - sata
                      type: string
                    name:
                      description: Stable disk name; echoed in status and used to name the volume.
                      type: string
                    sizeGiB:
                      description: |-
                        Disk size in GiB. For an overlay OS disk this is a floor — the
                        overlay is created at least this large.
                      format: uint32
                      maximum: 65536.0
                      minimum: 1.0
                      type: integer
                  required:
                  - name
                  - sizeGiB
                  type: object
                maxItems: 32
                minItems: 1
                type: array
              domainName:
                description: |-
                  libvirt domain name. Unique per host, and the handle every domain
                  procedure takes.

                  Distinct from `metadata.name` on purpose: two namespaces can hold a
                  `LibvirtMachine` called `db-01`, but one libvirt host cannot hold two
                  domains by that name.
                type: string
              failureDomain:
                description: |-
                  CAPI contract (optional): failure domain placement. The banlieue
                  scheduler writes the chosen failure domain here.

                  libvirt has no cluster or datacenter hierarchy, so a failure domain is
                  simply one host (see roadmap 13) — which makes this field carry more
                  weight than on vSphere, not less: it is the only placement signal.
                nullable: true
                type: string
              firmware:
                description: |-
                  Firmware. EFI requires OVMF on the host; `EfiSecure` additionally
                  requires a `.secboot.fd` variant and pre-enrolled keys.
                enum:
                - bios
                - efi
                - efi-secure
                type: string
              machineType:
                description: |-
                  QEMU machine type (`q35`, `pc`, …). `None` lets libvirt pick its
                  default for the host's architecture, which is the right answer unless
                  an image needs a specific chipset.
                nullable: true
                type: string
              memoryMiB:
                description: Memory in MiB.
                format: uint32
                maximum: 4194304.0
                minimum: 128.0
                type: integer
              network:
                description: Network interfaces.
                items:
                  description: One virtual network interface on the resulting domain.
                  properties:
                    ipam:
                      description: IP address management for this interface.
                      properties:
                        pool:
                          description: Pool-based IPAM parameters.
                          nullable: true
                          properties:
                            poolRef:
                              description: |-
                                Typed reference (apiGroup + kind + name + optional namespace).

                                Used wherever the referenced kind is pluggable — e.g. IPAM pools, where we
                                want to accept either `ipam.cluster.x-k8s.io/IPAddressClaim` (CAPI's
                                default) or future banlieue-native pool types.
                              properties:
                                apiGroup:
                                  type: string
                                kind:
                                  type: string
                                name:
                                  type: string
                                namespace:
                                  nullable: true
                                  type: string
                              required:
                              - apiGroup
                              - kind
                              - name
                              type: object
                          required:
                          - poolRef
                          type: object
                        static:
                          description: Static IPAM parameters (address, prefix, gateway, nameservers, domain).
                          nullable: true
                          properties:
                            address:
                              type: string
                            domain:
                              description: |-
                                DNS domain, used both as a DNS search domain and (by a
                                `VirtualMachine.spec.networkOverrides` consumer, ADR-0024) to build
                                an FQDN as `<vm-name>.<domain>`.
                              nullable: true
                              type: string
                            gateway:
                              nullable: true
                              type: string
                            nameservers:
                              items:
                                type: string
                              type: array
                            prefix:
                              format: uint8
                              maximum: 255.0
                              minimum: 0.0
                              type: integer
                          required:
                          - address
                          - prefix
                          type: object
                      type: object
                    macAddress:
                      description: Optional MAC address (otherwise libvirt generates one).
                      nullable: true
                      type: string
                    model:
                      description: |-
                        Device model. `None` means `virtio`, which is what every image
                        banlieue builds expects.
                      nullable: true
                      type: string
                    name:
                      description: Stable NIC name; echoed in status.
                      type: string
                    source:
                      description: Resolved bridge or libvirt network.
                      properties:
                        kind:
                          description: Whether `name` names a host bridge or a libvirt network.
                          enum:
                          - network
                          - bridge
                          type: string
                        name:
                          description: The bridge interface (`br0`) or libvirt network (`default`).
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                  required:
                  - ipam
                  - name
                  - source
                  type: object
                maxItems: 16
                type: array
              pool:
                description: |-
                  Storage pool that holds this machine's volumes, resolved from the
                  storage class by the scheduler.
                type: string
              providerID:
                description: |-
                  CAPI contract: Provider ID for the resulting Node, if this VM becomes
                  a Kubernetes node. Format: `libvirt://<provider-name>/<domain-uuid>`.
                  Set by the provider controller after the domain is defined.

                  The *provider name*, not a hostname: the connection URI is a
                  deployment detail that can change without the VM changing, and a real
                  hostname here would end up in tracked YAML (see
                  `rules/no-real-infrastructure.md`). The domain UUID is libvirt's own
                  stable identity for the domain, unaffected by rename or restart.
                nullable: true
                type: string
              providerRef:
                description: |-
                  Reference to the banlieue `Provider` whose connection details describe
                  the target libvirt host.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              tpmEnabled:
                default: false
                description: |-
                  Attach an emulated TPM 2.0 device (swtpm), resolved from the VM's
                  `VMClass.spec.tpmEnabled` (ADR-0039).

                  The device must exist before first boot, because Kairos's `kcrypt`
                  seals LUKS keys to it during the unattended install — which is why
                  `tpmEnabled` only makes sense paired with
                  [`LibvirtBootSource::InstallMedia`] (ADR-0040, ADR-0048).

                  swtpm keys its state by domain UUID, so a new domain always gets a
                  fresh TPM. The corollary is that a domain carrying TPM state must
                  never be cloned, and that `undefine` must pass
                  `VIR_DOMAIN_UNDEFINE_TPM` or that state outlives the VM (ADR-0050
                  Decision 5).
                type: boolean
              userData:
                description: |-
                  Guest bootstrap payload, already resolved from the parent
                  `VirtualMachine`'s `spec.userData` Secret or ConfigMap (ADR-0038) and
                  placeholder-substituted by `banlieue-controller` (ADR-0025). The
                  provider renders it into a NoCloud `cidata` volume — it never reads a
                  Secret or ConfigMap itself.
                nullable: true
                type: string
              vcpus:
                description: Number of virtual CPUs.
                format: uint32
                maximum: 256.0
                minimum: 1.0
                type: integer
            required:
            - bootSource
            - disks
            - domainName
            - firmware
            - memoryMiB
            - network
            - pool
            - providerRef
            - vcpus
            type: object
          status:
            description: |-
              Observed state of a LibvirtMachine, shaped to the CAPI v1beta2
              InfraMachine status contract (plus libvirt-specific diagnostics).
            nullable: true
            properties:
              addressSource:
                description: |-
                  Which source answered when the provider looked up the guest's addresses
                  (ADR-0050 Decision 8).

                  Recorded because the three sources disagree in ways that matter: the
                  agent reports what the guest actually configured, a lease reports what
                  DHCP offered (which the guest may have ignored), and ARP reports what was
                  seen on the wire. An address that looks wrong is only diagnosable if you
                  know which of those produced it.
                enum:
                - guestAgent
                - dhcpLease
                - arpTable
                nullable: true
                type: string
              addresses:
                description: 'CAPI contract field (optional): VM addresses.'
                items:
                  description: A typed machine address. Mirrors CAPI's `clusterv1.MachineAddress`.
                  properties:
                    address:
                      description: The address itself.
                      type: string
                    type:
                      description: 'Address type. Accepted: Hostname, ExternalIP, InternalIP, ExternalDNS, InternalDNS.'
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: |-
                  CAPI-compatible conditions. The `Ready` condition is mirrored as
                  `InfrastructureReady` on the parent per contract.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              domainUuid:
                description: |-
                  libvirt's UUID for the domain, in its 36-character textual form. The
                  domain's real identity — stable across rename and host restart — and
                  the source for `spec.providerID`. Not part of the CAPI contract.
                nullable: true
                type: string
              failureDomain:
                description: |-
                  CAPI contract field (optional): observed failure domain — the host
                  the domain actually landed on.
                nullable: true
                type: string
              guestInstalled:
                description: |-
                  Whether the *installed* guest has announced itself (ADR-0043).

                  **Sticky once true.** The marker lives in the guest's `/run`, so it
                  does not survive a power cycle — but a VM that was stopped has not
                  become uninstalled. Without stickiness a warm pool member would drop
                  out of the pool every time it was powered off and back on.

                  `None` means "not observed yet", which is the expected state for the
                  whole of a `Deferred` image's install. Not part of the CAPI
                  contract.
                nullable: true
                type: boolean
              initialization:
                default: {}
                description: 'CAPI contract field: replaces the deprecated v1beta1 `status.ready`.'
                properties:
                  provisioned:
                    description: |-
                      True when the infrastructure provider reports that the resource's
                      infrastructure is fully provisioned.
                    nullable: true
                    type: boolean
                type: object
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              observedPowerState:
                description: |-
                  The domain's last observed run state, mapped onto banlieue's
                  backend-neutral [`PowerState`] (ADR-0034). The hypervisor's view, not
                  a guest-OS-boot signal. Not part of the CAPI contract; mirrored onto
                  the parent `VirtualMachine`'s `status.observedPowerState`.
                enum:
                - PoweredOn
                - PoweredOff
                - Suspended
                - null
                nullable: true
                type: string
              tpmAttached:
                description: |-
                  Whether an emulated TPM was attached, when `spec.tpmEnabled` is set
                  (ADR-0039). `None` when `tpmEnabled` is `false` or the attach has not
                  run yet. A failed attach surfaces through the conditions rather than
                  a dedicated `VirtualMachine`-level mirror.
                nullable: true
                type: boolean
            type: object
        required:
        - spec
        title: LibvirtMachine
        type: object
    served: true
    storage: true
    subresources:
      status: {}
