apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualmachinemoves.banlieue.io
spec:
  group: banlieue.io
  names:
    kind: VirtualMachineMove
    plural: virtualmachinemoves
    shortNames:
    - vmmove
    singular: virtualmachinemove
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vmRef.name
      name: VM
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.source
      name: Source
      type: string
    - jsonPath: .status.destination
      name: Destination
      type: string
    - jsonPath: .status.downtimeMilliseconds
      name: Downtime(ms)
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VirtualMachineMove: move one running VM to another Cloud Hypervisor host in
          its zone, keeping its memory, disk, MAC and addresses (ADR-0127).

          # What a move guarantees

          - **The guest runs on exactly one host, always.** Failure before commit
            leaves it where it was; after commit the old copy is never booted again.
          - **Admitted only where it can work**: same zone (`banlieue.io/zone`), both
            hosts advertising `move`, identical VMM version and CPU model, and a
            destination the VM's own placement allows. Otherwise `Rejected`, with a
            named reason.
          - **One move per VM at a time.** Deleting a move before `HandingOver`
            cancels it; after that it runs to `Succeeded` or `Failed`.

          # What a move is not

          Not a restart elsewhere after a host failure: that is fencing and HA, and
          banlieue does not do it. Until Stage 2 a VM with a vTPM is not movable.
        properties:
          spec:
            description: |-
              VirtualMachineMove: move one running VM to another Cloud Hypervisor host in
              its zone, keeping its memory, disk, MAC and addresses (ADR-0127).

              # What a move guarantees

              - **The guest runs on exactly one host, always.** Failure before commit
                leaves it where it was; after commit the old copy is never booted again.
              - **Admitted only where it can work**: same zone (`banlieue.io/zone`), both
                hosts advertising `move`, identical VMM version and CPU model, and a
                destination the VM's own placement allows. Otherwise `Rejected`, with a
                named reason.
              - **One move per VM at a time.** Deleting a move before `HandingOver`
                cancels it; after that it runs to `Succeeded` or `Failed`.

              # What a move is not

              Not a restart elsewhere after a host failure: that is fencing and HA, and
              banlieue does not do it. Until Stage 2 a VM with a vTPM is not movable.
            properties:
              target:
                description: |-
                  Where to move it. When absent, banlieue picks a host in the VM's zone:
                  of those passing every check, the one with the most free memory left
                  after the move, then the most free vCPUs, then by name (Decision 2).
                nullable: true
                properties:
                  providerName:
                    description: The destination Provider's name.
                    nullable: true
                    type: string
                  providerSelector:
                    description: |-
                      Restricts the destination to the zone's Providers matching it; banlieue
                      still ranks among them.
                    nullable: true
                    properties:
                      matchExpressions:
                        items:
                          properties:
                            key:
                              type: string
                            operator:
                              enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                              type: string
                            values:
                              items:
                                type: string
                              type: array
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        type: object
                    type: object
                type: object
                x-kubernetes-validations:
                - message: target takes exactly one of providerName or providerSelector
                  rule: has(self.providerName) != has(self.providerSelector)
              vmRef:
                description: The VM to move, in the move's namespace. Immutable.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: "vmRef is immutable: delete the move and create another"
                  rule: self == oldSelf
            required:
            - vmRef
            type: object
          status:
            description: Observed state of a move.
            nullable: true
            properties:
              bytesSent:
                description: Bytes sent so far.
                minimum: 0.0
                nullable: true
                type: integer
              bytesTotal:
                description: Bytes the source has to send (disk extents and VMM state), once known.
                minimum: 0.0
                nullable: true
                type: integer
              completedAt:
                description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                format: date-time
                nullable: true
                type: string
              conditions:
                description: Standard conditions; `Admitted` carries the rejection reason.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              destination:
                description: The Provider chosen to receive it.
                nullable: true
                type: string
              downtimeMilliseconds:
                description: How long the guest was paused, cutover to resume. Set on `Succeeded`.
                minimum: 0.0
                nullable: true
                type: integer
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                default: Pending
                description: "Where a move is. One way: nothing returns to an earlier phase."
                enum:
                - Pending
                - Preparing
                - Copying
                - HandingOver
                - Succeeded
                - Failed
                - Rejected
                type: string
              source:
                description: The Provider the VM was on when the move was admitted.
                nullable: true
                type: string
              startedAt:
                description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                format: date-time
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: VirtualMachineMove
        type: object
    served: true
    storage: true
    subresources:
      status: {}
