apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: proxmoxmachinetemplates.infrastructure.banlieue.io
spec:
  group: infrastructure.banlieue.io
  names:
    kind: ProxmoxMachineTemplate
    plural: proxmoxmachinetemplates
    shortNames:
    - pvemt
    singular: proxmoxmachinetemplate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ProxmoxMachineTemplate — a stamped-out ProxmoxMachine spec.

          CAPI requires an InfraMachineTemplate so a MachineSet or MachineDeployment
          can mint identical machines. banlieue ships it for CAPI compatibility;
          standalone VirtualMachine users do not need it.
        properties:
          spec:
            description: |-
              ProxmoxMachineTemplate — a stamped-out ProxmoxMachine spec.

              CAPI requires an InfraMachineTemplate so a MachineSet or MachineDeployment
              can mint identical machines. banlieue ships it for CAPI compatibility;
              standalone VirtualMachine users do not need it.
            properties:
              template:
                description: The spec stamped into every machine created from this template.
                properties:
                  spec:
                    description: The ProxmoxMachine spec for machines created from this template.
                    properties:
                      cores:
                        description: Cores per socket.
                        format: uint32
                        maximum: 512.0
                        minimum: 1.0
                        type: integer
                      cpuType:
                        description: |-
                          CPU model (`host`, `x86-64-v2-AES`, …). Proxmox's default applies when
                          absent.
                        nullable: true
                        type: string
                      dataDisks:
                        description: Additional blank disks, attached after the OS disk.
                        items:
                          description: One additional disk on the resulting VM.
                          properties:
                            discard:
                              default: false
                              description: Pass TRIM/discard to the storage.
                              type: boolean
                            iothread:
                              default: false
                              description: Dedicated I/O thread (virtio-scsi-single).
                              type: boolean
                            name:
                              description: Stable disk name; echoed in status.
                              type: string
                            sizeGiB:
                              description: Size in GiB.
                              format: uint32
                              maximum: 65536.0
                              minimum: 1.0
                              type: integer
                            ssd:
                              default: false
                              description: Present as an SSD to the guest.
                              type: boolean
                            storage:
                              description: Storage id; defaults to the machine's `storage`.
                              nullable: true
                              type: string
                          required:
                          - name
                          - sizeGiB
                          type: object
                        maxItems: 30
                        type: array
                      desiredPowerState:
                        default: PoweredOn
                        description: Desired power state, resolved from the parent `VirtualMachine`.
                        enum:
                        - PoweredOn
                        - PoweredOff
                        - Suspended
                        type: string
                      failureDomain:
                        description: |-
                          CAPI contract (optional): failure domain placement. One node is one
                          failure domain (roadmap 06).
                        nullable: true
                        type: string
                      firmware:
                        default: efi
                        description: |-
                          Firmware: `bios` selects SeaBIOS; `efi` and `efi-secure` select OVMF,
                          the latter with Microsoft/distribution keys pre-enrolled. The template
                          must be able to boot the chosen firmware.
                        enum:
                        - bios
                        - efi
                        - efi-secure
                        type: string
                      isoStorage:
                        description: |-
                          Storage the NoCloud seed ISO is uploaded to. Must allow `iso` content.
                          Required whenever `userData` is set.
                        nullable: true
                        type: string
                      memoryMiB:
                        description: Memory in MiB.
                        format: uint32
                        maximum: 4194304.0
                        minimum: 16.0
                        type: integer
                      nics:
                        description: Network interfaces.
                        items:
                          description: One network interface.
                          properties:
                            bridge:
                              description: Bridge on the node (resolved from the network class), e.g. `vmbr0`.
                              type: string
                            ipam:
                              description: IP address management for this interface.
                              properties:
                                pool:
                                  description: Pool-based IPAM parameters.
                                  nullable: true
                                  properties:
                                    poolRef:
                                      description: |-
                                        Typed reference (apiGroup + kind + name + optional namespace).

                                        Used wherever the referenced kind is pluggable — e.g. IPAM pools, where we
                                        want to accept either `ipam.cluster.x-k8s.io/IPAddressClaim` (CAPI's
                                        default) or future banlieue-native pool types.
                                      properties:
                                        apiGroup:
                                          type: string
                                        kind:
                                          type: string
                                        name:
                                          type: string
                                        namespace:
                                          nullable: true
                                          type: string
                                      required:
                                      - apiGroup
                                      - kind
                                      - name
                                      type: object
                                  required:
                                  - poolRef
                                  type: object
                                static:
                                  description: Static IPAM parameters (address, prefix, gateway, nameservers, domain).
                                  nullable: true
                                  properties:
                                    address:
                                      type: string
                                    domain:
                                      description: |-
                                        DNS domain, used both as a DNS search domain and (by a
                                        `VirtualMachine.spec.networkOverrides` consumer, ADR-0024) to build
                                        an FQDN as `<vm-name>.<domain>`.
                                      nullable: true
                                      type: string
                                    gateway:
                                      nullable: true
                                      type: string
                                    nameservers:
                                      items:
                                        type: string
                                      type: array
                                    prefix:
                                      format: uint8
                                      maximum: 255.0
                                      minimum: 0.0
                                      type: integer
                                  required:
                                  - address
                                  - prefix
                                  type: object
                              type: object
                            macAddress:
                              description: Optional MAC address (Proxmox generates one otherwise).
                              nullable: true
                              type: string
                            model:
                              default: virtio
                              description: Emulated NIC model.
                              enum:
                              - virtio
                              - e1000
                              - rtl8139
                              - vmxnet3
                              type: string
                            name:
                              description: Stable NIC name; echoed in status.
                              type: string
                            vlan:
                              description: 802.1Q VLAN tag.
                              format: uint16
                              maximum: 4094.0
                              minimum: 1.0
                              nullable: true
                              type: integer
                          required:
                          - bridge
                          - ipam
                          - name
                          type: object
                        maxItems: 16
                        type: array
                      node:
                        description: Node the VM is created on (resolved from the failure domain).
                        type: string
                      osDiskSizeGiB:
                        description: |-
                          OS disk size in GiB: the cloned disk is grown to at least this, never
                          shrunk.
                        format: uint32
                        maximum: 65536.0
                        minimum: 1.0
                        type: integer
                      pool:
                        description: Proxmox resource pool to place the VM in.
                        nullable: true
                        type: string
                      providerID:
                        description: |-
                          CAPI contract: Provider ID for the resulting Node, if this VM becomes
                          a Kubernetes node. Format: `proxmox://<provider-name>/<vmid>`. Set by
                          the provider once the VM exists.
                        nullable: true
                        type: string
                      providerRef:
                        description: The `Provider` whose connection describes the target Proxmox cluster.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      sockets:
                        default: 1
                        description: CPU sockets.
                        format: uint32
                        maximum: 4.0
                        minimum: 1.0
                        type: integer
                      storage:
                        description: |-
                          Storage id for the cloned and new disks (resolved from the storage
                          class). Must allow `images` content.
                        type: string
                      templateVmid:
                        description: |-
                          VMID of the template VM to clone. Must be a template (ADR-0075
                          Decision 5a); the provider checks before cloning.
                        format: uint32
                        minimum: 0.0
                        type: integer
                      tpmEnabled:
                        default: false
                        description: |-
                          Attach a vTPM 2.0 (`tpmstate0` on `storage`), resolved from
                          `VMClass.spec.tpmEnabled` and attached before first boot.
                        type: boolean
                      userData:
                        description: |-
                          Guest bootstrap payload, already resolved and placeholder-substituted
                          by `banlieue-controller` (ADR-0025, ADR-0038). Rendered into a NoCloud
                          `CIDATA` ISO (ADR-0054); the provider reads no Secret or ConfigMap.
                        nullable: true
                        type: string
                    required:
                    - cores
                    - memoryMiB
                    - nics
                    - node
                    - osDiskSizeGiB
                    - providerRef
                    - storage
                    - templateVmid
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        required:
        - spec
        title: ProxmoxMachineTemplate
        type: object
    served: true
    storage: true
