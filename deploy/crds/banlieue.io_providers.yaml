apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: providers.banlieue.io
spec:
  group: banlieue.io
  names:
    kind: Provider
    plural: providers
    shortNames:
    - prov
    singular: provider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerClassRef.name
      name: Class
      type: string
    - jsonPath: .spec.connection.endpoint
      name: Endpoint
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.workload.heartbeat
      name: Heartbeat
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Provider — one backend instance registered with banlieue.

          A Provider represents a single place VMs can run: one vCenter, one Proxmox
          cluster, or one libvirt host. It carries the connection details and an
          admin-curated declaration of the storage classes, network classes, and
          features that backend exposes. Its controller logs in, verifies those
          capabilities, and publishes the reachable `status.failureDomains[]`.

          # Why create one

          - **Make a backend schedulable.** A VirtualMachine can only be placed on a
            Provider — no Provider, nowhere to run.
          - **Declare capabilities explicitly.** `spec.capabilities` maps abstract
            class names (the ones VMClass / VMImage request) to concrete backend
            targets (a datastore, a port group). That mapping is the contract the
            scheduler matches against — capabilities are declared, not guessed.
          - **Model many backends, including duplicates.** A cluster can hold many
            Providers of the same class (`prod-vsphere`, `dr-vsphere`) and mix
            classes freely.

          The provider's controller talks to the backend; banlieue's main controller
          never does. Communication between them is CRD-only.
        properties:
          spec:
            description: |-
              Provider — one backend instance registered with banlieue.

              A Provider represents a single place VMs can run: one vCenter, one Proxmox
              cluster, or one libvirt host. It carries the connection details and an
              admin-curated declaration of the storage classes, network classes, and
              features that backend exposes. Its controller logs in, verifies those
              capabilities, and publishes the reachable `status.failureDomains[]`.

              # Why create one

              - **Make a backend schedulable.** A VirtualMachine can only be placed on a
                Provider — no Provider, nowhere to run.
              - **Declare capabilities explicitly.** `spec.capabilities` maps abstract
                class names (the ones VMClass / VMImage request) to concrete backend
                targets (a datastore, a port group). That mapping is the contract the
                scheduler matches against — capabilities are declared, not guessed.
              - **Model many backends, including duplicates.** A cluster can hold many
                Providers of the same class (`prod-vsphere`, `dr-vsphere`) and mix
                classes freely.

              The provider's controller talks to the backend; banlieue's main controller
              never does. Communication between them is CRD-only.
            properties:
              attestation:
                description: |-
                  Attestation trust anchors for this backend's vTPMs (ADR-0049
                  Decision 10). Admin-supplied, never discovered: an anchor read off
                  the hypervisor would let whoever controls the hypervisor choose the
                  anchor that vouches for its own guests. Optional — a Provider that
                  runs no `tpmEnabled` classes has no reason to set it.
                nullable: true
                properties:
                  ekTrustBundle:
                    description: |-
                      PEM bundle of CA certificates trusted to issue this backend's vTPM
                      endorsement-key certificates. Provenance differs per backend
                      (ADR-0045): on vSphere the issuing CA is vCenter's; on libvirt it is
                      each host's `swtpm_localca` issuer certificate, one entry per host.

                      Same value-or-source shape as `connection.caBundle`: exactly one of
                      `inline`, `configMapRef`, `secretRef` must be set (see
                      `CABundleSource`); references resolve in the Provider's namespace.
                      Removal of an issuer from this bundle is the revocation mechanism on
                      libvirt: swtpm EK certificates never expire. Not used by the
                      `firecracker` class, which has no vTPM.
                    nullable: true
                    properties:
                      configMapRef:
                        description: Key in a ConfigMap in the referrer's namespace (key defaults to `ca.crt`).
                        nullable: true
                        properties:
                          key:
                            description: Key within the object's `data`. Defaults are caller-defined.
                            nullable: true
                            type: string
                          name:
                            description: Name of the ConfigMap / Secret in the referrer's namespace.
                            type: string
                        required:
                        - name
                        type: object
                      inline:
                        description: Inline PEM (one or more concatenated certificates).
                        nullable: true
                        type: string
                      secretRef:
                        description: Key in a Secret in the referrer's namespace (key defaults to `ca.crt`).
                        nullable: true
                        properties:
                          key:
                            description: Key within the object's `data`. Defaults are caller-defined.
                            nullable: true
                            type: string
                          name:
                            description: Name of the ConfigMap / Secret in the referrer's namespace.
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  hostCa:
                    description: |-
                      For the `firecracker` class: the host's attestation CA (ADR-0143
                      Decision 2), the one certificate whose key signs the short-lived
                      certificates the host issues to its guests. Asserted here by the
                      administrator who installed the host, never discovered from the
                      host's own status (ADR-0049 Decision 10).

                      Same value-or-source shape as `ekTrustBundle`, but it must hold
                      **exactly one** certificate and no private key: an inline source is
                      checked by `validate`. banlieue neither resolves nor
                      verifies against it. Revocation is removing it here and from the SPIRE
                      bundle.
                    nullable: true
                    properties:
                      configMapRef:
                        description: Key in a ConfigMap in the referrer's namespace (key defaults to `ca.crt`).
                        nullable: true
                        properties:
                          key:
                            description: Key within the object's `data`. Defaults are caller-defined.
                            nullable: true
                            type: string
                          name:
                            description: Name of the ConfigMap / Secret in the referrer's namespace.
                            type: string
                        required:
                        - name
                        type: object
                      inline:
                        description: Inline PEM (one or more concatenated certificates).
                        nullable: true
                        type: string
                      secretRef:
                        description: Key in a Secret in the referrer's namespace (key defaults to `ca.crt`).
                        nullable: true
                        properties:
                          key:
                            description: Key within the object's `data`. Defaults are caller-defined.
                            nullable: true
                            type: string
                          name:
                            description: Name of the ConfigMap / Secret in the referrer's namespace.
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                type: object
              capabilities:
                description: |-
                  Admin-defined capability mappings. Every storage / network class that
                  VMClass and VMImage may request MUST be listed here for this provider
                  to be considered by the scheduler.
                properties:
                  features:
                    description: |-
                      Feature flags admin asserts are available. Provider's controller may
                      downgrade these in status if introspection finds otherwise.
                      Well-known values: hotAddCPU, hotAddMemory, efiSecureBoot,
                      nestedVirtualization, gpuPassthrough.
                    items:
                      type: string
                    type: array
                  instanceSizes:
                    description: |-
                      Cloud `Provider`s only: which instance size each `VMClass` runs as
                      (ADR-0160 Decision 1). A `VMClass` with no entry is not schedulable on
                      this `Provider`; nothing is guessed from vCPU and memory.
                    items:
                      description: One `VMClass` mapped to a cloud instance size (ADR-0160 Decision 1).
                      properties:
                        perZone:
                          description: Per-zone overrides of `size`, for a zone that does not offer it.
                          items:
                            description: An instance size for one availability zone (ADR-0160 Decision 1).
                            properties:
                              size:
                                description: The cloud's size name in that zone.
                                type: string
                              zone:
                                description: Zone name as the cloud reports it (`1`, `2`).
                                type: string
                            required:
                            - size
                            - zone
                            type: object
                          type: array
                          x-kubernetes-list-map-keys:
                          - zone
                          x-kubernetes-list-type: map
                        size:
                          description: The cloud's size name, such as `Standard_D2s_v5`.
                          type: string
                        vmClass:
                          description: The `VMClass` name.
                          type: string
                      required:
                      - size
                      - vmClass
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - vmClass
                    x-kubernetes-list-type: map
                  networkClasses:
                    description: Network classes the admin asserts are available on this backend.
                    items:
                      description: |-
                        Maps one abstract network-class name to a concrete backend target.

                        Same per-zone override shape as `StorageClassMapping` and for the same
                        reason: the "same" logical network commonly has a differently-named
                        port group on each cluster of a Provider (ADR-0030).
                      properties:
                        name:
                          description: Abstract name referenced by VMClass.network.interfaces[].networkClass.
                          type: string
                        perZone:
                          description: Per-`(datacenter, cluster)` overrides of `target` (ADR-0030).
                          items:
                            description: |-
                              A concrete backend target scoped to one specific failure domain — a
                              `(datacenter, cluster)` pair — within a Provider. Keyed the same way
                              `Provider.spec.failureDomainNameOverrides` is (ADR-0023): the
                              vCenter-reported identity, not a failure domain's own (possibly
                              admin-renamed) display name, which would make the mapping fragile to a
                              rename. Shared by `StorageClassMapping` and `NetworkClassMapping` —
                              same shape, same identity key (ADR-0030).

                              A cloud `Provider` (`azure`) keys the same shape by `zone` instead, the
                              availability zone name the cloud uses (`1`, `2`), and leaves `datacenter`
                              and `cluster` empty (ADR-0158 Decision 3).
                            properties:
                              cluster:
                                description: Cluster name as vCenter reports it. Empty on a cloud `Provider`.
                                type: string
                              datacenter:
                                description: Datacenter name as vCenter reports it. Empty on a cloud `Provider`.
                                type: string
                              target:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Concrete backend target for this zone, same shape as
                                  `StorageClassMapping::target` / `NetworkClassMapping::target`.
                                type: object
                              zone:
                                description: |-
                                  Availability zone name as the cloud reports it (`1`, `2`), on a cloud
                                  `Provider` (ADR-0158 Decision 3).
                                nullable: true
                                type: string
                            required:
                            - target
                            type: object
                          type: array
                        perZoneSubnet:
                          description: Per-`(datacenter, cluster)` overrides of `subnet` (ADR-0032).
                          items:
                            description: |-
                              A subnet's gateway/DNS/domain, scoped to one specific failure domain — a
                              `(datacenter, cluster)` pair — within a Provider's network class.
                              Deliberately excludes `prefix`, which stays a per-VM field on
                              `StaticIpamConfig` rather than becoming zone-derived (ADR-0032).
                            properties:
                              cluster:
                                description: Cluster name as vCenter reports it.
                                type: string
                              datacenter:
                                description: Datacenter name as vCenter reports it.
                                type: string
                              subnet:
                                description: Subnet shape for this zone.
                                properties:
                                  domain:
                                    nullable: true
                                    type: string
                                  gateway:
                                    nullable: true
                                    type: string
                                  nameservers:
                                    items:
                                      type: string
                                    type: array
                                type: object
                            required:
                            - cluster
                            - datacenter
                            - subnet
                            type: object
                          type: array
                        subnet:
                          description: |-
                            Default subnet shape (gateway/nameservers/domain) for this network
                            class, used in any zone `per_zone_subnet` does not cover. A port
                            group implies a subnet, so this lives alongside `target`/`per_zone`
                            rather than on `VMClass` — it lets a static-addressing
                            `VirtualMachine` omit gateway/nameservers/domain entirely and have
                            them resolved from whichever zone the scheduler picked (ADR-0032).
                          nullable: true
                          properties:
                            domain:
                              nullable: true
                              type: string
                            gateway:
                              nullable: true
                              type: string
                            nameservers:
                              items:
                                type: string
                              type: array
                          type: object
                        target:
                          additionalProperties:
                            type: string
                          description: |-
                            Default concrete target, used in any zone `per_zone` does not cover.
                            `None` means this class resolves ONLY in the zones `per_zone` lists.
                            Free-form per provider class. Examples:
                              vsphere:  { portGroup: "vmnet-prod" }
                                        { distributedPortGroup: "dvs-prod-vlan100" }
                              proxmox:  { bridge: "vmbr0", vlan: "100" }
                              libvirt:  { network: "br-prod" }
                          nullable: true
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  storageClasses:
                    description: |-
                      Storage classes the admin asserts are available on this backend.
                      Each entry maps an abstract class name to a provider-interpreted
                      concrete target.
                    items:
                      description: |-
                        Maps one abstract storage-class name to a concrete backend target.

                        A single class name can resolve differently per failure domain of the
                        same Provider — the "same" storage tier commonly has a differently-named
                        datastore (cluster) on each vCenter cluster. `target` is the default,
                        applied to any zone not covered by `per_zone`; `per_zone` overrides it
                        for the zones it lists. At least one of the two must resolve a target
                        for a zone, or this class is simply unavailable there — not an error,
                        the same "not reported available" path an unmatched target already took
                        before this ADR (ADR-0019, ADR-0030).
                      properties:
                        name:
                          description: Abstract name referenced by VMClass.hardware.disks[].storageClass.
                          type: string
                        perZone:
                          description: Per-`(datacenter, cluster)` overrides of `target` (ADR-0030).
                          items:
                            description: |-
                              A concrete backend target scoped to one specific failure domain — a
                              `(datacenter, cluster)` pair — within a Provider. Keyed the same way
                              `Provider.spec.failureDomainNameOverrides` is (ADR-0023): the
                              vCenter-reported identity, not a failure domain's own (possibly
                              admin-renamed) display name, which would make the mapping fragile to a
                              rename. Shared by `StorageClassMapping` and `NetworkClassMapping` —
                              same shape, same identity key (ADR-0030).

                              A cloud `Provider` (`azure`) keys the same shape by `zone` instead, the
                              availability zone name the cloud uses (`1`, `2`), and leaves `datacenter`
                              and `cluster` empty (ADR-0158 Decision 3).
                            properties:
                              cluster:
                                description: Cluster name as vCenter reports it. Empty on a cloud `Provider`.
                                type: string
                              datacenter:
                                description: Datacenter name as vCenter reports it. Empty on a cloud `Provider`.
                                type: string
                              target:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Concrete backend target for this zone, same shape as
                                  `StorageClassMapping::target` / `NetworkClassMapping::target`.
                                type: object
                              zone:
                                description: |-
                                  Availability zone name as the cloud reports it (`1`, `2`), on a cloud
                                  `Provider` (ADR-0158 Decision 3).
                                nullable: true
                                type: string
                            required:
                            - target
                            type: object
                          type: array
                        target:
                          additionalProperties:
                            type: string
                          description: |-
                            Default concrete target, used in any zone `per_zone` does not cover.
                            `None` means this class resolves ONLY in the zones `per_zone` lists.
                            Free-form per provider class; the provider's controller interprets
                            it. Examples by provider class:
                              vsphere:  { datastore: "ds-fast-01" }
                                        { datastoreCluster: "dsc-gold" }
                                        { tagCategory: "tier", tag: "gold" }
                              proxmox:  { storage: "ceph-pool-1" }
                              libvirt:  { pool: "nvme-pool" }
                              azure:    { sku: "Premium_LRS" }   (a managed-disk SKU, ADR-0160)
                          nullable: true
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                type: object
              connection:
                description: Connection details for the backend.
                properties:
                  azure:
                    description: |-
                      `azure` only: the subscription, region and resource group this
                      `Provider` creates into, and the Entra ID identity it federates to
                      (ADR-0158 Decision 1, ADR-0159 Decision 1). `endpoint` is the ARM
                      endpoint (`https://management.azure.com`) and `credentialsRef` is
                      not set: the provider's ServiceAccount token is its only credential.
                    nullable: true
                    properties:
                      authorityHost:
                        description: |-
                          Entra ID authority host. Defaults to the public cloud
                          (`https://login.microsoftonline.com/`).
                        nullable: true
                        type: string
                      clientId:
                        description: |-
                          Client ID of the user-assigned managed identity or app registration
                          whose federated credential trusts this provider's ServiceAccount.
                        minLength: 1
                        type: string
                      diskEncryptionSetId:
                        description: |-
                          Resource ID of a disk encryption set (customer-managed key) that
                          encrypts every OS disk, upload disk, snapshot and image version this
                          `Provider` creates (ADR-0172 Decision 2):
                          `/subscriptions/<subscriptionId>/resourceGroups/<rg>/providers/Microsoft.Compute/diskEncryptionSets/<name>`.
                          It must be in this `Provider`'s subscription and region (an Azure
                          restriction); its resource group may differ. Both the provider's
                          and the publisher's identities need
                          `Microsoft.Compute/diskEncryptionSets/read` on it. Unset:
                          platform-managed keys.
                        nullable: true
                        type: string
                      encryptionAtHost:
                        description: |-
                          Create every VM with `securityProfile.encryptionAtHost` (ADR-0172
                          Decision 3): temp disks and disk caches encrypted on the host. The
                          subscription must have the `Microsoft.Compute/EncryptionAtHost`
                          feature registered, and every mapped instance size must support it.
                        type: boolean
                      imageGallery:
                        description: |-
                          The admin's existing Compute Gallery this `Provider` publishes a
                          `VMImage`'s `Url` source into (ADR-0162 Decisions 4 and 8). banlieue
                          never creates or deletes the gallery; it creates and deletes only the
                          image definitions and versions it tags. Unset: no `Url` source is
                          published to this `Provider`, and its rows report
                          `GalleryNotConfigured`. `Template` sources need no gallery here.
                        nullable: true
                        properties:
                          name:
                            description: The gallery's name.
                            minLength: 1
                            type: string
                          resourceGroup:
                            description: |-
                              The resource group the gallery is in. It may differ from the
                              `Provider`'s `resourceGroup`.
                            minLength: 1
                            type: string
                        required:
                        - name
                        - resourceGroup
                        type: object
                      location:
                        description: |-
                          The region (`location`), such as `canadacentral`. One `Provider` is
                          one region; its availability zones are the failure domains
                          (ADR-0158 Decisions 1 and 3).
                        minLength: 1
                        type: string
                      openbao:
                        description: |-
                          Take the federation assertion from OpenBao's identity engine instead
                          of presenting the provider's projected ServiceAccount token directly
                          (ADR-0176). For a cluster whose ServiceAccount issuer cannot be
                          published: Entra ID then verifies a token OpenBao signs, against two
                          static documents the admin publishes. Unset: the projected token is
                          the assertion (ADR-0159), and nothing about OpenBao is rendered.

                          The login token is the provider pod's, so the OpenBao identity, and the
                          federated credential's subject, belong to the workload; a shared
                          provider (ADR-0133) reads this block from the `Provider` that owns it.
                        nullable: true
                        properties:
                          address:
                            description: "OpenBao's address: `https://host[:port]`, no path."
                            minLength: 1
                            pattern: ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$
                            type: string
                          audience:
                            default: openbao
                            description: |-
                              Audience of the ServiceAccount token that logs in; the auth role's
                              `bound_audiences` must name it. Defaults to `openbao`.

                              Never the cloud audience: the login token must not be one Entra ID
                              would accept, so the schema refuses `api://AzureADTokenExchange`.
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: "audience may not be the cloud audience: the OpenBao login token must not be a token Entra ID accepts"
                              rule: self != 'api://AzureADTokenExchange'
                          authMount:
                            description: |-
                              The JWT auth mount that trusts this cluster's ServiceAccount tokens
                              (`auth/<authMount>/login`).
                            pattern: ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$
                            type: string
                            x-kubernetes-validations:
                            - message: an auth mount segment may not be '.' or '..'
                              rule: "!self.split('/').exists(s, s == '.' || s == '..')"
                          loginRole:
                            description: The auth role bound to this workload's ServiceAccount.
                            pattern: ^[A-Za-z0-9._-]+$
                            type: string
                            x-kubernetes-validations:
                            - message: a role name may not be '.' or '..'
                              rule: self != '.' && self != '..'
                          namespace:
                            description: |-
                              The namespace path the auth mount and identity engine live in. Unset:
                              the root namespace.
                            nullable: true
                            pattern: ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$
                            type: string
                            x-kubernetes-validations:
                            - message: a namespace segment may not be '.' or '..'
                              rule: "!self.split('/').exists(s, s == '.' || s == '..')"
                          tokenRole:
                            description: |-
                              The identity OIDC role whose token is the assertion
                              (`identity/oidc/token/<tokenRole>`).
                            pattern: ^[A-Za-z0-9._-]+$
                            type: string
                            x-kubernetes-validations:
                            - message: a role name may not be '.' or '..'
                              rule: self != '.' && self != '..'
                        required:
                        - address
                        - authMount
                        - loginRole
                        - tokenRole
                        type: object
                      publisher:
                        description: |-
                          The image publisher's own identity (ADR-0159 Decision 3, ADR-0162
                          Decision 1), separate from `clientId`: the publish Job federates to it,
                          and only it holds the rights to create and delete images. Its tenant
                          is `tenantId`. Unset: no `Url` source is published to this `Provider`
                          (`PublisherNotConfigured`).
                        nullable: true
                        properties:
                          clientId:
                            description: |-
                              Client ID of the publisher's user-assigned managed identity or app
                              registration.
                            minLength: 1
                            type: string
                        required:
                        - clientId
                        type: object
                      resourceGroup:
                        description: |-
                          The resource group VMs, NICs and disks are created in. Must exist;
                          banlieue never creates or deletes it, and never touches anything in
                          it that does not carry its ownership tags (ADR-0158 Decision 4).
                        minLength: 1
                        type: string
                      subscriptionId:
                        description: Subscription ID.
                        minLength: 1
                        type: string
                      tags:
                        additionalProperties:
                          type: string
                        description: |-
                          Extra tags put on every resource this `Provider` creates by name: the
                          NIC, the VM, and the publish Job's image definition, upload disk,
                          snapshot and image version (ADR-0172 Decision 1). For a subscription
                          whose Azure Policy denies a resource without them. Not the OS disk,
                          which Azure creates from the VM without copying its tags.

                          banlieue's own ownership tags always win: a name starting with
                          `banlieue-` (in any case, since Azure folds tag-name case) is refused,
                          as are two names that differ only in case, a name containing
                          `<>%&\?/`, a name over 512 or a value over 256 characters, and more
                          than 45 entries. An invalid set sets the `Provider` `Ready=False`
                          (`ConnectionInvalid`) and nothing is created. Applies to resources
                          created afterwards; existing ones are not re-tagged.
                        maxProperties: 45
                        type: object
                      tenantId:
                        description: Entra ID tenant (directory) ID.
                        minLength: 1
                        type: string
                    required:
                    - clientId
                    - location
                    - resourceGroup
                    - subscriptionId
                    - tenantId
                    type: object
                  caBundle:
                    description: |-
                      Optional CA bundle to validate the endpoint's TLS certificate.

                      A value-or-source: inline PEM, or a `configMapRef` / `secretRef` naming a
                      key (default `ca.crt`) in the Provider's namespace. Exactly one source
                      must be set; see `CABundleSource`. Resolved by the provider controller
                      and injected into the HTTP client (ADR-0008, BYOC). When unset, the
                      system trust roots are used.
                    nullable: true
                    properties:
                      configMapRef:
                        description: Key in a ConfigMap in the referrer's namespace (key defaults to `ca.crt`).
                        nullable: true
                        properties:
                          key:
                            description: Key within the object's `data`. Defaults are caller-defined.
                            nullable: true
                            type: string
                          name:
                            description: Name of the ConfigMap / Secret in the referrer's namespace.
                            type: string
                        required:
                        - name
                        type: object
                      inline:
                        description: Inline PEM (one or more concatenated certificates).
                        nullable: true
                        type: string
                      secretRef:
                        description: Key in a Secret in the referrer's namespace (key defaults to `ca.crt`).
                        nullable: true
                        properties:
                          key:
                            description: Key within the object's `data`. Defaults are caller-defined.
                            nullable: true
                            type: string
                          name:
                            description: Name of the ConfigMap / Secret in the referrer's namespace.
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                  credentialsRef:
                    description: |-
                      Reference to a Secret in the Provider's namespace containing the
                      credentials. Required keys depend on provider class:
                        vsphere:  username, password
                        proxmox:  username (the full API token id, user@realm!tokenid), tokenValue
                                  (API tokens only; password/ticket auth is not supported, ADR-0074)
                        libvirt:  tls.crt, tls.key (mutual TLS, ADR-0011)

                      Required by every backend that authenticates to a remote endpoint, and
                      refused by `cloud-hypervisor`, whose provider runs on the hypervisor
                      host and must read no Secret at all (ADR-0060 Decision 4). When unset
                      the operator grants no Secret access whatsoever.
                    nullable: true
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  endpoint:
                    description: |-
                      Endpoint URL or URI. Format depends on provider class:
                        vsphere:  https://vcenter.example.com/sdk
                        proxmox:  https://pve.example.com:8006
                        libvirt:  qemu+ssh://kvm-host.example.com/system
                        azure:    https://management.azure.com
                    type: string
                  insecureSkipTLSVerify:
                    description: |-
                      Skip TLS verification. Applies to vsphere and proxmox.

                      Serialized as `insecureSkipTLSVerify` (matching CAPI convention with
                      uppercase `TLS`), not the auto-derived `insecureSkipTlsVerify`.
                    type: boolean
                required:
                - endpoint
                type: object
              failureDomainNameOverrides:
                description: |-
                  Explicit overrides for individual discovered failure domains'
                  generated `name`. The auto-computed, collision-safe name
                  (`<provider>-<datacenter>-<cluster>`, hashed when too long) is
                  always the fallback for any `(datacenter, cluster)` pair with no
                  matching entry here — this is opt-in, never required. See ADR-0023.
                items:
                  description: |-
                    Explicit override for one discovered failure domain's generated `name`,
                    keyed by the `(datacenter, cluster)` pair `discover_inventory` resolves
                    it from. Named fields, not a `"dc/cluster"` string key, so a call site
                    can't accidentally swap them — same reasoning as `ImportJobIdentity`
                    (ADR-0020-era `import_job_name` fix). See ADR-0023.
                  properties:
                    cluster:
                      description: Cluster name as vCenter reports it.
                      type: string
                    datacenter:
                      description: |-
                        Datacenter name as vCenter reports it (matches `discover_inventory`'s
                        walk, not an operator-chosen alias).
                      type: string
                    name:
                      description: |-
                        The name to use instead of the auto-computed one, e.g. `cluster-01`.
                        Slugified the same way auto-computed names are, so `Cluster 01`
                        still produces a valid Kubernetes name.
                      type: string
                  required:
                  - cluster
                  - datacenter
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - datacenter
                - cluster
                x-kubernetes-list-type: map
              namespaceSelector:
                description: |-
                  The namespaces this Provider serves, besides its own (ADR-0133).

                  A label selector over `Namespace` objects. Absent means the Provider's
                  own namespace only, so a Provider written before ADR-0133 serves nobody
                  new. It is the single source for both readers:

                  - the operator renders it onto the provider workload as
                    `--watch-namespace-selector`, so the provider watches machines in
                    those namespaces while it keeps its credentials in its own;
                  - the controller considers a Provider in the provider namespace for a
                    VM only when this selector matches the VM's namespace labels.

                  An empty selector (`{}`) serves nothing: banlieue never defaults to every
                  namespace, so a Provider cannot serve all of them by omission or by
                  accident. The selector is scope, not isolation: who may create a VM in a
                  matching namespace is RBAC and admission policy. Set it only on a Provider
                  in the platform's provider namespace; tenants must not be able to write it.
                nullable: true
                properties:
                  matchExpressions:
                    items:
                      properties:
                        key:
                          type: string
                        operator:
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                          type: string
                        values:
                          items:
                            type: string
                          type: array
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                  matchLabels:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              paused:
                description: |-
                  Suspend reconciliation. Equivalent to setting the
                  `cluster.x-k8s.io/paused` annotation but in-band.
                type: boolean
              providerClassRef:
                description: |-
                  Reference to a ProviderClass that identifies the backend type.

                  For v1alpha1 the ProviderClass CRD is deferred; treat this as a name
                  drawn from a well-known set: `vsphere`, `proxmox`, `libvirt`,
                  `cloud-hypervisor`, `azure`. A future
                  ProviderClass CRD will provide install metadata (image, RBAC) without
                  changing this reference.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              scheduling:
                description: |-
                  How the scheduler places VMs on this backend (ADR-0107). Optional:
                  without it the defaults apply.
                nullable: true
                properties:
                  cpuOvercommitRatio:
                    description: |-
                      vCPUs the scheduler may place per CPU a failure domain publishes in
                      `attributes.capacity.cpus`. `1` means no overcommit. CPU contention
                      only slows guests, so the default allows 4; memory is never
                      overcommitted. Unset: 4.
                    maximum: 64.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                  storageReservePercent:
                    description: |-
                      Percent of each store's `totalGiB` the scheduler keeps free when it
                      places a new VM's disks (ADR-0128): a full store pauses the guests
                      already on it. `0` disables the reserve. Unset: 10.
                    maximum: 50.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
              useContentLibrary:
                description: |-
                  vSphere only: import `Url`-kind VMImages through a vCenter Content
                  Library rather than the default datastore-upload + `MarkAsTemplate`
                  path. Defaults to `false` (no Content Library required), matching
                  environments where CL is not enabled. Ignored by non-vSphere classes.
                  See ADR-0020.
                type: boolean
            required:
            - connection
            - providerClassRef
            type: object
          status:
            description: |-
              Observed state of a Provider: the failure domains its controller discovered
              and the health / reachability conditions.
            nullable: true
            properties:
              conditions:
                description: |-
                  Standard Kubernetes conditions. The `Ready` condition reflects overall
                  provider health. The `ProviderReachable` condition reflects connection
                  state to the backend.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              ekCaCertificates:
                description: |-
                  PEM certificates of the CAs that issue this backend's vTPM
                  endorsement key certificates: on a Cloud Hypervisor host, the host's
                  own `swtpm_localca` (ADR-0065 Decision 6). A verifier trusts a
                  guest's EK only through the host that created it; this is the input
                  `ekTrustBundle` needs (ADR-0049). Empty when the backend offers no
                  vTPM or publishes no anchor.
                items:
                  type: string
                type: array
              failureDomains:
                description: |-
                  Failure domains ("availability zones" — the terms are synonyms;
                  `failureDomain` was kept to align with CAPI v1beta2's own vocabulary)
                  discovered by the provider's controller within this backend. The
                  scheduler matches against `labels` and filters by
                  `attributes.availableStorageClasses` / `availableNetworkClasses`.
                items:
                  description: |-
                    One placement target within a backend — typically a (datacenter, cluster)
                    pair or a zone. The scheduler matches VMs to failure domains by `labels`
                    and filters by the capabilities resolved in `attributes`.

                    "Failure domain" and "availability zone" are synonyms here — this type
                    names it `failureDomain` to align with the CAPI v1beta2 vocabulary
                    (`clusterv1.FailureDomain`, `Machine.spec.failureDomain`) that banlieue's
                    infra CRDs are built to satisfy, not because it means something distinct
                    from an AZ. Docs and CLI help text are free to say "availability zone"
                    where that reads more naturally.
                  properties:
                    attributes:
                      default: {}
                      description: |-
                        Attributes the provider's controller resolved for this domain,
                        including the subset of admin-listed classes that are actually
                        reachable from here.
                      properties:
                        availableNetworkClasses:
                          description: Subset of spec.capabilities.networkClasses[].name reachable here.
                          items:
                            type: string
                          type: array
                        availableStorageClasses:
                          description: Subset of spec.capabilities.storageClasses[].name reachable here.
                          items:
                            type: string
                          type: array
                        capacity:
                          description: |-
                            What guests may use in this failure domain, as the provider measured
                            it (ADR-0107). The scheduler fits each VM against it; a domain that
                            publishes none is not filtered on capacity.
                          nullable: true
                          properties:
                            cpus:
                              description: |-
                                Logical CPUs guests may use. vCPUs are placed up to this times the
                                Provider's `scheduling.cpuOvercommitRatio`.
                              minimum: 0.0
                              nullable: true
                              type: integer
                            memoryAvailableMiB:
                              description: |-
                                Memory a new guest could take now, MiB, as the provider measured it
                                (ADR-0128). Includes what running VMs already use, so the scheduler
                                checks it for new placements only. Never more than `memoryMiB`.
                              minimum: 0.0
                              nullable: true
                              type: integer
                            memoryMiB:
                              description: |-
                                Memory guests may use, MiB: the host's, or a smaller budget the host
                                declares for guests (a Cloud Hypervisor host's guests' slice,
                                ADR-0105). Never overcommitted.
                              minimum: 0.0
                              nullable: true
                              type: integer
                            memoryOverheadMiBPerVM:
                              description: Memory each VM costs beyond its class's `memoryMiB` (its VMM), MiB.
                              minimum: 0.0
                              nullable: true
                              type: integer
                            storage:
                              description: |-
                                Size and free space of the store behind each available storage
                                class, as the provider measured it (ADR-0128).
                              items:
                                description: The store behind one storage class in a failure domain (ADR-0128).
                                properties:
                                  freeGiB:
                                    description: |-
                                      Space a new disk could take now, GiB, for the writer the provider
                                      runs as.
                                    minimum: 0.0
                                    nullable: true
                                    type: integer
                                  shared:
                                    description: |-
                                      The same space backs other failure domains of this Provider (a
                                      Proxmox shared storage, a datastore mounted by several clusters), so
                                      disks placed in any of them draw on it.
                                    type: boolean
                                  storageClass:
                                    description: A name from `availableStorageClasses`.
                                    type: string
                                  totalGiB:
                                    description: The store's size, GiB.
                                    minimum: 0.0
                                    nullable: true
                                    type: integer
                                required:
                                - storageClass
                                type: object
                              type: array
                          type: object
                        features:
                          description: |-
                            Feature flags actually present here. Always a subset of
                            spec.capabilities.features.
                          items:
                            type: string
                          type: array
                        raw:
                          additionalProperties:
                            type: string
                          description: |-
                            Provider-specific resolved attributes; for vSphere this typically
                            includes datacenter, cluster, resourcePool. Used by the provider's
                            controller when filling in the infrastructure CR.
                          type: object
                      type: object
                    labels:
                      additionalProperties:
                        type: string
                      description: |-
                        Labels used by the scheduler's `failureDomainSelector` and by
                        VirtualMachine anti-affinity `topologyKey` matching.
                        Recommended keys: `datacenter`, `cluster`, `rack`, `env`. Every
                        provider also sets `name` to this failure domain's own resolved
                        `name` above (auto-computed, or an ADR-0023 override) — `name` above
                        is a top-level field a `LabelSelector` cannot match directly, so
                        without this mirror, targeting a specific zone by its friendly
                        override name (rather than a raw backend-reported label like
                        `cluster`) would be impossible.
                      type: object
                    name:
                      description: Stable name. Conventionally `<provider>-<cluster-or-zone>`.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              observedGeneration:
                description: The generation of the spec that the controller has reconciled.
                format: int64
                nullable: true
                type: integer
              workload:
                description: |-
                  The provider workload `banlieue-operator` created for this Provider.

                  Written **only** by the operator's field manager
                  (`banlieue.io/operator`); the provider's own controller never touches
                  it. This split is deliberate: `conditions` is a plain list with no
                  `x-kubernetes-list-type: map` marker, so two field managers writing into
                  it would contend over the whole array rather than merging per entry.
                  Giving the operator a disjoint field keeps server-side apply
                  conflict-free (ADR-0012).
                nullable: true
                properties:
                  deploymentName:
                    description: |-
                      Name of the Deployment running this Provider's controller.
                      Conventionally `banlieue-provider-<class>-<provider-name>`. Unset for
                      `External`: there is no Deployment.
                    nullable: true
                    type: string
                  heartbeat:
                    description: A provider's liveness, from its leader-election Lease (ADR-0102).
                    enum:
                    - Alive
                    - Stale
                    - Absent
                    nullable: true
                    type: string
                  lastHeartbeatTime:
                    description: The Lease's last `renewTime`, when there is a Lease.
                    format: date-time
                    nullable: true
                    type: string
                  mode:
                    default: Managed
                    description: |-
                      Whether the operator runs this provider (`Managed`) or only gave it an
                      identity (`External`, ADR-0060 Decision 3). Absent on objects written
                      before the field existed, which were all Managed.
                    enum:
                    - Managed
                    - External
                    type: string
                  namespace:
                    description: |-
                      Namespace the Deployment was created in — the ProviderClass's
                      `workloadNamespace`, or the operator's own namespace when unset.
                    type: string
                  observedGeneration:
                    description: |-
                      The Provider generation the operator had observed when it last applied
                      this workload.
                    format: int64
                    nullable: true
                    type: integer
                  readyReplicas:
                    description: |-
                      Ready replicas reported by that Deployment. Zero means the backend's
                      controller is not currently running, whatever the Provider's other
                      conditions say. Unset for `External`: there is no Deployment, and
                      whether the provider is running is `heartbeat` (ADR-0102).
                    format: int32
                    nullable: true
                    type: integer
                  serviceAccountName:
                    description: |-
                      Name of the ServiceAccount the operator created for this Provider, in `namespace`: the
                      identity its controller runs as, and what a host-resident provider's token is minted for
                      (ADR-0126). Read it rather than derive it: the naming is the operator's. Unset on a
                      Provider an older operator wrote.
                    nullable: true
                    type: string
                required:
                - namespace
                type: object
            type: object
        required:
        - spec
        title: Provider
        type: object
    served: true
    storage: true
    subresources:
      status: {}
