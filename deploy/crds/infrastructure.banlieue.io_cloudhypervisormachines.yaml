apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: cloudhypervisormachines.infrastructure.banlieue.io
spec:
  group: infrastructure.banlieue.io
  names:
    kind: CloudHypervisorMachine
    plural: cloudhypervisormachines
    shortNames:
    - chm
    singular: cloudhypervisormachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.name
      name: Provider
      type: string
    - jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - jsonPath: .status.observedPowerState
      name: Power
      type: string
    - jsonPath: .spec.bootSource.image
      name: Image
      priority: 1
      type: string
    - jsonPath: .spec.providerID
      name: ProviderID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CloudHypervisorMachine — the concrete, scheduled VM request for a Cloud
          Hypervisor host.

          You normally do not create this by hand: banlieue's controller does, owned
          by the `VirtualMachine` it was scheduled from, and the host-resident
          provider on the chosen host runs it as a Cloud Hypervisor guest.
        properties:
          spec:
            description: |-
              CloudHypervisorMachine — the concrete, scheduled VM request for a Cloud
              Hypervisor host.

              You normally do not create this by hand: banlieue's controller does, owned
              by the `VirtualMachine` it was scheduled from, and the host-resident
              provider on the chosen host runs it as a Cloud Hypervisor guest.
            properties:
              bootSource:
                description: Where the OS disk comes from.
                properties:
                  image:
                    description: |-
                      The image in the host's image cache: an installed raw disk for
                      [`Image`](ChBootSourceKind::Image), the installer ISO for
                      [`InstallMedia`](ChBootSourceKind::InstallMedia).
                    type: string
                  kind:
                    description: Which provisioning shape this machine uses.
                    enum:
                    - image
                    - installMedia
                    type: string
                required:
                - image
                - kind
                type: object
              cpus:
                description: Virtual CPUs.
                properties:
                  boot:
                    description: vCPUs the guest boots with.
                    format: uint32
                    maximum: 256.0
                    minimum: 1.0
                    type: integer
                  max:
                    description: |-
                      Hotplug headroom: the most vCPUs the guest may be resized to. Fixed
                      when the VM is created. `None` means no headroom.
                    format: uint32
                    maximum: 256.0
                    minimum: 1.0
                    nullable: true
                    type: integer
                required:
                - boot
                type: object
              desiredPowerState:
                default: PoweredOn
                description: Desired power state, resolved from the parent `VirtualMachine`.
                enum:
                - PoweredOn
                - PoweredOff
                - Suspended
                type: string
              failureDomain:
                description: |-
                  CAPI contract (optional): failure domain placement. One host is one
                  failure domain on this backend, as on libvirt.
                nullable: true
                type: string
              memory:
                description: Guest memory.
                properties:
                  hugepages:
                    default: false
                    description: |-
                      Back guest memory with hugepages. The host reports hugepages as their
                      own capacity, since they are reserved rather than allocated on demand.
                    type: boolean
                  sizeMiB:
                    description: Guest memory in MiB.
                    format: uint32
                    maximum: 4194304.0
                    minimum: 128.0
                    type: integer
                required:
                - sizeMiB
                type: object
              nics:
                description: Network interfaces.
                items:
                  description: One network interface.
                  properties:
                    ipam:
                      description: IP address management for this interface.
                      properties:
                        pool:
                          description: Pool-based IPAM parameters.
                          nullable: true
                          properties:
                            poolRef:
                              description: |-
                                Typed reference (apiGroup + kind + name + optional namespace).

                                Used wherever the referenced kind is pluggable — e.g. IPAM pools, where we
                                want to accept either `ipam.cluster.x-k8s.io/IPAddressClaim` (CAPI's
                                default) or future banlieue-native pool types.
                              properties:
                                apiGroup:
                                  type: string
                                kind:
                                  type: string
                                name:
                                  type: string
                                namespace:
                                  nullable: true
                                  type: string
                              required:
                              - apiGroup
                              - kind
                              - name
                              type: object
                          required:
                          - poolRef
                          type: object
                        static:
                          description: Static IPAM parameters (address, prefix, gateway, nameservers, domain).
                          nullable: true
                          properties:
                            address:
                              type: string
                            domain:
                              description: |-
                                DNS domain, used both as a DNS search domain and (by a
                                `VirtualMachine.spec.networkOverrides` consumer, ADR-0024) to build
                                an FQDN as `<vm-name>.<domain>`.
                              nullable: true
                              type: string
                            gateway:
                              nullable: true
                              type: string
                            nameservers:
                              items:
                                type: string
                              type: array
                            prefix:
                              format: uint8
                              maximum: 255.0
                              minimum: 0.0
                              type: integer
                          required:
                          - address
                          - prefix
                          type: object
                      type: object
                    macAddress:
                      description: |-
                        Optional MAC address. The provider derives a stable one from the
                        machine UID otherwise, so the address survives a restart.
                      nullable: true
                      type: string
                    name:
                      description: Stable NIC name; echoed in status.
                      type: string
                    networkClass:
                      description: |-
                        Network class: a name the host resolves to one of its bridges. Never
                        a bridge name from the cluster.
                      type: string
                  required:
                  - ipam
                  - name
                  - networkClass
                  type: object
                maxItems: 16
                type: array
              osDiskSizeGiB:
                description: |-
                  OS disk size in GiB. Required, and grown to before first boot; never
                  shrunk. Must be at least the image's size.
                format: uint32
                maximum: 65536.0
                minimum: 1.0
                type: integer
              providerID:
                description: |-
                  CAPI contract: Provider ID for the resulting Node, if this VM becomes
                  a Kubernetes node. Format:
                  `cloudhypervisor://<provider-name>/<machine-uid>`. Set by the provider
                  once the guest exists.
                nullable: true
                type: string
              providerRef:
                description: The `Provider` for the one host that runs this machine (ADR-0060).
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              storageClass:
                description: |-
                  Storage class the machine's disks live in. A name the host declares
                  in its local config and publishes on its failure domain; never a
                  path.
                type: string
              tpmEnabled:
                default: false
                description: |-
                  Attach a vTPM (swtpm), resolved from the VM's `VMClass.spec.tpmEnabled`.
                  Requires [`ChBootSourceKind::InstallMedia`] (ADR-0040, ADR-0048,
                  ADR-0065).
                type: boolean
              userData:
                description: |-
                  Guest bootstrap payload, already resolved and placeholder-substituted
                  by `banlieue-controller` (ADR-0025, ADR-0038). Rendered into a
                  NoCloud `CIDATA` seed disk; the provider reads no Secret or ConfigMap.
                nullable: true
                type: string
            required:
            - bootSource
            - cpus
            - memory
            - nics
            - osDiskSizeGiB
            - providerRef
            - storageClass
            type: object
          status:
            description: |-
              Observed state of a CloudHypervisorMachine, shaped to the CAPI v1beta2
              InfraMachine status contract. The non-contract fields mean what they mean
              on `LibvirtMachineStatus`, so the controller's status mirror treats both
              backends alike.
            nullable: true
            properties:
              addressSource:
                description: Which source answered the provider's address lookup.
                enum:
                - static
                - neighbour
                nullable: true
                type: string
              addresses:
                description: 'CAPI contract field (optional): VM addresses.'
                items:
                  description: A typed machine address. Mirrors CAPI's `clusterv1.MachineAddress`.
                  properties:
                    address:
                      description: The address itself.
                      type: string
                    type:
                      description: 'Address type. Accepted: Hostname, ExternalIP, InternalIP, ExternalDNS, InternalDNS.'
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: Standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failureDomain:
                description: 'CAPI contract field (optional): observed failure domain.'
                nullable: true
                type: string
              guestInstalled:
                description: |-
                  Whether the installed guest has announced itself (ADR-0043). Sticky
                  once true.
                nullable: true
                type: boolean
              hostUid:
                description: |-
                  The unprivileged host uid this machine's units run as (ADR-0063
                  Decision 3). Recorded so the provider re-adopts a running guest
                  without trusting its own memory.
                format: uint32
                minimum: 0.0
                nullable: true
                type: integer
              initialization:
                default: {}
                description: CAPI contract field.
                properties:
                  provisioned:
                    description: |-
                      True when the infrastructure provider reports that the resource's
                      infrastructure is fully provisioned.
                    nullable: true
                    type: boolean
                type: object
              installMediaDetached:
                description: |-
                  Whether the installer has been removed, live and for future starts
                  (ADR-0044, ADR-0065 Decision 4). Sticky once true; `None` when there
                  was never an installer.
                nullable: true
                type: boolean
              observedGeneration:
                description: The `metadata.generation` this status was computed from.
                format: int64
                nullable: true
                type: integer
              observedPowerState:
                description: The VM's last observed run state.
                enum:
                - PoweredOn
                - PoweredOff
                - Suspended
                - null
                nullable: true
                type: string
              tpmAttached:
                description: Whether a vTPM was attached, when `spec.tpmEnabled` is set.
                nullable: true
                type: boolean
              tpmEndorsementCertificates:
                description: |-
                  PEM EK certificates, validated against this machine (ADR-0045,
                  ADR-0065).
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        title: CloudHypervisorMachine
        type: object
    served: true
    storage: true
    subresources:
      status: {}
