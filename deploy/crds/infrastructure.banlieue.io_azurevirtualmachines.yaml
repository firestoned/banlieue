apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: azurevirtualmachines.infrastructure.banlieue.io
spec:
  group: infrastructure.banlieue.io
  names:
    kind: AzureVirtualMachine
    plural: azurevirtualmachines
    shortNames:
    - azvm
    singular: azurevirtualmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.providerRef.name
      name: Provider
      type: string
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .spec.size
      name: Size
      type: string
    - jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - jsonPath: .status.provisioningState
      name: State
      type: string
    - jsonPath: .status.observedPowerState
      name: Power
      type: string
    - jsonPath: .spec.providerID
      name: ProviderID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AzureVirtualMachine: the concrete, scheduled VM request for Azure.

          You normally do not create this by hand: banlieue's controller does,
          owned by the `VirtualMachine` it was scheduled from, and the Azure
          provider creates the NIC and VM and reports CAPI-shaped status.
        properties:
          spec:
            description: |-
              AzureVirtualMachine: the concrete, scheduled VM request for Azure.

              You normally do not create this by hand: banlieue's controller does,
              owned by the `VirtualMachine` it was scheduled from, and the Azure
              provider creates the NIC and VM and reports CAPI-shaped status.
            properties:
              acceleratedNetworking:
                description: |-
                  Enable accelerated networking on the NIC. The image must not
                  configure the VF itself (ADR-0163 Decision 3).
                type: boolean
              desiredPowerState:
                default: PoweredOn
                description: |-
                  Desired power state, resolved from the parent `VirtualMachine`.
                  `PoweredOff` deallocates the VM, which stops compute billing
                  (ADR-0164 Decision 3). `Suspended` is refused.
                enum:
                - PoweredOn
                - PoweredOff
                - Suspended
                type: string
              failureDomain:
                description: |-
                  CAPI contract (optional): failure domain placement, the name of one of
                  the `Provider`'s failure domains (one per availability zone).
                nullable: true
                type: string
              imageVersionId:
                description: |-
                  Resource ID of the Compute Gallery image version to boot, from the
                  `VMImage`'s `azure` source (a hand-published `Template`, ADR-0162
                  Decision 4).
                minLength: 1
                type: string
              osDiskSizeGiB:
                description: OS disk size in GiB, from the `VMClass` (ADR-0160 Decision 4).
                maximum: 32767.0
                minimum: 1.0
                type: integer
              osDiskSku:
                description: |-
                  Managed-disk SKU of the OS disk (`Premium_LRS`, `StandardSSD_LRS`),
                  from the storage class's `sku` target.
                minLength: 1
                type: string
              providerID:
                description: |-
                  CAPI contract: Provider ID for the resulting Node. Format:
                  `azure:///subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Compute/virtualMachines/<name>`.
                  Set by the provider once the VM exists.
                nullable: true
                type: string
              providerRef:
                description: |-
                  The `Provider` whose connection names the subscription, region and
                  resource group.
                properties:
                  name:
                    description: Name of the `Provider`.
                    type: string
                  namespace:
                    description: |-
                      Namespace of the `Provider`. Defaults to the referrer's namespace.

                      Only `banlieue-controller` may set this: a machine naming a provider in
                      another namespace is a placement that skipped scheduling, so an
                      admission policy reserves the field to the controller's identity.
                    nullable: true
                    type: string
                required:
                - name
                type: object
              size:
                description: |-
                  VM size (`Standard_D2s_v5`), resolved from the `Provider`'s
                  `instanceSizes` mapping for the `VMClass` (ADR-0160).
                minLength: 1
                type: string
              subnetId:
                description: |-
                  Resource ID of the subnet the NIC is created in, from the network
                  class's `subnetId` target for this zone.
                minLength: 1
                type: string
              trustedLaunch:
                description: |-
                  Trusted Launch: Secure Boot and a vTPM (ADR-0165). Set from the
                  `VMClass`'s `tpmEnabled`; the image definition must declare Trusted
                  Launch support.
                type: boolean
              userData:
                description: |-
                  Guest bootstrap payload, already resolved and placeholder-substituted
                  by `banlieue-controller` (ADR-0025, ADR-0038). Sent as `customData`;
                  at most 64 KiB. The provider reads no Secret or ConfigMap.
                nullable: true
                type: string
              zone:
                description: |-
                  Availability zone the VM is created in, as the subscription names it
                  (`1`, `2`, `3`). Resolved from the failure domain's `labels.zone`.
                minLength: 1
                type: string
            required:
            - imageVersionId
            - osDiskSizeGiB
            - osDiskSku
            - providerRef
            - size
            - subnetId
            - zone
            type: object
          status:
            description: |-
              Observed state of an AzureVirtualMachine, shaped to the CAPI v1beta2
              InfraMachine status contract. The non-contract fields mean what they mean
              on the siblings, so the controller's status mirror treats backends alike.
            nullable: true
            properties:
              addresses:
                description: |-
                  CAPI contract field (optional): the NIC's private address. No public
                  address in v1.
                items:
                  description: A typed machine address. Mirrors CAPI's `clusterv1.MachineAddress`.
                  properties:
                    address:
                      description: The address itself.
                      type: string
                    type:
                      description: "Address type. Accepted: Hostname, ExternalIP, InternalIP, ExternalDNS, InternalDNS."
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: Standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              createFailures:
                description: |-
                  Consecutive failed creates of this generation: the provider waits
                  `min(5 min * 2^(n - 1), 1 h)` before creating again (ADR-0173
                  Decision 5). Reset when the VM exists.
                minimum: 0.0
                type: integer
              failureDomain:
                description: "CAPI contract field (optional): observed failure domain."
                nullable: true
                type: string
              guestInstalled:
                description: |-
                  Sticky: the guest reported ready once (ADR-0163 Decision 1,
                  ADR-0043 Decision 5).
                type: boolean
              initialization:
                default: {}
                description: CAPI contract field.
                properties:
                  provisioned:
                    description: |-
                      True when the infrastructure provider reports that the resource's
                      infrastructure is fully provisioned.
                    nullable: true
                    type: boolean
                type: object
              observedGeneration:
                description: The `metadata.generation` this status was computed from.
                format: int64
                nullable: true
                type: integer
              observedPowerState:
                description: The VM's last observed run state (deallocated reads `PoweredOff`).
                enum:
                - PoweredOn
                - PoweredOff
                - Suspended
                - null
                nullable: true
                type: string
              osDiskTagged:
                description: |-
                  Sticky: the OS disk carries this machine's ownership tags. ARM takes
                  none in the VM body, so the provider merges them onto the disk once
                  the VM exists (ADR-0173).
                type: boolean
              pendingOperation:
                description: The ARM operation in flight, if any.
                nullable: true
                properties:
                  action:
                    description: What the operation is doing.
                    enum:
                    - CreateNic
                    - CreateVm
                    - Start
                    - Deallocate
                    - DeleteVm
                    - DeleteNic
                    - DeleteDisk
                    type: string
                  kind:
                    description: |-
                      Which header the URL came from: `AsyncOperation`
                      (`Azure-AsyncOperation`) or `Location`.
                    type: string
                  url:
                    description: |-
                      The operation URL ARM returned. The provider polls it only when it
                      sits under the ARM endpoint it is configured for.
                    type: string
                required:
                - action
                - kind
                - url
                type: object
              provisioningState:
                description: The VM's ARM `provisioningState` (`Creating`, `Succeeded`, `Failed`).
                nullable: true
                type: string
              vmName:
                description: The VM's resource name, derived from this object's UID.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: AzureVirtualMachine
        type: object
    served: true
    storage: true
    subresources:
      status: {}
