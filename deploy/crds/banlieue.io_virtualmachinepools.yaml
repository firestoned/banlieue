apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualmachinepools.banlieue.io
spec:
  group: banlieue.io
  names:
    kind: VirtualMachinePool
    plural: virtualmachinepools
    shortNames:
    - vmpool
    singular: virtualmachinepool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.warmReplicas
      name: Warm
      type: integer
    - jsonPath: .status.available
      name: Available
      type: integer
    - jsonPath: .status.provisioning
      name: Provisioning
      type: integer
    - jsonPath: .status.claimed
      name: Claimed
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VirtualMachinePool: a self-refilling set of warm, single-use VMs.

          # Why create one

          - **Hide install latency.** A `tpmEnabled` class must pair with an
            `installMode: Deferred` image, so every VM pays a full install on first
            boot. The pool pays that ahead of time.
          - **Single use by construction.** Members are handed out through
            `VirtualMachineClaim` and destroyed when the claim ends. There is no
            code path that returns a used member to the warm set.
          - **Follow the image.** When the referenced `VMImage` is rebuilt, warm
            members from the old build are replaced surge-style without dropping
            claimable capacity.

          Namespaced: members are created in the pool's own namespace, which is
          also where the scheduler looks for candidate Providers.
        properties:
          spec:
            description: |-
              VirtualMachinePool: a self-refilling set of warm, single-use VMs.

              # Why create one

              - **Hide install latency.** A `tpmEnabled` class must pair with an
                `installMode: Deferred` image, so every VM pays a full install on first
                boot. The pool pays that ahead of time.
              - **Single use by construction.** Members are handed out through
                `VirtualMachineClaim` and destroyed when the claim ends. There is no
                code path that returns a used member to the warm set.
              - **Follow the image.** When the referenced `VMImage` is rebuilt, warm
                members from the old build are replaced surge-style without dropping
                claimable capacity.

              Namespaced: members are created in the pool's own namespace, which is
              also where the scheduler looks for candidate Providers.
            properties:
              addressing:
                description: |-
                  Per-member static addressing. Omit for DHCP or class-level IPAM.
                  Interim until the CAPI IPAM contract lands (ADR-0033); at that point
                  this gains a `poolRef` alternative and the inline range stays as the
                  zero-dependency option.
                nullable: true
                properties:
                  domain:
                    nullable: true
                    type: string
                  gateway:
                    nullable: true
                    type: string
                  interface:
                    description: |-
                      Name of the `VMClass` network interface to stamp, matching
                      `NetworkInterfaceOverride.name`.
                    type: string
                  nameservers:
                    items:
                      type: string
                    type: array
                  prefix:
                    format: uint8
                    maximum: 255.0
                    minimum: 0.0
                    type: integer
                  rangeEnd:
                    description: |-
                      Last address of the inclusive range. Size it at `maxReplicas` plus a
                      few spares: an address stays held until a deleted member's backend VM
                      is actually gone.
                    type: string
                  rangeStart:
                    description: First address of the inclusive range.
                    type: string
                required:
                - interface
                - prefix
                - rangeEnd
                - rangeStart
                type: object
              maxIdleSeconds:
                description: |-
                  Replace a Ready member that has sat unclaimed this long. Bounds how
                  stale an unpatched warm VM can get between image rebuilds.
                format: uint64
                minimum: 0.0
                nullable: true
                type: integer
              maxReplicas:
                description: |-
                  Hard ceiling on members of any phase, claimed ones included. Leave
                  headroom above `warmReplicas` plus expected concurrent claims, or
                  image rollouts have to trade warm capacity for replacements.
                format: uint32
                minimum: 0.0
                type: integer
              maxSurge:
                default: 2
                description: |-
                  Most members allowed to be provisioning at once. Bounds the install
                  load a refill puts on the hosts that claimed members are running on.
                format: uint32
                minimum: 0.0
                type: integer
              provisioningTimeoutSeconds:
                default: 1800
                description: |-
                  A member still provisioning after this long is treated as poisoned
                  and deleted, never repaired.
                format: uint64
                minimum: 0.0
                type: integer
              readiness:
                description: |-
                  Which member condition makes it claimable. See [`PoolReadiness`].

                  **Required, with no default** (ADR-0046 Decision 2). `GuestReady` is
                  the correct answer for a Deferred-mode image and would be the natural
                  default — but nothing publishes that condition until ADR-0043 lands,
                  so defaulting to it would leave every pool at zero warm members
                  forever, with no error. A field whose wrong value produces silence
                  rather than a failure is one the operator has to state out loud.
                enum:
                - GuestReady
                - InfrastructureReady
                type: string
              recycleOnImageChange:
                default: true
                description: Replace warm members when the referenced `VMImage`'s build changes.
                type: boolean
              template:
                description: |-
                  Template for each member. `spec.networkOverrides` entries for the
                  interface named in `addressing` are replaced per member; everything
                  else is copied verbatim.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: Extra annotations stamped on each member.
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    description: Extra labels stamped on each member, in addition to the pool's own.
                    type: object
                  spec:
                    description: |-
                      VirtualMachine — the user-facing request for a running VM.

                      This is the one resource end users create. It expresses *intent*: which
                      VMClass (shape) and VMImage (OS) to use, optional placement constraints,
                      the desired power state, and optional guest user-data. banlieue's
                      controller schedules it onto a Provider + failure domain, creates the
                      matching provider infrastructure CR (e.g. `VSphereMachine`), and mirrors
                      that CR's status back here.

                      # Why create one

                      - **Declare a VM the Kubernetes way.** Describe the VM you want; the
                        controller reconciles reality toward it, including power state.
                      - **Stay backend-agnostic.** You reference a class and an image by name,
                        not a datastore or a port group. Where it lands is the scheduler's job.
                      - **Compose with policy.** Label / anti-affinity selectors and a migration
                        policy steer placement and drift handling without coupling to a specific
                        Provider.

                      Independent of Cluster API: a VirtualMachine is **not** a `clusterv1.
                      Machine`. It can coexist with CAPI but does not depend on it.

                      Namespaced: candidate Providers are drawn from the VM's own namespace.
                    properties:
                      classRef:
                        description: Reference to a (cluster-scoped) VMClass.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      desiredPowerState:
                        default: PoweredOn
                        description: Desired power state. Defaults to `PoweredOn`.
                        enum:
                        - PoweredOn
                        - PoweredOff
                        - Suspended
                        type: string
                      folder:
                        description: |-
                          Destination folder for the provisioned VM (e.g. `apps/prod` on
                          vSphere). When unset, the provider defaults to organizing the VM
                          the same way it organizes its source template — on vSphere, the
                          same per-zone folder the template lives in (ADR-0020 Decision #5).

                          Unlike `networkOverrides` / `hardwareOverride`, this has no
                          `VMClass`-level counterpart to be a delta *against* — placement is
                          purely an infrastructure concern, not part of a VM's abstract
                          shape. It is also the one field here that is unavoidably
                          backend-flavored (a "folder" is a vSphere concept); other backends
                          may interpret it differently or ignore it.
                        nullable: true
                        type: string
                      hardwareOverride:
                        description: |-
                          Per-VM override for the `VMClass`'s hardware shape — CPUs, memory,
                          and disk sizes.

                          **This is a delta, not the primary definition.** The `VMClass` is the
                          authoritative source for a VM's hardware shape: its `spec.hardware`
                          is fixed and shared by every VM that references the class. This
                          field applies *on top of* the class — only the fields you set here
                          replace the class value; everything else is inherited verbatim.

                          Use this sparingly. Its primary purpose is to accommodate the rare
                          VM that genuinely needs a different CPU, memory, or disk budget than
                          its class defines — for example, a database primary bumped to 16 CPUs
                          while all other replicas use the 4-CPU class shape, or one VM that
                          needs a larger data disk. If you find yourself setting the same
                          override on every VM of a given class, create a new `VMClass` instead.
                        nullable: true
                        properties:
                          cpus:
                            description: |-
                              Override the `VMClass`'s `spec.hardware.cpus`.
                              If absent, the class value is used unchanged.
                            format: uint32
                            maximum: 256.0
                            minimum: 1.0
                            nullable: true
                            type: integer
                          diskOverrides:
                            description: |-
                              Per-disk size overrides, keyed by `DiskSpec.name`.
                              Only `sizeGiB` can be overridden per VM; the disk's `storageClass`
                              and `provisioning` are class-level concerns.

                              **This is a delta, not the primary definition.** A disk with no
                              entry here inherits the `VMClass`'s size verbatim.
                            items:
                              description: |-
                                A per-VM size override for one `VMClass`-declared disk.

                                **This is a delta, not the primary definition.** The `VMClass` defines
                                the disk set; this struct lets a single VM request a larger size for
                                one of those disks (e.g. a bigger data volume) without altering the
                                shared class.
                              properties:
                                name:
                                  description: Matches a `VMClass.spec.hardware.disks[].name`.
                                  type: string
                                sizeGiB:
                                  description: |-
                                    Override the disk's `sizeGiB`. Must be ≥ the class value (the
                                    provider will reject a shrink). If absent, the class size is used.
                                  format: uint32
                                  maximum: 65536.0
                                  minimum: 1.0
                                  type: integer
                              required:
                              - name
                              - sizeGiB
                              type: object
                            type: array
                            x-kubernetes-list-map-keys:
                            - name
                            x-kubernetes-list-type: map
                          memoryMiB:
                            description: |-
                              Override the `VMClass`'s `spec.hardware.memoryMiB`.
                              If absent, the class value is used unchanged.
                            format: uint32
                            maximum: 4194304.0
                            minimum: 128.0
                            nullable: true
                            type: integer
                        type: object
                      imageRef:
                        description: Reference to a (cluster-scoped) VMImage.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      migrationPolicy:
                        default: automatic
                        description: What to do when current placement no longer satisfies the spec.
                        enum:
                        - automatic
                        - manual
                        - never
                        type: string
                      networkOverrides:
                        description: |-
                          Per-VM overrides for specific VMClass-declared network interfaces
                          (ADR-0024). Keyed by `NetworkInterfaceSpec.name`; an interface with
                          no entry here uses its VMClass's own `ipam` verbatim (commonly
                          `dhcp`). Lets many VMs share one VMClass while each still gets its
                          own static address — a VMClass-level `ipam.static` cannot express
                          that, since a class is shared by design.

                          **This is a delta, not the primary definition.** The VMClass is the
                          authoritative source for the VM's network shape. Entries here are
                          layered on top: only the named interface's `ipam` is replaced;
                          every other interface is inherited from the class unchanged.
                        items:
                          description: |-
                            A per-VM static-address override for one `VMClass`-declared network
                            interface (ADR-0024).

                            **This is a delta, not the primary definition.** The `VMClass` is the
                            authoritative source for the VM's network shape. An entry here replaces
                            only the named interface's `ipam`; every other interface, and all other
                            attributes of the named interface, are inherited from the class unchanged.

                            Named `NetworkInterfaceOverride` (rather than reusing
                            `NetworkInterfaceSpec`) for the same reason as `HardwareOverride`: the
                            name signals layered intent — "a per-VM delta on top of a shared class"
                            — rather than a standalone definition.
                          properties:
                            name:
                              description: Matches a `VMClass.spec.network.interfaces[].name`.
                              type: string
                            static:
                              description: |-
                                The static address to use for this interface, overriding whatever
                                the `VMClass`'s own `ipam` declares.
                              properties:
                                address:
                                  type: string
                                domain:
                                  description: |-
                                    DNS domain, used both as a DNS search domain and (by a
                                    `VirtualMachine.spec.networkOverrides` consumer, ADR-0024) to build
                                    an FQDN as `<vm-name>.<domain>`.
                                  nullable: true
                                  type: string
                                gateway:
                                  nullable: true
                                  type: string
                                nameservers:
                                  items:
                                    type: string
                                  type: array
                                prefix:
                                  format: uint8
                                  maximum: 255.0
                                  minimum: 0.0
                                  type: integer
                              required:
                              - address
                              - prefix
                              type: object
                          required:
                          - name
                          - static
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      paused:
                        description: Suspend reconciliation in-band.
                        type: boolean
                      placement:
                        default: {}
                        description: |-
                          Placement intent. If unset, the scheduler considers every Provider
                          in the VM's namespace and every failure domain.
                        properties:
                          antiAffinity:
                            description: |-
                              Anti-affinity rules against other VirtualMachines in the same
                              namespace. Evaluated at scheduling time.
                            items:
                              description: |-
                                A rule that spreads this VM away from other VirtualMachines across a
                                failure-domain topology key, evaluated at scheduling time.
                              properties:
                                labelSelector:
                                  description: Other VMs (by their own metadata.labels) to spread away from.
                                  properties:
                                    matchExpressions:
                                      items:
                                        properties:
                                          key:
                                            type: string
                                          operator:
                                            enum:
                                            - In
                                            - NotIn
                                            - Exists
                                            - DoesNotExist
                                            type: string
                                          values:
                                            items:
                                              type: string
                                            type: array
                                        required:
                                        - key
                                        - operator
                                        type: object
                                      type: array
                                    matchLabels:
                                      additionalProperties:
                                        type: string
                                      type: object
                                  type: object
                                mode:
                                  default: required
                                  description: Strictness. `required` filters candidates; `preferred` is best-effort.
                                  enum:
                                  - required
                                  - preferred
                                  type: string
                                topologyKey:
                                  description: |-
                                    A label key from the failure domain's labels. Spreading is required
                                    across distinct values of this key.
                                    Common keys: `cluster`, `rack`, `host`, `dc`.
                                  type: string
                              required:
                              - labelSelector
                              - topologyKey
                              type: object
                            type: array
                          failureDomainSelector:
                            description: |-
                              Match failure domains by their `status.failureDomains[].labels`.
                              Across all candidate Providers, only failure domains whose labels
                              match are considered.
                            nullable: true
                            properties:
                              matchExpressions:
                                items:
                                  properties:
                                    key:
                                      type: string
                                    operator:
                                      enum:
                                      - In
                                      - NotIn
                                      - Exists
                                      - DoesNotExist
                                      type: string
                                    values:
                                      items:
                                        type: string
                                      type: array
                                  required:
                                  - key
                                  - operator
                                  type: object
                                type: array
                              matchLabels:
                                additionalProperties:
                                  type: string
                                type: object
                            type: object
                          providerSelector:
                            description: |-
                              Match Providers by their `metadata.labels`. A Provider is a candidate
                              only if its labels match this selector.
                            nullable: true
                            properties:
                              matchExpressions:
                                items:
                                  properties:
                                    key:
                                      type: string
                                    operator:
                                      enum:
                                      - In
                                      - NotIn
                                      - Exists
                                      - DoesNotExist
                                      type: string
                                    values:
                                      items:
                                        type: string
                                      type: array
                                  required:
                                  - key
                                  - operator
                                  type: object
                                type: array
                              matchLabels:
                                additionalProperties:
                                  type: string
                                type: object
                            type: object
                        type: object
                      userData:
                        description: |-
                          Optional user-data delivered to the guest via the image's
                          `guestAgent` (cloud-init / ignition / sysprep).
                        nullable: true
                        properties:
                          configMapRef:
                            description: |-
                              Key in a ConfigMap in the VirtualMachine's namespace (key defaults to
                              [`DEFAULT_USER_DATA_KEY`]).
                            nullable: true
                            properties:
                              key:
                                description: Key within the object's `data`. Defaults are caller-defined.
                                nullable: true
                                type: string
                              name:
                                description: Name of the ConfigMap / Secret in the referrer's namespace.
                                type: string
                            required:
                            - name
                            type: object
                          secretRef:
                            description: |-
                              Key in a Secret in the VirtualMachine's namespace (key defaults to
                              [`DEFAULT_USER_DATA_KEY`]).
                            nullable: true
                            properties:
                              key:
                                description: Key within the object's `data`. Defaults are caller-defined.
                                nullable: true
                                type: string
                              name:
                                description: Name of the ConfigMap / Secret in the referrer's namespace.
                                type: string
                            required:
                            - name
                            type: object
                        type: object
                    required:
                    - classRef
                    - imageRef
                    type: object
                required:
                - spec
                type: object
              warmReplicas:
                description: How many Ready, unclaimed members to keep available.
                format: uint32
                minimum: 0.0
                type: integer
            required:
            - maxReplicas
            - readiness
            - template
            - warmReplicas
            type: object
          status:
            nullable: true
            properties:
              available:
                default: 0
                description: 'Ready and unclaimed: what a claim can bind right now.'
                format: uint32
                minimum: 0.0
                type: integer
              claimed:
                default: 0
                format: uint32
                minimum: 0.0
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              imageRevision:
                description: Image revision new members are currently being built from.
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              provisioning:
                default: 0
                format: uint32
                minimum: 0.0
                type: integer
              replicas:
                default: 0
                description: Members of any phase, excluding ones already being deleted.
                format: uint32
                minimum: 0.0
                type: integer
            type: object
        required:
        - spec
        title: VirtualMachinePool
        type: object
    served: true
    storage: true
    subresources:
      status: {}
