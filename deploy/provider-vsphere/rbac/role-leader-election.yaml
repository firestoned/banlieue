#
# Leader election for banlieue-provider-vsphere: its own Lease and nothing else (ADR-0102).
# Lease rights used to sit in the shared ClusterRole, which a
# ClusterRoleBinding grants cluster-wide: any Lease in any namespace,
# including other components' and kube-node-lease. `create` cannot be
# narrowed by resourceNames, so it is its own rule, confined to this
# namespace; every verb that names a Lease names only banlieue-provider-vsphere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banlieue-provider-vsphere-leader-election
  namespace: banlieue-system
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: provider-vsphere
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["banlieue-provider-vsphere"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banlieue-provider-vsphere-leader-election
  namespace: banlieue-system
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: provider-vsphere
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banlieue-provider-vsphere-leader-election
subjects:
  - kind: ServiceAccount
    name: banlieue-provider-vsphere
    namespace: banlieue-system
