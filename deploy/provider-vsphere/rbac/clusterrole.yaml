#
# Cluster-wide role for the vSphere provider binary.
#
# Multi-tenancy: the role is cluster-wide so the provider can reconcile
# VSphereMachine CRs in any tenant namespace it serves (ADR-0133). RBAC cannot
# be scoped by namespace label, so this is the ceiling and the provider's own
# namespace selector (--watch-namespace-selector, rendered by the operator from
# Provider.spec.namespaceSelector) is the gate. Per-namespace RoleBindings could
# narrow this if a deployment wants tighter scopes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: banlieue-provider-vsphere
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: provider-vsphere
rules:
  # ---------------------------------------------------------------------------
  # banlieue.io group — read Providers, patch their status
  # ---------------------------------------------------------------------------
  - apiGroups: ["banlieue.io"]
    resources:
      - providers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["banlieue.io"]
    resources:
      - providers/status
    verbs: ["get", "update", "patch"]

  # VMImage status: phase 1B iter 2+ flips perProvider[vsphere].ready
  # when a template is verified or imported. `update`/`patch` on the main
  # resource (not just /status) is for the banlieue.io/vmimage finalizer
  # (ADR-0028) — ensure_finalizer/remove_finalizer merge-patch
  # metadata.finalizers on the main resource, a distinct verb grant from
  # the /status subresource used for the perProvider readiness patches.
  - apiGroups: ["banlieue.io"]
    resources:
      - vmimages
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["banlieue.io"]
    resources:
      - vmimages/status
    verbs: ["update", "patch"]

  # ---------------------------------------------------------------------------
  # infrastructure.banlieue.io group — VSphereMachine lifecycle (iter 2+)
  # ---------------------------------------------------------------------------
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - vspheremachines
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - vspheremachines/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - vspheremachines/finalizers
    verbs: ["update"]

  # ---------------------------------------------------------------------------
  # CAPI IPAM contract — for Pool-based IpamSpec (iter 2+)
  # ---------------------------------------------------------------------------
  - apiGroups: ["ipam.cluster.x-k8s.io"]
    resources:
      - ipaddressclaims
      - ipaddresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ---------------------------------------------------------------------------
  # Per-zone image import Jobs (ADR-0020): NOT here
  # ---------------------------------------------------------------------------
  # The import Jobs run in the build namespace (default `banlieue-imagebuild`),
  # and the provider's `jobs` verbs live in a Role there: rendered per Provider
  # by the operator (crates/banlieue-operator/src/workload.rs,
  # build_jobs_role), by `banlieue bootstrap provider vsphere`, and for this
  # static install in role-jobs.yaml. This ClusterRole is bound cluster-wide,
  # so a `jobs` `create` here would be pod create in EVERY namespace, as any
  # ServiceAccount there. deploy/admission/provider-jobs.yaml confines what a
  # provider identity's Jobs may run.

  # ---------------------------------------------------------------------------
  # Core resources
  # ---------------------------------------------------------------------------
  # NO secrets / configmaps here, deliberately (security review 2026-07-31
  # CHAIN-002). This ClusterRole is bound cluster-wide to every
  # provider pod, so any rule here reaches EVERY Secret in the cluster —
  # silently defeating the resourceNames-scoped per-instance Role the operator
  # builds for each Provider (ADR-0003). Every credential and CA-bundle read
  # in the provider is by name in the Provider's namespace, and that Role
  # already grants exactly those objects; the rules here were redundant
  # privilege and have been removed.

  # Namespaces, read-only (ADR-0133). `--watch-namespace-selector` serves the
  # VSphereMachines in the namespaces whose labels match, so the provider lists
  # and watches Namespace objects, and probes the selector with a one-item list
  # at startup. No write verb, deliberately: a provider that could relabel a
  # namespace could choose its own scope. Labelling a namespace in is a platform
  # admin's act, never the provider's. No `get`: nothing here reads one
  # namespace by name.
  #
  # This grants the provider NO access to anything IN those namespaces beyond
  # the VSphereMachine rules above. In particular there is still no Secret or
  # ConfigMap rule: the provider reads its own Provider, credentials and CA
  # bundle from its home namespace through the namespaced Role, never from a
  # tenant namespace, so tenants with Secret read in their own namespace cannot
  # reach the hypervisor credentials.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]

  # Emit Events for state transitions visible via `kubectl describe provider`.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Leader-election Leases are NOT granted here: a ClusterRoleBinding would
  # grant them on every Lease in the cluster. Each role gets a namespaced
  # Role narrowed to its own Lease instead (ADR-0102): built by `banlieue
  # bootstrap`, and in deploy/provider-vsphere/rbac/role-leader-election.yaml, or by the operator
  # for the providers it runs.
