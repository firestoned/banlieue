#
# Cluster-wide role for the vSphere provider binary.
#
# Multi-tenancy: the role is cluster-wide so the provider can reconcile
# Provider and VSphereMachine CRs in any tenant namespace. Per-namespace
# RoleBindings could narrow this if a deployment wants tighter scopes —
# for now, banlieue ships the cluster-wide pattern matching the main
# controller.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: banlieue-provider-vsphere
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: provider-vsphere
rules:
  # ---------------------------------------------------------------------------
  # banlieue.io group — read Providers, patch their status
  # ---------------------------------------------------------------------------
  - apiGroups: ["banlieue.io"]
    resources:
      - providers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["banlieue.io"]
    resources:
      - providers/status
    verbs: ["get", "update", "patch"]

  # VMImage status: phase 1B iter 2+ flips perProvider[vsphere].ready
  # when a template is verified or imported. `update`/`patch` on the main
  # resource (not just /status) is for the banlieue.io/vmimage finalizer
  # (ADR-0028) — ensure_finalizer/remove_finalizer merge-patch
  # metadata.finalizers on the main resource, a distinct verb grant from
  # the /status subresource used for the perProvider readiness patches.
  - apiGroups: ["banlieue.io"]
    resources:
      - vmimages
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["banlieue.io"]
    resources:
      - vmimages/status
    verbs: ["update", "patch"]

  # ---------------------------------------------------------------------------
  # infrastructure.banlieue.io group — VSphereMachine lifecycle (iter 2+)
  # ---------------------------------------------------------------------------
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - vspheremachines
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - vspheremachines/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - vspheremachines/finalizers
    verbs: ["update"]

  # ---------------------------------------------------------------------------
  # CAPI IPAM contract — for Pool-based IpamSpec (iter 2+)
  # ---------------------------------------------------------------------------
  - apiGroups: ["ipam.cluster.x-k8s.io"]
    resources:
      - ipaddressclaims
      - ipaddresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ---------------------------------------------------------------------------
  # Per-zone image import Jobs (ADR-0020). Job names are computed at runtime
  # (`import-<image>-<provider>-<zone>`), so a resourceNames-scoped Role can't
  # express this — same reasoning as vspheremachines/providers above. Lives in
  # the imagebuild namespace (default `banlieue-imagebuild`), not
  # banlieue-system, hence cluster-wide here rather than the per-instance Role.
  # `get` to check for an existing Job, `create`+`patch` for the SSA apply
  # that creates or adopts it, `delete` for the `banlieue.io/force-reimport`
  # recreate path. `list`+`watch` are for the VMImage Controller's
  # `.watches(import_job_api, ...)` — a per-zone Job's status change now
  # re-triggers its VMImage's reconciliation immediately instead of via a
  # 5-minute poll; kube-runtime's watcher needs both verbs to build and
  # maintain that informer cache, same as any other watched type. No
  # `update`, since nothing here does that. The operator's own ClusterRole
  # (`deploy/operator/rbac/clusterrole.yaml`) must hold at least this same
  # set to hand it out via ClusterRoleBinding (RBAC refuses to let a grantor
  # delegate permissions it does not itself have).
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # ---------------------------------------------------------------------------
  # Core resources
  # ---------------------------------------------------------------------------
  # NO secrets / configmaps here, deliberately (security review 2026-07-31
  # CHAIN-002). This ClusterRole is bound cluster-wide to every
  # provider pod, so any rule here reaches EVERY Secret in the cluster —
  # silently defeating the resourceNames-scoped per-instance Role the operator
  # builds for each Provider (ADR-0003). Every credential and CA-bundle read
  # in the provider is by name in the Provider's namespace, and that Role
  # already grants exactly those objects; the rules here were redundant
  # privilege and have been removed.

  # Emit Events for state transitions visible via `kubectl describe provider`.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Leases for leader election. Provider uses the same SDK pattern as the
  # main controller (GET + CREATE + server-side-apply PATCH).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
