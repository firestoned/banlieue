#
# Identity every per-zone import Job runs as (banlieue-provider-vsphere
# ADR-0020, banlieue-provider-libvirt ADR-0011) — in the build namespace,
# alongside the artifacts PVC. Deliberately NOT the provider controller's own
# identity: that one can create Jobs, so a workload holding it in this
# privileged namespace could create further privileged pods (SEC-009). This
# identity starts with zero permissions of its own; banlieue-operator grants
# it read-only, resourceNames-scoped access to exactly the credentials Secret
# each Provider's import needs, via a per-Provider Role + RoleBinding created
# in the Provider's own namespace (see banlieue-operator's `workload.rs`,
# `IMPORT_SERVICE_ACCOUNT`).
#
# Found missing live (2026-08-20): every provider's Job pod template sets
# `serviceAccountName: banlieue-import`, but nothing in `deploy/` ever
# created the ServiceAccount itself — invisible until the first time an
# import Job actually reached pod creation, which needed both the
# per-zone-import RBAC fix and the Job-name-collision fix to land first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banlieue-import
  namespace: banlieue-imagebuild
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: imagebuilder
