#
# Identity the Azure image publish Job runs as (ADR-0162 Decision 1), in the
# build namespace beside the artifacts PVC. Deliberately NOT the Azure
# provider's own identity: the provider may create Jobs, and only reads
# published images in Azure.
#
# It holds no Kubernetes RBAC at all, and its pods do not mount an API server
# token (`automountServiceAccountToken: false`): the Job never calls the API
# server. Its one use is the projected token (audience
# api://AzureADTokenExchange) that Entra ID exchanges for the publisher's own
# identity, `Provider.spec.connection.azure.publisher.clientId` (ADR-0159
# Decision 3). That identity's federated credential trusts exactly the subject
#
#   system:serviceaccount:banlieue-imagebuild:banlieue-azure-publisher
#
# so moving the build namespace (`--build-namespace`) changes the subject too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banlieue-azure-publisher
  namespace: banlieue-imagebuild
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: imagebuilder
automountServiceAccountToken: false
