#
# Cluster-wide role for banlieue-imagebuilder (ADR-0010).
#
# Least privilege: this role creates/reads OSArtifact CRs (kairos-operator, a
# CRD it does not own) and patches VMImage.status.buildArtifact. It holds NO
# Secret access at all — see the note where that rule used to be.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: banlieue-imagebuilder
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: imagebuilder
rules:
  # ---------------------------------------------------------------------------
  # banlieue.io group — read VMImage, patch only status.rawDiskArtifact
  # ---------------------------------------------------------------------------
  - apiGroups: ["banlieue.io"]
    resources:
      - vmimages
    verbs: ["get", "list", "watch"]
  - apiGroups: ["banlieue.io"]
    resources:
      - vmimages/status
    verbs: ["get", "update", "patch"]

  # ---------------------------------------------------------------------------
  # build.kairos.io group — kairos-operator's OSArtifact CRD. banlieue does
  # NOT own or generate this CRD; the platform operator installs it
  # separately. "create" AND "patch" are both required: server-side apply is a
  # patch when the object exists and a CREATE when it does not, so a role with
  # only "patch" works for updates and 403s the first time it must make the
  # OSArtifact — which is every fresh build. (Observed on a live cluster; the
  # previous comment here claimed patch alone "covers server-side apply".)
  # "delete" is required by the SEC-005 staleness rule (security review
  # 2026-07-31): an OSArtifact that is not owned by the reconciled VMImage's
  # UID, or whose spec no longer matches the requested build, is deleted and
  # rebuilt — kairos' status has no observedGeneration/digest to bind a Ready
  # to the spec, so a stale Ready must never be mirrored. Owned artifacts are
  # otherwise garbage-collected with their VMImage (ownerReference).
  # ---------------------------------------------------------------------------
  - apiGroups: ["build.kairos.io"]
    resources:
      - osartifacts
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # ---------------------------------------------------------------------------
  # Core resources
  # ---------------------------------------------------------------------------
  # Emit Events for state transitions visible via `kubectl describe vmimage`.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

  # NO secrets rule, deliberately (ADR-0041). ADR-0037's cloud-config merge
  # does read and write Secret *content* — but only ever in the build
  # namespace, and this is a ClusterRole: bound by a ClusterRoleBinding it has
  # no namespace scope whatsoever, so a rule here would reach every Secret in
  # every namespace, read AND write. That is how it shipped between 2026-08-27
  # and 2026-09-09, under a comment asserting it was "scoped to the imagebuild
  # namespace" — the same defect already removed from the provider ClusterRoles
  # (CHAIN-002) and the controller's (SEC-008).
  #
  # The grant now lives in deploy/imagebuilder/rbac/role.yaml: a namespaced
  # Role in banlieue-imagebuild, bound to this ServiceAccount in
  # banlieue-system. Guarded by
  # `only_the_operator_cluster_role_may_grant_secret_access` in
  # crates/banlieue-operator/src/bootstrap_tests.rs.

  # Leases for leader election. Same SDK pattern as every other banlieue role.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
