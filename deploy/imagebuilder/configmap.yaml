apiVersion: v1
kind: ConfigMap
metadata:
  name: banlieue-imagebuilder-config
  namespace: banlieue-system
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: imagebuilder
data:
  RUST_LOG: "info,kube=warn"
  RUST_LOG_FORMAT: "json"
  BANLIEUE_METRICS_PORT: "8080"
  BANLIEUE_HEALTH_PORT: "8081"
  BANLIEUE_LEADER_ELECTION_ID: "banlieue-imagebuilder"
  BANLIEUE_LEADER_ELECTION_NAMESPACE: "banlieue-system"
  # OSArtifact CRs (and the artifacts PVCs kairos-operator creates for them)
  # are placed here. A provider's per-zone import Jobs must run in this same
  # namespace to mount the shared artifacts PVC (ADR-0010). Deliberately NOT
  # banlieue-system: kairos-operator's build pods require
  # securityContext.privileged=true, which banlieue-system's `restricted` Pod
  # Security level rejects. See deploy/imagebuilder/namespace.yaml.
  BANLIEUE_BUILD_NAMESPACE: "banlieue-imagebuild"
  # Registry push for host-resident providers (ADR-0064). Unset: nothing is
  # pushed, and a cloud-hypervisor Url source reports that no registry is
  # configured. The credentials Secret is kubernetes.io/basic-auth, in the
  # build namespace.
  # BANLIEUE_REGISTRY_REPOSITORY: "registry.internal:5000/banlieue/disks"
  # BANLIEUE_REGISTRY_CREDENTIALS_SECRET: "banlieue-registry-push"
  # A registry served by a private CA: the push Job trusts the PEM in one key
  # of a ConfigMap OR a Secret in the build namespace, in addition to the
  # public roots (ADR-0110). The key defaults to ca.crt.
  # BANLIEUE_REGISTRY_CA_BUNDLE_CONFIG_MAP: "corp-ca-bundle"
  # BANLIEUE_REGISTRY_CA_BUNDLE_SECRET: "corp-ca-bundle"
  # BANLIEUE_REGISTRY_CA_BUNDLE_KEY: "ca.crt"
  # A cluster that mirrors images must repoint the push Job's image too: it
  # defaults to the public banlieue image, which such a cluster cannot pull.
  # BANLIEUE_PUSH_IMAGE: "mirror.internal/firestoned/banlieue:v0.0.0-distroless@sha256:<digest>"
  # Pre-laying (ADR-0113): the image a VMImage with spec.prelay is pre-laid
  # with, built from Dockerfile.prelay. The Job runs privileged and needs
  # /dev/kvm on the build node, so pair it with a build node selector. Unset:
  # such a VMImage fails with PrelayImageUnset.
  # BANLIEUE_PRELAY_IMAGE: "registry.internal:5000/banlieue/prelay:v0.0.0"
