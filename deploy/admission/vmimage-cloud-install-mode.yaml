#
# VMImage install mode on a cloud (ADR-0162 Decision 7). A cloud Provider has
# no install-media path: there is no ISO to attach to a cloud VM, so an image
# whose clones finish their install from an attached ISO on first boot
# (`spec.template.installMode: deferred`, ADR-0040) cannot run there. This
# policy refuses that combination at admission instead of letting every
# machine fail at create time.
#
# The ISO half of Decision 7 needs no rule of its own: no `sources[].kind`
# names an ISO (the build artifact kind is status, chosen by the
# imagebuilder), and a cloud image is a `Template` (a published gallery image
# version, an AMI) or a published `Url` build (ADR-0162 Decisions 4 and 9).
# ec2 refuses deferred installs for the same reason (ADR-0167 Decision 5).
#
# The second rule refuses `trustedBoot` (ADR-0051) on an image with an `ec2`
# source (ADR-0167 Decision 5): UEFI Secure Boot on EC2 needs the AMI's own
# UEFI variable store, which no banlieue publisher writes. Which Provider a
# VirtualMachine lands on is not known at admission, but the image's sources
# are, so the image is refused here; the scheduler refuses the placement
# again (TrustedBootUnsupported) for an image admitted before this rule.
#
# The cloud classes are listed by name, as provider-connection.yaml does.
# Add a class here in the same change that ships it.
#
# Requires Kubernetes 1.30+ (ValidatingAdmissionPolicy GA).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: banlieue-vmimage-cloud-install-mode
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["banlieue.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["vmimages"]
  # Only images that can land on a cloud class carry anything to check.
  matchConditions:
    - name: has-cloud-source
      expression: "object.spec.sources.exists(s, s.providerClass in ['azure', 'ec2'])"
  validations:
    - expression: >-
        !has(object.spec.template)
          || !has(object.spec.template.installMode)
          || object.spec.template.installMode != 'deferred'
      message: >-
        spec.template.installMode: deferred cannot be combined with a cloud
        source (azure, ec2): a cloud VM has no install-media path (ADR-0162).
      reason: Invalid
    - expression: >-
        !has(object.spec.trustedBoot)
          || !object.spec.sources.exists(s, s.providerClass == 'ec2')
      message: >-
        spec.trustedBoot cannot be combined with an ec2 source: UEFI Secure
        Boot on EC2 needs the AMI's own UEFI variable store, which banlieue
        does not write (ADR-0167 Decision 5).
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: banlieue-vmimage-cloud-install-mode
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: admission
spec:
  policyName: banlieue-vmimage-cloud-install-mode
  validationActions: ["Deny"]
