#
# credentialsRef authorization (security review 2026-07-31 CHAIN-001). The endpoint checks in provider-connection.yaml cannot stop a
# Provider pointing at an attacker host that holds a *valid* TLS certificate —
# the provider would still POST the named credentials there. This policy
# closes that hop: the principal creating or updating a Provider must itself
# be authorized to `get` the Secret named by spec.connection.credentialsRef.
# A delegated platform role (create providers, but not read arbitrary Secrets)
# can then only reference credentials it already controls.
#
# ADR-0157 narrows it to what moves a credential, and widens who may:
#
#   - it is checked on a CREATE, and on an UPDATE whose spec.connection differs
#     from the old object's: the endpoint, the CA and insecureSkipTLSVerify as
#     much as credentialsRef, since an unchanged credential re-pointed at another
#     endpoint is delivered just as well. A label, an annotation or a capability
#     moves no credential and is not checked;
#   - `get` on the Secret will do, or `reference`: a custom verb, like `use` and
#     `bind`, that RBAC grants and nothing implements. It names a Secret, reads
#     nothing, and is as strong as `get` toward the endpoint, so grant it by
#     exact resourceNames or to a principal that bounds what it names itself
#     (faubourg's controller, through faubourg-provider-connection). Nobody
#     holds it by default.
#
# Uses the CEL `authorizer` variable, evaluated as the admission request's
# principal. Enforced in the API server (no webhook).
#
# NOTE: shipped as a separate file from provider-connection.yaml because it
# needs an apiserver new enough to support `authorizer` in admission policies.
# On an older apiserver this one file is rejected while the rest of
# deploy/admission/ still applies.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: banlieue-provider-credentialsref-authorization
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["banlieue.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["providers"]
  variables:
    # Structural equality over the whole connection, so a field added to it
    # later is covered too. oldObject is null on CREATE.
    - name: connectionChanged
      expression: >-
        oldObject == null || !has(oldObject.spec.connection)
        || oldObject.spec.connection != object.spec.connection
  validations:
    # A Provider that names no credentials (a host-resident backend, ADR-0060
    # Decision 4) references no Secret, so there is nothing to authorize.
    - expression: >-
        !variables.connectionChanged
        || !has(object.spec.connection.credentialsRef)
        || authorizer.group('').resource('secrets')
          .namespace(object.metadata.namespace)
          .name(object.spec.connection.credentialsRef.name)
          .check('get').allowed()
        || authorizer.group('').resource('secrets')
          .namespace(object.metadata.namespace)
          .name(object.spec.connection.credentialsRef.name)
          .check('reference').allowed()
      messageExpression: >-
        'spec.connection.credentialsRef names Secret '
        + object.spec.connection.credentialsRef.name + ' in namespace '
        + object.metadata.namespace
        + ', which you may neither get nor reference; a Provider whose connection'
        + ' you set or change may only name credentials you may read or reference'
        + ' (ADR-0157).'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: banlieue-provider-credentialsref-authorization
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: admission
spec:
  policyName: banlieue-provider-credentialsref-authorization
  validationActions: ["Deny"]
