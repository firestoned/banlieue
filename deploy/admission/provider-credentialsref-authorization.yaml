#
# credentialsRef authorization (security review 2026-07-31 CHAIN-001). The endpoint checks in provider-connection.yaml cannot stop a
# Provider pointing at an attacker host that holds a *valid* TLS certificate —
# the provider would still POST the named credentials there. This policy
# closes that hop: the principal creating or updating a Provider must itself
# be authorized to `get` the Secret named by spec.connection.credentialsRef.
# A delegated platform role (create providers, but not read arbitrary Secrets)
# can then only reference credentials it already controls.
#
# Uses the CEL `authorizer` variable, evaluated as the admission request's
# principal. Enforced in the API server (no webhook).
#
# NOTE: shipped as a separate file from provider-connection.yaml because it
# needs an apiserver new enough to support `authorizer` in admission policies.
# On an older apiserver this one file is rejected while the rest of
# deploy/admission/ still applies.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: banlieue-provider-credentialsref-authorization
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["banlieue.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["providers"]
  validations:
    - expression: >-
        authorizer.group('').resource('secrets')
          .namespace(object.metadata.namespace)
          .name(object.spec.connection.credentialsRef.name)
          .check('get').allowed()
      messageExpression: >-
        'spec.connection.credentialsRef names Secret '
        + object.spec.connection.credentialsRef.name + ' in namespace '
        + object.metadata.namespace
        + ', which you are not authorized to get; a Provider may only'
        + ' reference credentials its creator can read.'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: banlieue-provider-credentialsref-authorization
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: admission
spec:
  policyName: banlieue-provider-credentialsref-authorization
  validationActions: ["Deny"]
