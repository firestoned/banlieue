#
# Stamps banlieue.io/created-by on a VirtualMachine at CREATE, from
# request.userInfo.username (ADR-0089).
#
# This is the one optional annotation that answers "who built this VM" the
# same way sre-automations' cf-node tool's vCenter CreatedBy custom
# attribute does for hand-run rebuilds. banlieue-controller copies it into
# VSphereMachineSpec.created_by; the vSphere provider surfaces it as a
# vCenter CreatedBy custom attribute alongside Template/CreatedAt (both of
# which need no admission policy — they are read straight off data the
# VSphereMachine already carries).
#
# UNLIKE VirtualMachineClaim.spec.subject (ADR-0047 Decision 10), this
# annotation carries no authorization weight: nothing downstream trusts it
# to decide who may do what, so there is no companion immutability rule and
# no issuer allowlist. It is an audit convenience, not a security boundary —
# a principal with `update` on the VirtualMachine can edit or remove it, and
# that is accepted, not hardened against.
#
# MUTATING, not validating, which is why this needs MutatingAdmissionPolicy
# rather than the ValidatingAdmissionPolicy every other file in this
# directory uses: setting a field at admission requires mutation, and
# banlieue's no-extra-services posture (ADR-0007) rules out a mutating
# webhook for one annotation the same way it rules one out for validation.
# `operations: ["CREATE"]` only, so a later edit of the VirtualMachine by a
# different principal never overwrites who originally created it.
#
# `failurePolicy: Ignore`: a policy evaluation failure must never block a
# VirtualMachine create over an audit-convenience annotation.
#
# Requires Kubernetes 1.36+ (MutatingAdmissionPolicy GA, enabled by
# default) — newer than every ValidatingAdmissionPolicy floor in this
# directory (1.30). A cluster below that floor simply never gets the
# annotation: VSphereMachineSpec.created_by stays None and the vCenter
# CreatedBy attribute is omitted (Template/CreatedAt are unaffected).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: banlieue-virtualmachine-created-by
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: admission
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: ["banlieue.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["virtualmachines"]
  mutations:
    - patchType: "ApplyConfiguration"
      applyConfiguration:
        expression: >
          Object{
            metadata: Object.metadata{
              annotations: {"banlieue.io/created-by": request.userInfo.username}
            }
          }
  reinvocationPolicy: Never
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: banlieue-virtualmachine-created-by
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: admission
spec:
  policyName: banlieue-virtualmachine-created-by
