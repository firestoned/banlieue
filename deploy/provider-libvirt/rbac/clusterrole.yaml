#
# Cluster-wide role for the libvirt provider binary. Machines are watched
# cluster-wide so a shared provider can serve the tenant namespaces its
# selector picks (ADR-0133); credentials stay in the home namespace.
#
# Mirrors deploy/provider-vsphere/rbac/clusterrole.yaml, with LibvirtMachine
# in place of VSphereMachine (ADR-0050), minus IPAM (Pool-based IpamSpec is not
# wired for libvirt yet). The import Jobs' verbs are not here: they are a Role
# in the build namespace (see below).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: banlieue-provider-libvirt
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: provider-libvirt
rules:
  # ---------------------------------------------------------------------------
  # banlieue.io group — read Providers, patch their status
  # ---------------------------------------------------------------------------
  - apiGroups: ["banlieue.io"]
    resources:
      - providers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["banlieue.io"]
    resources:
      - providers/status
    verbs: ["get", "update", "patch"]

  # VMImage: the libvirt provider owns status.perProvider[libvirt] (ADR-0010).
  # status.rawDiskArtifact belongs to banlieue-imagebuilder's field manager;
  # the split is by field, not by permission, so both need patch here.
  - apiGroups: ["banlieue.io"]
    resources:
      - vmimages
    verbs: ["get", "list", "watch"]
  - apiGroups: ["banlieue.io"]
    resources:
      - vmimages/status
    verbs: ["update", "patch"]

  # ---------------------------------------------------------------------------
  # infrastructure.banlieue.io group — LibvirtMachine lifecycle (ADR-0050)
  # ---------------------------------------------------------------------------
  # No `create` and no `delete`: LibvirtMachines are created and deleted by
  # banlieue-controller, which owns them. This provider only realises them and
  # reports back, so it can read, patch spec.providerID, own status, and clear
  # its finalizer — nothing more. Least privilege: a compromised provider must
  # not be able to mint machines the controller never scheduled.
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - libvirtmachines
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - libvirtmachines/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - libvirtmachines/finalizers
    verbs: ["update"]

  # ---------------------------------------------------------------------------
  # Import Jobs (ADR-0011): NOT here
  # ---------------------------------------------------------------------------
  # The import Jobs run in the build namespace (default `banlieue-imagebuild`),
  # and the provider's `jobs` `get`/`create`/`patch` live in a Role there,
  # rendered per Provider by the operator
  # (crates/banlieue-operator/src/workload.rs, build_jobs_role) and by
  # `banlieue bootstrap provider libvirt`. This ClusterRole is bound
  # cluster-wide, so a `jobs` `create` here would be pod create in EVERY
  # namespace, as any ServiceAccount there. deploy/admission/provider-jobs.yaml
  # confines what a provider identity's Jobs may run.

  # ---------------------------------------------------------------------------
  # Core resources
  # ---------------------------------------------------------------------------
  # NO secrets / configmaps here, deliberately (security review 2026-07-31
  # CHAIN-002). This ClusterRole is bound cluster-wide, so any rule
  # here reaches EVERY Secret in the cluster — defeating the resourceNames-
  # scoped per-instance Role the operator builds for each Provider (ADR-0003).
  # The client certificate + key (Provider.spec.connection.credentialsRef) and
  # the CA that signed libvirtd's server certificate (connection.caBundle,
  # ADR-0008) are read by name in the Provider's namespace; the per-instance
  # Role already grants exactly those objects.

  # Namespaces, read-only (ADR-0133). `--watch-namespace-selector` serves the
  # LibvirtMachines in the namespaces whose labels match, so the provider lists
  # and watches Namespace objects, and probes the selector with a one-item list
  # at startup. No write verb, deliberately: a provider that could relabel a
  # namespace could choose its own scope. Labelling a namespace in is a platform
  # admin's act, never the provider's. No `get`: nothing here reads one
  # namespace by name.
  #
  # This grants the provider NO access to anything IN those namespaces beyond
  # the LibvirtMachine rules above. In particular there is still no Secret or
  # ConfigMap rule: the provider reads its own Provider, credentials and CA
  # bundle from its home namespace through the namespaced Role, never from a
  # tenant namespace, so tenants with Secret read in their own namespace cannot
  # reach the hypervisor credentials.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]

  # Emit Events for state transitions visible via `kubectl describe provider`.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Leader-election Leases are NOT granted here: a ClusterRoleBinding would
  # grant them on every Lease in the cluster. Each role gets a namespaced
  # Role narrowed to its own Lease instead (ADR-0102): built by `banlieue
  # bootstrap`, or by the operator
  # for the providers it runs.
