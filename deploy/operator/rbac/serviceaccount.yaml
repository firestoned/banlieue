#
# Identity for banlieue-operator. Deliberately separate from
# banlieue-controller's: the privilege to mint Deployments, ServiceAccounts and
# RBAC lives only here, and never enters the scheduler's identity (ADR-0012).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: banlieue-operator
  namespace: banlieue-system
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: operator
