apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: banlieue-controller
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: controller
    # Aggregated to CAPI manager so a future CAPI Machine referencing one of
    # our infrastructure CRDs can be authorised without a custom binding.
    cluster.x-k8s.io/aggregate-to-manager: "true"
rules:
  # ---------------------------------------------------------------------------
  # banlieue.io group — user-facing CRDs
  # ---------------------------------------------------------------------------
  - apiGroups: ["banlieue.io"]
    resources:
      - providers
      - providers/status
      - virtualmachines
      - virtualmachines/status
      - vmclasses
      - vmimages
      - vmimages/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # VirtualMachinePool (ADR-0046). No `create` and no `delete`: a pool is
  # authored by a user, and the controller only maintains its warm set and
  # reports on it. A compromised controller must not be able to mint pools —
  # each one creates VirtualMachines, so that would be an amplification step.
  # It does create and delete the pool's *members*, which the
  # `virtualmachines` grant above already covers.
  - apiGroups: ["banlieue.io"]
    resources:
      - virtualmachinepools
    verbs: ["get", "list", "watch"]
  - apiGroups: ["banlieue.io"]
    resources:
      - virtualmachinepools/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["banlieue.io"]
    resources:
      - virtualmachinepools/finalizers
    verbs: ["update"]

  # VirtualMachineClaim (ADR-0047). No `create` and no `update`, for the same
  # reason as pools and then some: creating a claim binds a VM to a named
  # subject, so a controller that could mint claims could attribute sandboxes
  # to people who never asked for one — and the audit trail would record it as
  # genuine. Claims are created by the consumer (or a broker), never here.
  #
  # `delete` IS granted: the expiry path destroys the member and then removes
  # the claim, so an expired hold cannot be mistaken for a live one. That adds
  # little reachable power, since ending a claim destroys a VirtualMachine the
  # controller can already delete directly.
  - apiGroups: ["banlieue.io"]
    resources:
      - virtualmachineclaims
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["banlieue.io"]
    resources:
      - virtualmachineclaims/status
    verbs: ["get", "update", "patch"]
  # The claim holds a finalizer of its own (banlieue.io/claim-protection), so
  # that "claim deleted" means "sandbox destroyed" rather than "delete issued".
  - apiGroups: ["banlieue.io"]
    resources:
      - virtualmachineclaims/finalizers
    verbs: ["update"]

  # Finalizer subresources — required when the controller writes
  # blockOwnerDeletion=true on owned objects' ownerReferences.
  - apiGroups: ["banlieue.io"]
    resources:
      - virtualmachines/finalizers
      - providers/finalizers
    verbs: ["update"]

  # ---------------------------------------------------------------------------
  # infrastructure.banlieue.io group — provider infra CRDs
  # ---------------------------------------------------------------------------
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - vspheremachines
      - vspheremachines/status
      - vspheremachinetemplates
      - libvirtmachines
      - libvirtmachines/status
      - libvirtmachinetemplates
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # VSphereCluster (CAPI InfraCluster) — the operator/CAPI owns its lifecycle;
  # the controller only watches it and writes its status (least privilege:
  # no create/delete).
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - vsphereclusters
    verbs: ["get", "list", "watch"]
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - vsphereclusters/status
    verbs: ["get", "update", "patch"]
  - apiGroups: ["infrastructure.banlieue.io"]
    resources:
      - vspheremachines/finalizers
      - libvirtmachines/finalizers
    verbs: ["update"]

  # ---------------------------------------------------------------------------
  # CAPI IPAM contract — for Pool-based IpamSpec
  # ---------------------------------------------------------------------------
  - apiGroups: ["ipam.cluster.x-k8s.io"]
    resources:
      - ipaddressclaims
      - ipaddresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ---------------------------------------------------------------------------
  # Core resources the controller reads or writes
  # ---------------------------------------------------------------------------
  # NO secrets rule, deliberately (security review 2026-07-31 SEC-008): no code
  # in banlieue-controller reads a Secret — provider credentials are read by
  # the providers themselves, user-data is handed to providers via the infra
  # CRDs. The rule was dead privilege standing by (and aggregated into the CAPI
  # manager). Re-add scoped (resourceNames/namespace) if a reconciler ever
  # needs it.

  # Emit Events for state transitions visible via `kubectl describe`.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Leases for leader election. banlieue's SDK uses GET + CREATE on first
  # acquisition and server-side-apply PATCH on every renewal and take-over.
  # `update` is kept for compatibility with any future helper that PUTs.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
