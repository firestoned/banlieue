#
# Namespace-scoped grant for banlieue-controller to resolve a
# VirtualMachine.spec.userData Secret or ConfigMap before inlining its
# (rendered) content onto the VSphereMachine it builds (ADR-0025).
# Deliberately a namespaced Role, not a ClusterRole rule: the controller
# resolves userData in the VM's own namespace, and a ClusterRole would let
# it read every Secret in the cluster. This Role covers banlieue-system.
# Since ADR-0130 the controller can serve other namespaces too: a tenant
# namespace whose VMs reference a userData Secret or ConfigMap needs a copy
# of this Role and RoleBinding, created by the administrator (see
# docs/src/guides/multi-tenancy.md, "Onboard a team").
#
# This is the "scoped (namespace)" case banlieue-controller's own
# ClusterRole comment (security review 2026-07-31, SEC-008) anticipated:
# "no code in banlieue-controller reads a Secret... re-add scoped
# (resourceNames/namespace) if a reconciler ever needs it."
#
# The same `get` on secrets lets the controller read a Cluster API Machine's
# bootstrap Secret by name for InfraMachines in this namespace (ADR-0129
# Decision 9). Another namespace that holds CAPI-owned InfraMachines needs a
# Role like this one, created by the administrator; see
# docs/src/guides/cluster-api.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banlieue-controller-userdata
  namespace: banlieue-system
  labels:
    app.kubernetes.io/name: banlieue
    app.kubernetes.io/component: controller
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
