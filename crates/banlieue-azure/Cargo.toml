[package]
name = "banlieue-azure"
# Internal to the workspace: only banlieue-api is published (ADR-0100).
publish = false
description = "First-party Azure Resource Manager client: federated token exchange, typed VM/NIC/disk/gallery requests, long-running operations, Retry-After, typed ARM errors, and an in-memory fake that refuses what ARM refuses (ADR-0164)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Protocol only, like banlieue-proxmox and banlieue-libvirt: no `kube`, no
# banlieue API types. Every dependency below is already in the lockfile, so
# this crate compiles no new third-party code (ADR-0164 Decision 2). reqwest
# is the workspace's (rustls, no bundled provider), as banlieue-proxmox uses.

[dependencies]
async-trait.workspace = true
base64.workspace = true
# Already locked through banlieue-proxmox: builds the token-exchange form.
form_urlencoded = "1"
# Timestamps for the orphan sweep's grace period (ARM `createdTime`).
jiff.workspace = true
reqwest.workspace = true
serde.workspace = true
# Deterministic names for a publish's temporaries and over-long image
# definitions (ADR-0162). Already in the lockfile.
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "io-util", "time"] }

[dev-dependencies]
# reqwest's `rustls-no-provider` panics at client build without a process
# default provider; the binary installs it (aws-lc-rs, X25519MLKEM768 first,
# ADR-0170), tests do it themselves.
banlieue-tls.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "sync", "time", "test-util"] }
