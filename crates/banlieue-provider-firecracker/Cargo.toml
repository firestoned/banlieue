[package]
name = "banlieue-provider-firecracker"
# Internal to the workspace: only banlieue-api is published (ADR-0100).
publish = false
description = "banlieue's host-resident provider for Firecracker. For now only the guest attestation signer (ADR-0143 Decisions 1, 4, 5, 6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# Pure-Rust X.509 issuance on `ring` (already in the lockfile through rustls
# and banlieue-oci's tests): the CA, the leaf and the signature. `x509-parser`
# lets rcgen read the CA certificate back and take a guest's public key from
# its SPKI; `pem` is the encoding. ADR-0143 Decision 6.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
# Reading the CSR with distinct failure reasons (parse, key type, signature)
# so each outcome has its own counter. `verify` is the CSR's own signature.
x509-parser = { workspace = true, features = ["verify"] }
# rcgen's validity type; already in the lockfile through rcgen.
time = "0.3"
# The 128-bit certificate serial, from the OS RNG.
getrandom.workspace = true
thiserror.workspace = true
# `io-util` for the generic stream, `time` for the read deadline.
tokio = { workspace = true, features = ["io-util", "time"] }

[dev-dependencies]
tempfile.workspace = true
base64.workspace = true
tokio = { workspace = true, features = ["io-util", "time", "macros", "rt", "test-util"] }
