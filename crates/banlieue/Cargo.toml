[package]
name = "banlieue"
description = "The unified banlieue binary — dispatches `controller` and `provider <name>` subcommands into the per-role library crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "banlieue"
path = "src/main.rs"

[features]
# All available providers are bundled by default. Build a slim binary with
# `--no-default-features --features <provider>` to drop other backends' deps.
default = ["vsphere", "imagebuilder", "libvirt", "proxmox", "cloud-hypervisor", "host"]
# Bundle the vSphere provider (`banlieue provider vsphere`). Pulls in vim_rs
# transitively via banlieue-provider-vsphere.
vsphere = ["dep:banlieue-provider-vsphere"]
# Bundle the libvirt provider (`banlieue provider libvirt`). Pulls in the
# first-party banlieue-libvirt client; no native libvirt library (ADR-0011).
libvirt = ["dep:banlieue-provider-libvirt"]
# Bundle the Proxmox VE provider (`banlieue provider proxmox`, ADR-0075). Uses
# the first-party banlieue-proxmox REST client; no native library (ADR-0074).
proxmox = ["dep:banlieue-provider-proxmox"]
# Bundle the host-resident Cloud Hypervisor provider (`banlieue provider
# cloud-hypervisor`, ADR-0060). Linux-only at runtime: it talks to systemd
# over D-Bus and creates taps on the KVM host it runs on.
cloud-hypervisor = ["dep:banlieue-provider-cloud-hypervisor"]
# Bundle `banlieue host cloud-hypervisor {preflight,status,selftest,install}`, which prepares a
# Cloud Hypervisor host from this binary (ADR-0067). Runs as root, once; never
# reachable from a reconciler, since no provider crate depends on it.
host = ["dep:banlieue-host"]
# Enable vcsim compatibility in the bundled vSphere provider (local dev / CI).
# Implies `vsphere`.
vcsim = ["vsphere", "banlieue-provider-vsphere/vcsim"]
# Bundle the provider-agnostic VMImage build pipeline (`banlieue imagebuilder`,
# ADR-0010). No heavy backend SDK to gate out — feature exists for consistency
# with the per-provider gating pattern, not for a real weight saving.
imagebuilder = ["dep:banlieue-imagebuilder"]

[dependencies]
banlieue-controller = { path = "../banlieue-controller" }
banlieue-operator = { path = "../banlieue-operator" }
banlieue-imagebuilder = { path = "../banlieue-imagebuilder", optional = true }
banlieue-provider-libvirt = { path = "../banlieue-provider-libvirt", optional = true }
banlieue-provider-proxmox = { path = "../banlieue-provider-proxmox", optional = true }
banlieue-provider-cloud-hypervisor = { path = "../banlieue-provider-cloud-hypervisor", optional = true }
banlieue-host = { path = "../banlieue-host", optional = true }
banlieue-provider-vsphere = { path = "../banlieue-provider-vsphere", optional = true }

clap.workspace = true
# Shell-completion generation for `banlieue completion <shell>`. Part of the
# clap-rs project; tracks clap's major version.
clap_complete = "4"
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
