[package]
name = "banlieue-provider-sdk"
description = "Shared runtime helpers used by banlieue-controller and every provider crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
banlieue-api = { path = "../banlieue-api" }
kube.workspace = true
k8s-openapi.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# Re-encoding DER certificates as PEM for CR status (ADR-0045).
base64.workspace = true
# EK certificate subject check shared by the KVM providers (ek.rs).
x509-parser.workspace = true
thiserror.workspace = true
# `net` + `io-util` back the health and metrics listeners (`httpd`), `time`
# their request-line read timeout and the leader-election sleeps, `signal` the
# shutdown future; `macros` + `rt-multi-thread` are the base runtime.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time"] }
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Metrics registry served on `--metrics-port` (ADR-0091).
prometheus-client.workspace = true
# Opt-in OTLP trace export from `init_tracing` (ADR-0092).
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
# Installs `ring` as the process crypto provider before the OTLP exporter's
# reqwest client (built with `rustls-no-provider`) makes its first TLS call.
rustls.workspace = true
chrono.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tempfile.workspace = true
