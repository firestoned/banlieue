[package]
name = "banlieue-provider-ec2"
# Internal to the workspace: only banlieue-api is published (ADR-0100).
publish = false
description = "banlieue provider for Amazon EC2. Watches Provider and EC2Machine CRs and reconciles them against EC2 through the first-party banlieue-aws client (ADR-0174)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Library only: the unified `banlieue` binary drives this via
# `banlieue_provider_ec2::run` for the `provider ec2` subcommand (ADR-0004).
# Every dependency below is already in the workspace lockfile.

[dependencies]
banlieue-api = { path = "../banlieue-api" }
banlieue-aws = { path = "../banlieue-aws" }
banlieue-provider-sdk = { path = "../banlieue-provider-sdk" }

kube.workspace = true
k8s-openapi.workspace = true
thiserror.workspace = true
anyhow.workspace = true
# Timestamps for the orphan sweep's grace period, the create back-off and
# the guest poll cadence, the same crate banlieue-aws and k8s-openapi use.
jiff.workspace = true

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing.workspace = true
clap.workspace = true
async-trait.workspace = true
# Installs the process crypto provider reqwest's `rustls-no-provider` needs
# (aws-lc-rs, X25519MLKEM768 first, ADR-0170), before the first TLS handshake.
banlieue-tls.workspace = true
# The orphan sweep's counters, registered in the SDK's per-process registry
# (ADR-0091); already in the graph through banlieue-provider-sdk.
prometheus-client.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
