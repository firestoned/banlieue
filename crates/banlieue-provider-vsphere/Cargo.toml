[package]
name = "banlieue-provider-vsphere"
description = "banlieue provider for VMware vSphere / vCenter. Watches Provider and VSphereMachine CRs and reconciles them against vCenter via the VI JSON API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Library only: the unified `banlieue` binary (crates/banlieue) drives this via
# `banlieue_provider_vsphere::run` for the `provider vsphere` subcommand
# (ADR-0004).

[features]
default = []
# Enable the optional vim_rs `vcsim_compat` feature so the provider tolerates
# vcsim's known divergences from production vCenter. Off by default — only
# turned on for local-dev / integration tests. The `banlieue` crate re-exports
# this as its own `vcsim` feature.
vcsim = ["vim_rs/vcsim_compat"]

[dependencies]
banlieue-api = { path = "../banlieue-api" }
banlieue-provider-sdk = { path = "../banlieue-provider-sdk" }

vim_rs = { workspace = true }

# BYOC HTTP client (ADR-0008/0009): we build the reqwest::Client ourselves (CA
# bundle + insecure flag) and inject it into vim_rs 0.5 in BYOC mode. Features
# pinned in [workspace.dependencies]: reqwest 0.13, rustls with the ring provider
# installed at startup (no OpenSSL, no aws-lc-rs).
reqwest = { workspace = true }
rustls = { workspace = true }
tokio-util = { workspace = true }

kube.workspace = true
k8s-openapi.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
anyhow.workspace = true

# `macros` backs `tokio::select!`; `rt-multi-thread` backs `tokio::spawn`. The
# health server / shutdown signal (net/io-util/signal) now live in the SDK's
# `bootstrap` module, so they are no longer needed here.
# `fs`/`io-util` back the image-import subcommand: streaming the ISO off the
# mounted artifacts PVC to hash it (SEC-004) without holding it in memory.
# `time` backs the CreateVM_Task poll loop (`tokio::time::sleep`, ADR-0020).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "io-util", "time"] }
futures.workspace = true

# SEC-004: verify the built ISO against its published checksum before it
# reaches any datastore. Same crate + version the libvirt import path uses.
sha2 = { workspace = true }

tracing.workspace = true

clap.workspace = true
async-trait.workspace = true
chrono.workspace = true

# guestinfo.userdata delivery (ADR-0024): already present transitively
# (pulled in by reqwest/vim_rs) at 0.22.1, so this adds no new third-party
# code to the build — just makes it a direct, usable dependency here.
base64 = "0.23"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
