[package]
name = "banlieue-provider-libvirt"
description = "banlieue provider for libvirt/KVM hosts. Watches Provider CRs of class `libvirt` and the libvirt half of VMImage, speaking libvirt's RPC protocol over mutual TLS via the first-party banlieue-libvirt client (ADR-0011)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Library only: the unified `banlieue` binary drives this via
# `banlieue_provider_libvirt::run` for the `provider libvirt` subcommand
# (ADR-0004).

[dependencies]
banlieue-api = { path = "../banlieue-api" }
banlieue-libvirt = { path = "../banlieue-libvirt" }
banlieue-provider-sdk = { path = "../banlieue-provider-sdk" }

kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
anyhow.workspace = true

# `fs` for the import subcommand: it stats and streams the raw disk artifact.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }
futures.workspace = true
tracing.workspace = true
clap.workspace = true
async-trait.workspace = true
sha2.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "fs"] }
# Timestamps for the e2e status conditions.
chrono.workspace = true
tempfile.workspace = true
