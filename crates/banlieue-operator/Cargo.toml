[package]
name = "banlieue-operator"
# Internal to the workspace: only banlieue-api is published (ADR-0100).
publish = false
description = "Provider lifecycle controller: turns Provider CRs into per-instance provider workloads (ADR-0003/0012), and installs banlieue into a cluster via `banlieue bootstrap` (ADR-0013)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Library only: the unified `banlieue` binary (crates/banlieue) drives this via
# `banlieue_operator::run` for the `operator` subcommand and
# `banlieue_operator::bootstrap::run` for `bootstrap` (ADR-0004).

[dependencies]
banlieue-api = { path = "../banlieue-api", features = ["yaml"] }
banlieue-provider-sdk = { path = "../banlieue-provider-sdk" }
# `require_digest` for `--image-digest` (ADR-0103): one definition of a valid
# digest, already linked into the banlieue binary.
banlieue-oci = { path = "../banlieue-oci" }

kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true

thiserror.workspace = true
anyhow.workspace = true

# `macros` backs `tokio::select!`; `rt-multi-thread` backs `tokio::spawn`.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

tracing.workspace = true

clap.workspace = true

[dev-dependencies]
# Only for the test that holds the operator's rendered variable names to the
# ones the Azure client reads (ADR-0176 Decision 8); the operator itself stays
# backend-agnostic and does not depend on it.
banlieue-azure = { path = "../banlieue-azure" }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
