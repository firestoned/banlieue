[package]
name = "banlieue-provider-cloud-hypervisor"
description = "banlieue's host-resident provider for Cloud Hypervisor: runs on the KVM host, reconciles CloudHypervisorMachines into supervised VMM processes (ADR-0060 to ADR-0065)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
banlieue-api = { path = "../banlieue-api" }
banlieue-cloud-hypervisor = { path = "../banlieue-cloud-hypervisor" }
banlieue-provider-sdk = { path = "../banlieue-provider-sdk" }
# Pulling Url images by digest (ADR-0064).
banlieue-oci = { path = "../banlieue-oci" }
reqwest.workspace = true

anyhow.workspace = true
# Reading the claims of the provider's own ServiceAccount token (token.rs).
base64.workspace = true
clap.workspace = true
futures.workspace = true
# Tap and bridge ioctls with no safe wrapper anywhere (sys.rs, two audited
# `unsafe` blocks); already in Cargo.lock.
libc = "0.2"
# Safe wrappers for the rest of sys.rs: sockets, interface index, FICLONE,
# effective ids. Already built for zbus; no new crate.
rustix = { version = "1", features = ["fs", "net", "process", "std"] }
async-trait.workspace = true
# `rt` for spawn_blocking; host file work stays off the executor.
# `net`, `io-util` and `time` for the guest report listener (report.rs).
tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }
kube = { workspace = true, features = ["runtime"] }
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
# systemd over D-Bus for transient guest units (ADR-0063); tokio runtime,
# not zbus's default async-io.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# The host-local config the bootstrap script writes (ADR-0062 Decision 4).
toml = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
libc = "0.2"
tempfile.workspace = true
