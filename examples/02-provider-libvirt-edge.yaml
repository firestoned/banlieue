#
# A single libvirt host advertising the same abstract "gold" and "prod"
# class names as the vSphere provider, even though libvirt has no native
# concept of storage tiers. The mapping is purely admin-declarative.
apiVersion: banlieue.io/v1alpha1
kind: Provider
metadata:
  name: libvirt-edge-host-7
  namespace: banlieue-system
  labels:
    dc: dc-edge
    env: edge
spec:
  providerClassRef:
    name: libvirt
  connection:
    # Mutual TLS only. banlieue speaks libvirt's RPC protocol directly rather
    # than shelling out to virsh (ADR-0011), so there is no ssh transport to
    # tunnel over: qemu+ssh:// is rejected at reconcile time, not silently
    # retried. Set up the host with scripts/bootstrap-libvirt-tls.sh.
    endpoint: qemu+tls://kvm-7.edge.example/system
    # Under libvirtd's auth_tls="none", the x509 client certificate IS the
    # credential — this Secret holds tls.crt and tls.key, and there is no
    # password anywhere.
    credentialsRef:
      name: libvirt-edge-creds
    # The CA that signed libvirtd's *server* certificate. Required: a private
    # CA is used in every realistic deployment, so falling back to public trust
    # roots would only fail later and less clearly.
    caBundle:
      configMapRef:
        name: libvirt-edge-ca
  capabilities:
    storageClasses:
      - name: gold          # admin asserts: on this host, gold = nvme pool
        target:
          pool: nvme-pool
      - name: standard
        target:
          pool: default
    networkClasses:
      - name: prod
        target:
          network: br-prod
      - name: mgmt
        target:
          network: br-mgmt
    features:
      - nestedVirtualization
