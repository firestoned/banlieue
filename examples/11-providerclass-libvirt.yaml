#
# ProviderClass for libvirt/KVM backends (ADR-0012).
#
# `banlieue bootstrap operator` seeds this automatically for every backend
# compiled into the binary, so you normally do not write it by hand. It is
# shown as a reference for the class fields. It carries no additionalRules:
# the import Jobs' RBAC is not a class concern (see the note at the end).
#
# Cluster-scoped: one class serves Providers in any namespace.
---
apiVersion: banlieue.io/v1alpha1
kind: ProviderClass
metadata:
  name: libvirt
spec:
  # Runs `banlieue provider libvirt` in the spawned Deployment.
  backend: libvirt

  image:
    repository: ghcr.io/firestoned/banlieue
    # Never `latest` in production: a mutable tag makes the running version
    # unknowable and defeats rollback.
    tag: v0.6.0
    pullPolicy: IfNotPresent

  # Leader-elected, so replicas buy failover rather than throughput.
  replicas: 1

  logging:
    level: info
    format: json

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # No additionalRules. The import Jobs (ADR-0011) run in the build namespace
  # (`banlieue-imagebuild`), which the per-instance Role these rules merge into
  # cannot reach; a `jobs` rule here would instead grant Job create in the
  # Provider's own namespace, beside the operator's ServiceAccount. The
  # operator renders the provider's Job verbs (`get`, `create`, `patch`) as a
  # Role in the build namespace for every libvirt Provider, and
  # deploy/admission/provider-jobs.yaml confines what those Jobs may run.
