# A large database tier VM class.
apiVersion: banlieue.io/v1alpha1
kind: VMClass
metadata:
  name: db-prod-large
spec:
  hardware:
    cpus: 8
    memoryMiB: 32768
    disks:
      - name: root
        sizeGiB: 80
        storageClass: gold
        provisioning: thin
      - name: data
        sizeGiB: 500
        storageClass: gold
        provisioning: eagerZeroed
  network:
    interfaces:
      - name: eth0
        networkClass: prod
        # Presence of `pool` (vs. `static`, vs. neither for DHCP) selects the
        # IPAM mode — there is no separate `source` field.
        #
        # NOTE (ADR-0033): pool-based IPAM is schema-only today. No
        # reconciler creates an IPAddressClaim, reads back the resulting
        # IPAddress, or garbage-collects one on delete — this VMClass will
        # validate and schedule, but the pool reference below is not
        # currently acted on.
        ipam:
          pool:
            poolRef:
              apiGroup: ipam.cluster.x-k8s.io
              kind: InClusterIPPool
              name: prod-pool
  firmware: efi-secure
  features:
    - hotAddCPU
    - hotAddMemory
    - efiSecureBoot
