# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html
#
# This file is consumed by `.github/workflows/build.yaml` (job: cargo-deny)
# which runs `cargo deny check --all-features` against the workspace.

[graph]
# Match the workflow invocation (`--all-features`) so the lockfile we audit
# reflects everything that actually ships.
all-features = true

[output]
feature-depth = 1

# ─── Advisories ─────────────────────────────────────────────────────────────
# Fail the build on any unpatched RustSec advisory or yanked crate version.
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# No ignores. The last two (RUSTSEC-2026-0194/0195, quick-xml via vim_rs)
# went when vim_rs 0.6.1 moved to quick-xml 0.42, past the 0.41.0 fix.
ignore = []

# ─── Licenses ───────────────────────────────────────────────────────────────
# Allow-list narrowed to the licenses actually present in the current dep tree
# (cargo-deny warns on entries that are never encountered, which is useful for
# noticing when an unexpected license slips in). Re-derive with:
#   cargo metadata --format-version 1 \
#     | python3 -c 'import json,sys,collections;
#                   print(collections.Counter(p["license"] for p in json.load(sys.stdin)["packages"]).most_common())'
# after any dep bump.
[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    # CDLA-Permissive-2.0 — a permissive *data* license (not source code).
    # Applies only to `webpki-root-certs`, the Mozilla CA root bundle shipped as
    # X.509 data, pulled transitively by reqwest 0.13's rustls-platform-verifier
    # (the vSphere BYOC client's OS-trust roots — ADR-0009). Both reqwest rustls
    # features depend on it, so it is not avoidable, and it carries no copyleft
    # or patent obligations on our code. https://cdla.dev/permissive-2-0/
    "CDLA-Permissive-2.0",
]
# Per-crate exceptions: a license allowed for one crate only, so it cannot
# spread to the rest of the tree unnoticed.
exceptions = [
    # Apache-2.0 WITH LLVM-exception: Apache-2.0 plus an exception that only
    # adds permissions (no attribution needed for compiled output). A
    # build-time dependency of `psm` (kube-client -> jsonpath-rust -> pest ->
    # pest_stack_guard -> psm), used by its build script to write a static
    # archive; nothing of it is linked into banlieue.
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "ar_archive_writer" },
]

# ─── Bans (multiple versions, wildcards, banned crates) ─────────────────────
[bans]
# Duplicates are reported as warnings (not failures). The `skip` list below
# explicitly suppresses entries we have looked at and accepted.
multiple-versions = "warn"
wildcards = "allow"
allow-wildcard-paths = true

skip = [
    # hashbrown 0.16 (transitive via tracing-subscriber/foldhash-using crates)
    # vs hashbrown 0.17 (newer chain). Transitive only.
    { crate = "hashbrown@0.16" },
]

skip-tree = []

# Banned crates. `ring` has no ML-KEM, so it cannot offer post-quantum key
# exchange; banlieue uses only rustls' aws-lc-rs provider with X25519MLKEM768
# first (ADR-0170). The ban keeps a dependency's default features from
# quietly bringing it back.
deny = [
    { crate = "ring", reason = "no post-quantum key exchange (ML-KEM); use aws-lc-rs (ADR-0170)" },
]

# ─── Sources (where crates may be fetched from) ─────────────────────────────
# Lock the toolchain to crates.io. No git deps, no alternate registries.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
