[workspace]
resolver = "2"
members = [
    "crates/banlieue",
    "crates/banlieue-api",
    "crates/banlieue-attestation-ca",
    "crates/banlieue-aws",
    "crates/banlieue-azure",
    "crates/banlieue-cloud-hypervisor",
    "crates/banlieue-oci",
    "crates/banlieue-proxmox",
    "crates/banlieue-controller",
    "crates/banlieue-diskformat",
    "crates/banlieue-guest-azure",
    "crates/banlieue-host",
    "crates/banlieue-imagebuilder",
    "crates/banlieue-libvirt",
    "crates/banlieue-operator",
    "crates/banlieue-provider-azure",
    "crates/banlieue-provider-cloud-hypervisor",
    "crates/banlieue-provider-firecracker",
    "crates/banlieue-provider-libvirt",
    "crates/banlieue-provider-proxmox",
    "crates/banlieue-provider-sdk",
    "crates/banlieue-provider-vsphere",
    "crates/banlieue-tls",
    "crates/banlieue-vex",
]
# cargo-fuzz crates are built by ClusterFuzzLite (CI) or `cargo +nightly fuzz`,
# never as part of the normal workspace build.
exclude = [
    "crates/banlieue-libvirt/fuzz",
]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/firestoned/banlieue"
homepage = "https://github.com/firestoned/banlieue"
authors = ["Erick Bourgeois <erick@jeb.ca>"]

[workspace.dependencies]
# Kubernetes: kube 5.0 pairs with k8s-openapi 0.29 (Kubernetes v1.37 types).
# The two move together; a k8s-openapi bump alone leaves two versions in the
# lock and the types stop matching. kube 5.2 (the RUSTSEC-2026-0600 fix)
# needs Rust 1.95, the workspace MSRV. Default features are off because they
# include `ring` (ADR-0170): `rustls-tls` plus `aws-lc-rs` gives hyper-rustls
# the aws-lc-rs provider, and the client config is built from the process
# default that `banlieue-tls` installs, X25519MLKEM768 first.
kube = { version = "~5.2", default-features = false, features = ["derive", "client", "runtime", "rustls-tls", "aws-lc-rs"] }
k8s-openapi = { version = "0.29", features = ["latest", "schemars"] }
schemars = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Safe-Rust YAML (de)serializer; replaces the deprecated serde_yaml, whose
# unsafe-libyaml backend is unmaintained (RUSTSEC-2024-0449).
serde-saphyr = "2.1"

# Errors
# Scratch directories in tests. Used by banlieue-vex and
# banlieue-provider-libvirt, so pinned once here per the dependency rule.
tempfile = "3"
thiserror = "2"
anyhow = "1"

# Async / runtime (used by controller crates in later phases)
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"

# Attestation CA and guest certificate signer (ADR-0143, ADR-0146): pure-Rust
# RustCrypto crates, no FFI and no subprocess (ADR-0143 Decision 6). p256 0.14
# (NIST P-256, ECDSA, PKCS#8/PEM) and x509-cert 0.3 (RFC 5280 certificate and
# PKCS#10 types, with the `builder`) are from the RustCrypto organisation and
# were released in 2026; both share the der/spki/pkcs8 0.8-0.11 generation.
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "sha256", "getrandom"] }
x509-cert = { version = "0.3", features = ["builder", "pem"] }

# Logging / telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Prometheus metrics on every role (ADR-0091). The Prometheus project's own
# client: OpenMetrics text encoding, no HTTP server and no TLS of its own (the
# SDK serves the registry from its hand-rolled listener).
prometheus-client = "0.26"

# OpenTelemetry trace export, opt-in through the standard OTEL_* environment
# (ADR-0092). OTLP over HTTP/protobuf only: no `grpc-tonic`, so no tonic and
# no second HTTP/2 stack. `reqwest-blocking-client` makes the exporter use the
# workspace's reqwest 0.13 (same major, so the `rustls-no-provider` feature set
# below applies and TLS uses the process provider `banlieue-tls` installs:
# aws-lc-rs, X25519MLKEM768 first, ADR-0170); the
# blocking client suits the SDK's thread-based batch span processor, which
# exports off the tokio runtime. Default features are off so the metrics/logs
# signals and the gRPC transport are never compiled in.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", default-features = false }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Misc
# Time: jiff, the same crate k8s-openapi 0.29 uses for `Time`. chrono is
# unmaintained (RUSTSEC-2026-0543) and was removed from the workspace.
jiff = "0.2"
async-trait = "0.1"
# Artifact integrity for provider import Jobs (SEC-004): the import subcommand
# hashes the built raw disk before streaming it to a backend.
sha2 = "0.11"
# OS randomness for VirtualMachineClaim nonces (ADR-0047): a claim's nonce
# must be unpredictable to a guest that has not been told it, so it comes
# from the OS CSPRNG and never from a UID or a clock. Already in the tree
# transitively; pinned here because the attestation work in roadmap 17's
# later phases needs the same source.
getrandom = "0.4"
# Decoding qemu-guest-agent payloads: `guest-file-read` returns file contents
# as base64 (ADR-0043). Well-known, actively maintained, decode-only use.
base64 = "0.23"

# mount(2)/umount2(2) for the Azure guest helper's read-only mount of the
# provisioning disk (ADR-0171). Already in the lockfile through tokio and
# getrandom; pinned here so the helper does not shell out to mount(8).
libc = "0.2"

# Parsing vTPM endorsement key certificates (ADR-0045). A guest reports its own
# EK certificate on libvirt, so banlieue must confirm the bytes really are an
# X.509 certificate issued to the domain it defined before publishing them into
# a status field consumers treat as one — a subject-CN read, not chain
# validation (which is ADR-0049's trust bundle). rusticata/x509-parser: 167M
# downloads, last commit 2026-08-06, parse-only and no_std-capable.
x509-parser = "0.18"

# vSphere (provider-vsphere only; pinned here so the long compile is cached at
# workspace level and any future provider that needs it gets the same pin).
# `default-features = false` turns OFF vim_rs's `default-client` feature so we use
# it in Bring-Your-Own-Client mode (ADR-0008/0009): banlieue supplies the
# reqwest::Client and vim_rs never builds one (so `reqwest/default` is never
# pulled in). vim_rs 0.5 is plain crates.io — the old 0.4.x vendor/patch pipeline
# that flipped reqwest to rustls is gone (noclue/vim_rs#37 shipped in 0.5).
vim_rs = { version = "0.7", default-features = false, features = ["defaults"] }

# reqwest — direct dep of provider-vsphere for the BYOC HTTP client (ADR-0008):
# banlieue builds the reqwest::Client (CA bundle, insecure flag) and injects it
# into vim_rs. Must track vim_rs 0.5's reqwest major (0.13) so the injected
# Client type matches. `rustls-no-provider` links rustls WITHOUT a crypto
# provider; every binary installs `banlieue-tls`'s aws-lc-rs provider, with
# X25519MLKEM768 first, as the process default at startup (ADR-0170, which
# replaced ADR-0009's `ring`: ring has no ML-KEM). No OpenSSL.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "stream"] }

# tokio-util `io`: `ReaderStream` wraps a tokio file as a byte stream so the
# vSphere datastore ISO upload streams instead of buffering multi-GB in memory
# (ADR-0020).
tokio-util = { version = "0.7", default-features = false, features = ["io"] }

# rustls: direct dep so `banlieue-tls` can install the aws-lc-rs CryptoProvider
# as the process default before any TLS use (reqwest's `rustls-no-provider`
# panics with "No provider set" otherwise). `prefer-post-quantum` puts
# X25519MLKEM768 first in aws-lc-rs's own default order too, so a provider
# installed by a dependency agrees with ours (ADR-0170). `ring` is never
# enabled: it has no ML-KEM, and deny.toml bans it. Version tracks the one
# kube/hyper-rustls resolve.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }

# The one process crypto provider (ADR-0170). Every binary and every test that
# makes a TLS connection installs it through `install_default_crypto_provider`.
banlieue-tls = { path = "crates/banlieue-tls" }

# Disk container formats banlieue writes itself: the fixed VHD for Azure
# (ADR-0162 Decision 2) and, later, roadmap 15's VMDK.
banlieue-diskformat = { path = "crates/banlieue-diskformat" }

[profile.release]
lto = "thin"
codegen-units = 1

# The Azure guest helper (ADR-0171) ships inside every Azure-bound image,
# so it is built for size: `cargo build -p banlieue-guest-azure --profile
# guest --target x86_64-unknown-linux-musl`. Only that binary uses it.
[profile.guest]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
