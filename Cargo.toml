[workspace]
resolver = "2"
members = [
    "crates/banlieue",
    "crates/banlieue-api",
    "crates/banlieue-controller",
    "crates/banlieue-imagebuilder",
    "crates/banlieue-libvirt",
    "crates/banlieue-operator",
    "crates/banlieue-provider-libvirt",
    "crates/banlieue-provider-sdk",
    "crates/banlieue-provider-vsphere",
    "crates/banlieue-vex",
]
# cargo-fuzz crates are built by ClusterFuzzLite (CI) or `cargo +nightly fuzz`,
# never as part of the normal workspace build.
exclude = [
    "crates/banlieue-libvirt/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/firestoned/banlieue"
homepage = "https://github.com/firestoned/banlieue"
authors = ["Erick Bourgeois <erick@jeb.ca>"]

[workspace.dependencies]
# Kubernetes — kube 4.0 pairs with k8s-openapi 0.28 (Kubernetes v1.36 types).
# Pinned to the 4.0.x line: kube 4.1+ requires rust 1.89, above our MSRV 1.88.
kube = { version = "~4.0", features = ["derive", "client", "runtime"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
schemars = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Errors
# Scratch directories in tests. Used by banlieue-vex and
# banlieue-provider-libvirt, so pinned once here per the dependency rule.
tempfile = "3"
thiserror = "2"
anyhow = "1"

# Async / runtime (used by controller crates in later phases)
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"

# Logging / telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
# Artifact integrity for provider import Jobs (SEC-004): the import subcommand
# hashes the built raw disk before streaming it to a backend.
sha2 = "0.11"

# vSphere (provider-vsphere only; pinned here so the long compile is cached at
# workspace level and any future provider that needs it gets the same pin).
# `default-features = false` turns OFF vim_rs's `default-client` feature so we use# it in Bring-Your-Own-Client mode (ADR-0008/0009): banlieue supplies the
# reqwest::Client and vim_rs never builds one (so `reqwest/default` is never
# pulled in). vim_rs 0.5 is plain crates.io — the old 0.4.x vendor/patch pipeline
# that flipped reqwest to rustls is gone (noclue/vim_rs#37 shipped in 0.5).
vim_rs = { version = "0.6", default-features = false, features = ["defaults"] }

# reqwest — direct dep of provider-vsphere for the BYOC HTTP client (ADR-0008):
# banlieue builds the reqwest::Client (CA bundle, insecure flag) and injects it
# into vim_rs. Must track vim_rs 0.5's reqwest major (0.13) so the injected
# Client type matches. `rustls-no-provider` links rustls WITHOUT a crypto
# provider; we install `ring` as the process default at startup (ADR-0009),
# sharing the single ring provider kube already uses (no aws-lc-rs, no OpenSSL).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "stream"] }

# tokio-util `io`: `ReaderStream` wraps a tokio file as a byte stream so the
# vSphere datastore ISO upload streams instead of buffering multi-GB in memory
# (ADR-0020).
tokio-util = { version = "0.7", default-features = false, features = ["io"] }

# rustls — direct dep so the binary can install the ring CryptoProvider as the
# process default before any TLS use (reqwest's `rustls-no-provider` panics with
# "No provider set" otherwise). Version tracks the one kube/hyper-rustls resolve.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
lto = "thin"
codegen-units = 1
