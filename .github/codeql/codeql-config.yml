#
# CodeQL config consumed by .github/workflows/codeql.yaml. Keeps
# generated / vendored output out of the scanning database so the
# analyzer doesn't waste time on files we don't ship and can't fix.

name: "banlieue CodeQL Config"

# Exclude generated or third-party content from analysis. We still
# scan every hand-written source file under crates/**, .github/, etc.
paths-ignore:
  # Rust build output (compiled artifacts, incremental-build state,
  # Cargo-vendored registry caches).
  - target/**
  # Generated CRD manifests (produced by the crdgen binary).
  - deploy/crds/**
  # Test code: unit `*_tests.rs` files and `crates/*/tests/` (live and e2e).
  # Never built into a shipped binary. Scanning it only produced
  # `rust/cleartext-logging` false positives: the query treats any `*uid*`
  # name as sensitive, so every test that prints a Kubernetes `metadata.uid`
  # or a tap name derived from one raised an alert (#52-#57, #104-#105,
  # #120-#125, #127-#128).
  - "**/*_tests.rs"
  - crates/*/tests/**
