#
# Dependabot auto-merge.
#
# On every Dependabot pull request, run the e2e gate (via the reusable
# e2e.yaml). If it passes:
#   - patch / minor updates  -> enable auto-merge (squash).
#   - major updates          -> leave the PR OPEN and comment, for manual review.
# If the e2e gate fails (or anything errors), nothing is merged — the PR is
# left open with a comment, which is the desired "leave open for me to
# investigate" fallback. This workflow is fail-safe: it can only ever ENABLE
# a merge on an explicit green run; every other path leaves the PR untouched.
#
# ── Prerequisites (repo settings — one-time, not code) ───────────────────────
#   1. Settings > General > "Allow auto-merge"  ......................  ENABLED
# ─────────────────────────────────────────────────────────────────────────────

name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Top-level read-only (OpenSSF Scorecard Token-Permissions). Jobs that need to
# enable auto-merge or comment declare elevated scopes at the job level. See
# .claude/rules/github-workflows.md.
permissions:
  contents: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Fetch Dependabot metadata
    # Gate on the PR *author* (who opened it), not github.actor (who triggered
    # the run). github.actor flips to a human the moment anyone merges/rebases/
    # pushes to a Dependabot branch, which would skip this and every downstream
    # job. pull_request.user.login stays 'dependabot[bot]' for the PR's life, so
    # auto-merge keeps working after a maintainer merges main in. For any other
    # author this (and every downstream job) is skipped, so the workflow no-ops
    # on human PRs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      update-type: ${{ steps.meta.outputs.update-type }}
      dependency-names: ${{ steps.meta.outputs.dependency-names }}
    steps:
      - name: Fetch metadata
        id: meta
        # SHA-pinned per repo policy; Dependabot's github-actions updater will
        # keep this current.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E gate
    needs: metadata
    # Skipped automatically when `metadata` is skipped (non-Dependabot PR).
    uses: ./.github/workflows/e2e.yaml

  auto-merge:
    name: Enable auto-merge (patch/minor)
    needs: [metadata, e2e]
    # success() ensures BOTH metadata and the e2e gate passed before we ever
    # enable a merge. Major bumps are excluded — held for manual review.
    if: ${{ success() && needs.metadata.outputs.update-type != 'version-update:semver-major' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (squash)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

  hold-major:
    name: Hold major update for review
    needs: [metadata, e2e]
    # e2e passed but it is a major bump — leave open, tell the reviewer.
    if: ${{ success() && needs.metadata.outputs.update-type == 'version-update:semver-major' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment (major held)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "✅ e2e passed, but this is a **major** version update — left open for manual review before merge."

  report-failure:
    name: Report e2e failure
    needs: [metadata, e2e]
    # Any failure in metadata or the e2e gate. Leaves the PR open and flags it.
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment (e2e failed)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "❌ e2e failed — auto-merge withheld. Left open for investigation. See the **E2E gate** job for logs."
