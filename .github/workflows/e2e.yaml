#
# End-to-end verification of the operator's contract against a real API server
# in a kind cluster (ADR-0014).
#
# What this proves that unit tests structurally cannot: that the apiserver
# ACCEPTS what banlieue-operator builds. A Deployment whose selector does not
# match its pod template, a resourceNames rule RBAC rejects, an ownerReference
# with a bad apiVersion, an SSA patch silently dropped because the CRD schema
# disagrees with the Rust type — all pass `cargo test` and fail here.
#
# What it deliberately does NOT prove: that a provider can reach a backend. The
# Provider under test points at `vcenter.invalid` (RFC 2606 — can never
# resolve), so its pod stays NotReady by design. Asserting on pod readiness
# would make this job permanently and unfixably red. See ADR-0014.
#
# No secrets, no registry, no backend — so this runs on fork PRs, unlike the
# signing jobs in build.yaml.
#
# The suite is SPLIT across independent jobs, one per `make kind-e2e-<suite>`
# target, each on its own kind cluster. A red X then names the contract that
# broke — "Pause semantics" rather than "the e2e" — and the suites run in
# parallel instead of end to end. They share nothing, so one failing suite
# neither hides nor pollutes the others.
#
# All logic lives in Makefile targets (`rules/github-workflows.md`); this file
# only installs tools and calls `make kind-e2e-ci E2E_SUITE=<suite>`. The same
# targets run locally: `make kind-e2e-<suite>`, or `make kind-e2e` for all of
# them in sequence on one cluster.

name: E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'deploy/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'scripts/kind-capi-controller.sh'
      - '.github/workflows/e2e.yaml'
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'deploy/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'scripts/kind-capi-controller.sh'
      - '.github/workflows/e2e.yaml'
  # Reusable: callable from build.yaml or a release pipeline.
  workflow_call:
    inputs:
      kind_node_image:
        description: 'kind node image (pins the Kubernetes version under test)'
        required: false
        type: string
        default: 'kindest/node:v1.31.0'
  workflow_dispatch:
    inputs:
      kind_node_image:
        description: 'kind node image (pins the Kubernetes version under test)'
        required: false
        type: string
        default: 'kindest/node:v1.31.0'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The API server's own checks on what we ship, before any build: structural
  # schemas and the estimated cost of every CEL rule, in the CRDs and in the
  # admission policies. No unit test runs the cost estimator; an uncapped
  # string under a CEL rule got the Provider CRD refused and failed every job
  # below at install (ADR-0176). This takes about a minute; the suites below
  # wait for it. Oldest and newest pinned Kubernetes: the newest is also the
  # only one that serves deploy/admission's MutatingAdmissionPolicy.
  apiserver-check:
    name: 🧪 API server accepts CRDs and policies (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest
            image: ${{ inputs.kind_node_image || 'kindest/node:v1.31.0' }}
          - name: Kubernetes 1.36
            image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply CRDs and admission policies to a kind API server
        env:
          KIND_NODE_IMAGE: ${{ matrix.image }}
        run: make kind-apiserver-check

  e2e:
    name: 🧪 ${{ matrix.name }}
    needs: apiserver-check
    runs-on: ubuntu-latest
    # A cold Rust build plus a kind cluster; the suites poll with a 120s
    # convergence budget per wait.
    timeout-minutes: 45

    strategy:
      # One suite failing must not cancel the rest: knowing that ONLY the pause
      # contract broke is most of the diagnosis.
      fail-fast: false
      matrix:
        # `suite` is the `make kind-e2e-<suite>` target; keep this list in sync
        # with E2E_SUITES in the Makefile.
        include:
          - suite: bootstrap
            name: Bootstrap install
          - suite: dry-run
            name: Bootstrap --dry-run
          - suite: escape-hatch
            name: Standalone provider
          - suite: workload
            name: Provider workload
          - suite: pause
            name: Pause semantics
          - suite: workload-namespace
            name: workloadNamespace override
          - suite: class
            name: ProviderClass propagation

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cache-cargo v1.4.0 keys on `rustc -vV`, so the toolchain comes first.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref, re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          # Pull requests restore main's cache but never save their own
          # (cache-cargo v1.4.0 keys per job, so main's entries stay useful).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `make kind-load` cross-compiles for the runner's own arch (amd64) and
      # side-loads the image, so no registry and no cross-toolchain is needed.
      #
      # Each job gets its own cluster name so nothing is shared even if two
      # ever land on one runner.
      - name: Run e2e suite ${{ matrix.suite }}
        env:
          KIND_NODE_IMAGE: ${{ inputs.kind_node_image || 'kindest/node:v1.31.0' }}
          KIND_CLUSTER_NAME: banlieue-e2e-${{ matrix.suite }}
          E2E_SUITE: ${{ matrix.suite }}
        run: make kind-e2e-ci

  # Cluster API, against real CAPI controllers (ADR-0096, ADR-0129). Each suite
  # builds its own fresh kind cluster and runs `clusterctl init` with the CAPI
  # release pinned in the Makefile, so the two share nothing:
  #   - capi:           the InfraMachine/InfraCluster status contract
  #   - capi-bootstrap: real kubeadm bootstrap data reaching banlieue machines,
  #                     with banlieue-controller running under its own
  #                     ServiceAccount (scripts/kind-capi-controller.sh)
  # CAPI v1.14 needs a v1.33+ management cluster, so kind v0.30 or newer.
  capi:
    name: 🧪 ${{ matrix.name }}
    needs: apiserver-check
    runs-on: ubuntu-latest
    # A cold build of the whole `banlieue` binary, a kind cluster and
    # clusterctl init; the suites poll with a 120s budget per wait.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: kind-e2e-capi
            name: CAPI contract
            cluster: banlieue-capi
          - target: kind-e2e-capi-bootstrap
            name: CAPI bootstrap data
            cluster: banlieue-capi-bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (moving ref, re-pin quarterly)

      - name: Cache cargo dependencies
        uses: firestoned/github-actions/rust/cache-cargo@f52366c4f57f0110012035ac1bcd0bee4075b3e9 # v1.4.0
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run ${{ matrix.name }}
        env:
          CAPI_KIND_CLUSTER_NAME: ${{ matrix.cluster }}
        run: make ${{ matrix.target }}
